<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recreio — Percursos</title><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="recreio.css?v=20261009-5">
</head>
<body>
<header><a id="backLessons" href="aluno.html">← Minhas aulas</a><span>Percursos</span></header>
<main>
<p id="gameIdentity" role="status"></p>
<section id="menu">
<p class="eyebrow">UMA PAUSA PARA BRINCAR</p>
<h1>Recreio</h1><p class="intro">Escolha um jogo. Pense com calma e tente quantas vezes quiser.</p>
<div class="cards">
<button data-game="logic"><span class="icon">◆</span><strong>Qual vem depois?</strong><small>Descubra a sequência.</small><span class="tag">Lógica</span></button>
<button data-game="words"><span class="icon">Aa</span><strong>Caça-palavras</strong><small>Palavras maiores e desafios variados.</small><span class="tag">Atenção</span></button>
<button data-game="crossword"><span class="icon">▦</span><strong>Palavras cruzadas</strong><small>Resolva as dicas e cruze as letras.</small><span class="tag">Palavras</span></button>
<button data-game="tic"><span class="icon">✕ ◯</span><strong>Jogo da velha</strong><small>Faça uma linha com três.</small><span class="tag">Estratégia</span></button>
<button data-game="hang"><span class="icon">_ A _</span><strong>Forca</strong><small>Descubra a palavra pela dica.</small><span class="tag">Palavras</span></button>
<button data-game="dots"><span class="icon">● ─ ●</span><strong>Jogo do pontinho</strong><small>Feche quadrados e marque pontos.</small><span class="tag">Estratégia</span></button>
<button data-game="math"><span class="icon">2 + 3</span><strong>Pequenos cálculos</strong><small>Contas variadas, no seu ritmo.</small><span class="tag">Matemática</span></button>
<button data-game="snake"><span class="icon">●━●</span><strong>Cobrinha</strong><small>Coma as frutas e cresça.</small><span class="tag">Coordenação</span></button>
</div>
<p class="note">Espaço livre para brincar. Os jogos não contam como aulas concluídas.</p>
</section>
<section id="game" hidden aria-labelledby="gameTitle">
<button id="backGames" class="quiet">← Escolher outro jogo</button>
<div class="game-heading"><h1 id="gameTitle"></h1><button id="restart">Jogar de novo ↻</button></div>
<p id="instructions" class="intro"></p>
<div id="board"></div>
<p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="recreio-session.js?v=20261009-1"></script>
<script src="recreio.js?v=20261009-5"></script>
</body></html>
