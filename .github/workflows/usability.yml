name: Usabilidade e regressões
on:
  pull_request:
  push:
    branches: [main, melhoria-usabilidade]
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/percursos-tracks.mjs
      - run: node tests/percursos-tracks-browser.mjs && node tests/percursos.mjs
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-usabilidade
          path: test-results/
