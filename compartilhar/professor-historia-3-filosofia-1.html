ps\">\u003cli>Revisar argumento e introduzir erros de relevância e generalização.\u003c/li>\u003cli>Analisar exemplos contextualizados, evitando caça automática a falácias.\u003c/li>\u003cli>Comparar persuasão retórica e justificativa argumentativa.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não apresente falácia como sinônimo de mentira intencional.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Argumento -&gt; evidência/relevância/inferência. Persuasão em camada paralela: linguagem, emoção, autoridade, imagem.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: erro de raciocínio que parece convincente. Q2: explicações conforme o texto. Q3: persuadir = levar a aceitar (por razões ou emoções); argumentar = oferecer razões avaliáveis. Q4: (a) ataque pessoal; (b) falso dilema; (c) generalização apressada. Q5: versão com premissas que sustentem uma conclusão mais modesta. Q6: não; serve para avaliar razões e melhorar o debate, não para vencer nem acusar.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003cp>Não há questão vinculada a esta aula na seleção pesquisada de 2016–2025. Isso não significa que o conteúdo nunca tenha sido cobrado.\u003c/p>","id":"s1-filosofia-semana-3","title":"EPICURISMO","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-sun\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\">\u003c/circle>\u003cpath d=\"M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M19 5l-3 3M8 16l-3 3\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-leaf\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M3 21C4 10 8 4 21 3c0 14-7 19-18 18zm0 0 12-12\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Epicurismo\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Epicuro\u003c/strong> — \u003cspan>Filósofo grego helenístico que relacionou felicidade à moderação dos desejos, à amizade e à tranquilidade.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>prazer\u003c/strong> — \u003cspan>Em Epicuro, estado de bem-estar associado sobretudo à ausência de sofrimento e à vida equilibrada.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>desejo\u003c/strong> — \u003cspan>Impulso ou aspiração cuja avaliação é importante, em Epicuro, para distinguir necessidades e excessos.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>ataraxia\u003c/strong> — \u003cspan>Estado de tranquilidade da mente valorizado por correntes filosóficas helenísticas.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-heart\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M20.5 5.5a5 5 0 0 0-7 0L12 7l-1.5-1.5a5 5 0 0 0-7 7L12 21l8.5-8.5a5 5 0 0 0 0-7z\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Para Epicuro, o prazer estável vem de desejos medidos, da amizade e da ausência de perturbação; não é exagero nem consumo.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 172\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Como Epicuro relaciona prazer, moderação e felicidade?\u003c/li>\u003cli>Por que distinguir desejos necessários de desejos excessivos é importante no epicurismo?\u003c/li>\u003cli>Como a busca da tranquilidade pode orientar escolhas cotidianas?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Desejos naturais e necessários\u003c/dt>\u003cdd>Ligam-se a necessidades cuja satisfação importa para viver, para o bem-estar do corpo ou para a felicidade. A classificação epicurista considera o papel do desejo na vida, não o preço do objeto.\u003c/dd>\u003cdt>Desejos naturais não necessários\u003c/dt>\u003cdd>Têm uma base natural, mas sua forma particular de satisfação não é indispensável. Uma variedade requintada de alimento pode variar o prazer sem ser necessária para remover a fome.\u003c/dd>\u003cdt>Desejos vazios ou vãos\u003c/dt>\u003cdd>Dependem de opiniões sem um limite natural de satisfação, como a busca ilimitada de prestígio, riqueza ou imortalidade. Não são simplesmente todos os desejos que dão trabalho.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Epicuro recomenda realizar todos os desejos?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Epicurismo\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Epicuro de Samos (341–270 a.C.) fundou em Atenas uma escola conhecida como Jardim: o nome vem da propriedade em que se ensinava e convivia filosoficamente. Para ele, a vida boa é a vida de prazer, mas prazer não significa excesso: inclui a ausência de dor corporal (aponia) e de perturbação da alma (ataraxia). São dimensões distintas do bem-estar. Epicuro distinguia desejos naturais e necessários, cuja satisfação importa para viver e para o bem-estar (como remover a fome e a sede); naturais e não necessários, cuja satisfação particular não é indispensável (como preferir comida refinada); e vãos, ligados a opiniões sem limite natural de satisfação (como exigir fama e riqueza ilimitadas). Os primeiros devem ser satisfeitos; os últimos, abandonados, porque geram ansiedade. A amizade e a conversa filosófica têm valor central para a tranquilidade. A moderação é, assim, condição da felicidade.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>O que é ataraxia?\u003c/li>\u003cli>Que tipos de desejos Epicuro distingue? Dê o exemplo de cada tipo citado no texto.\u003c/li>\u003cli>Que papel o texto atribui à amizade?\u003c/li>\u003cli>Nos exemplos didáticos, proponha uma classificação e justifique pelo motivo e pela necessidade: (a) beber água para matar a sede; (b) exigir sempre uma roupa mais cara para ser reconhecido como superior; (c) desejar uma variedade de pratos num encontro com amigos. Em (c), diferencie a variedade da comida e o valor da amizade.\u003c/li>\u003cli>Use 'moderação' para explicar por que, para Epicuro, desejar demais pode produzir sofrimento.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: epicurismo é 'viver sem limites'? Responda com 'ataraxia' e 'desejos vãos'.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Prazer, felicidade, desejos e medida.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Ler, pensar e responder\u003c/h4>\u003cp>Leitura mediada da p. 172, relacionando prazer epicurista, moderação e vida bem conduzida.\u003c/p>\u003cp class=\"atividade-aluno\">Lê o fragmento e responde à questão-problema sobre felicidade e satisfação dos desejos.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS501\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — formação ética\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">Epicuro\u003c/span>\u003cspan class=\"concept-chip\">prazer\u003c/span>\u003cspan class=\"concept-chip\">desejo\u003c/span>\u003cspan class=\"concept-chip\">ataraxia\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-sun\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\">\u003c/circle>\u003cpath d=\"M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M19 5l-3 3M8 16l-3 3\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-leaf\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M3 21C4 10 8 4 21 3c0 14-7 19-18 18zm0 0 12-12\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Epicurismo\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Epicuro\u003c/strong> — \u003cspan>Filósofo grego helenístico que relacionou felicidade à moderação dos desejos, à amizade e à tranquilidade.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>prazer\u003c/strong> — \u003cspan>Em Epicuro, estado de bem-estar associado sobretudo à ausência de sofrimento e à vida equilibrada.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>desejo\u003c/strong> — \u003cspan>Impulso ou aspiração cuja avaliação é importante, em Epicuro, para distinguir necessidades e excessos.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>ataraxia\u003c/strong> — \u003cspan>Estado de tranquilidade da mente valorizado por correntes filosóficas helenísticas.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-heart\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M20.5 5.5a5 5 0 0 0-7 0L12 7l-1.5-1.5a5 5 0 0 0-7 7L12 21l8.5-8.5a5 5 0 0 0 0-7z\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Para Epicuro, o prazer estável vem de desejos medidos, da amizade e da ausência de perturbação; não é exagero nem consumo.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 172\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Como Epicuro relaciona prazer, moderação e felicidade?\u003c/li>\u003cli>Por que distinguir desejos necessários de desejos excessivos é importante no epicurismo?\u003c/li>\u003cli>Como a busca da tranquilidade pode orientar escolhas cotidianas?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-3-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-3-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Desejos naturais e necessários\u003c/dt>\u003cdd>\u003cp>Ligam-se a necessidades cuja satisfação importa para viver, para o bem-estar do corpo ou para a felicidade. A classificação epicurista considera o papel do desejo na vida, não o preço do objeto.\u003c/p>\u003c/dd>\u003cdt>Desejos naturais não necessários\u003c/dt>\u003cdd>\u003cp>Têm uma base natural, mas sua forma particular de satisfação não é indispensável. Uma variedade requintada de alimento pode variar o prazer sem ser necessária para remover a fome.\u003c/p>\u003c/dd>\u003cdt>Desejos vazios ou vãos\u003c/dt>\u003cdd>\u003cp>Dependem de opiniões sem um limite natural de satisfação, como a busca ilimitada de prestígio, riqueza ou imortalidade. Não são simplesmente todos os desejos que dão trabalho.\u003c/p>\u003c/dd>\u003cdt>Autossuficiência\u003c/dt>\u003cdd>\u003cp>Capacidade de contentar-se com pouco quando necessário, reduzindo dependências que alimentam ansiedade. Não exige isolamento nem rejeição de todo prazer elaborado.\u003c/p>\u003c/dd>\u003cdt>O Jardim de Epicuro\u003c/dt>\u003cdd>\u003cp>Nome da propriedade comprada por Epicuro em Atenas, após seu retorno em 307/306 a.C., e, por extensão, de sua escola. Designa um espaço histórico de ensino e convivência, não uma metáfora de paraíso.\u003c/p>\u003c/dd>\u003cdt>Amizade\u003c/dt>\u003cdd>\u003cp>Relação valorizada na vida epicurista por sua contribuição à segurança e à felicidade. Mostra que autossuficiência não equivale a viver sem vínculos.\u003c/p>\u003c/dd>\u003cdt>Sensação e juízo\u003c/dt>\u003cdd>\u003cp>Na teoria epicurista, os erros não são simplesmente atribuídos ao sentir, mas ao juízo ou inferência acrescentados ao que aparece. Isso é uma tese dessa escola, não consenso da epistemologia contemporânea.\u003c/p>\u003c/dd>\u003cdt>Epicuro\u003c/dt>\u003cdd>\u003cp>Filósofo grego que fundou uma escola em Atenas. Sua ética do prazer integra uma investigação da natureza e do conhecimento; não se reduz a uma preferência pessoal por uma vida confortável.\u003c/p>\u003c/dd>\u003cdt>Desejo\u003c/dt>\u003cdd>\u003cp>Para classificar neste contexto, pergunte pela base natural, pela necessidade e pelo limite de satisfação. A simples intensidade de uma vontade não determina sua categoria.\u003c/p>\u003c/dd>\u003cdt>Prazer\u003c/dt>\u003cdd>\u003cp>Na ética epicurista, orienta a vida boa; a escolha de um prazer exige prudência quanto aos efeitos. Não equivale a intensidade máxima, excesso ou consumo permanente.\u003c/p>\u003c/dd>\u003cdt>Prudência\u003c/dt>\u003cdd>\u003cp>Discernimento prático das consequências das escolhas, que pode justificar renunciar a um prazer imediato ou suportar uma dor para evitar um sofrimento maior.\u003c/p>\u003c/dd>\u003cdt>Ataraxia\u003c/dt>\u003cdd>\u003cp>Ausência de perturbação da alma. Difere da aponia, ausência de dor corporal; não exige indiferença diante de vínculos e responsabilidades.\u003c/p>\u003c/dd>\u003cdt>Aponia\u003c/dt>\u003cdd>\u003cp>Ausência de dor corporal. A distinção da tranquilidade da alma impede confundir bem-estar epicurista com apenas satisfação física.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 3\u003c/div>\u003ch4>EPICURISMO\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Epicuro associa a vida boa à busca racional de prazer entendido sobretudo como ausência de perturbação e sofrimento desnecessário. A caricatura do 'epicurista' como alguém entregue a excessos distorce a escola. Distinguir desejos naturais e necessários, naturais não necessários e vazios ajuda a compreender a ética da medida (EPICURO, Carta a Meneceu).\u003c/p>\u003cp>O Jardim de Epicuro também oferece um ponto de discussão sobre amizade e comunidade filosófica. A felicidade não é apresentada como consumo ilimitado, mas como vida simples, amizade, reflexão e redução de medos, inclusive medo dos deuses e da morte.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-3-study-heading\">\u003ch4 id=\"s1-filosofia-semana-3-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Comece pela pergunta: o que este desejo procura remover ou alcançar? Diferencie a fome da exigência de uma comida específica e da exigência de ser reconhecido como superior por consumi-la. O objeto pode ser parecido, mas a necessidade, a dependência e o limite de satisfação mudam. Esses exemplos são aplicações didáticas da classificação, não frases literais de Epicuro.\u003c/p>\u003cp>O Jardim liga ensino e prática de vida: a filosofia inclui exame dos desejos e cultivo de vínculos. O estudo da natureza também integra o sistema. A tese materialista sobre a alma e a crítica do medo da morte ajudam a entender por que sua ética não é apenas um conselho de moderação. A Carta a Meneceu apresenta a orientação ética; as Máximas XXIX–XXX explicitam as classes de desejo. Nossa reconstrução depende de textos e testemunhos transmitidos, sobretudo por Diógenes Laércio: não possuímos intacta toda a obra de Epicuro.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Não classifique pessoas, nem moralize necessidades ligadas à pobreza. A distinção entre categorias orienta o exame de desejos; a classe concreta exige considerar finalidade e crenças. A condição social do Jardim não autoriza descrevê-lo como instituição igualitária nos termos atuais. Não se afirma aqui um currículo completo ou uma composição social da escola sem fonte específica.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Uma pessoa está com fome; prefere uma refeição sofisticada; e acredita que precisa sempre da opção mais cara para ser respeitada.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>A fome exemplifica a necessidade; a preferência culinária pode exemplificar desejo natural não necessário; a exigência ilimitada de reconhecimento pelo preço pode exemplificar desejo vazio. São hipóteses sobre motivos, não diagnósticos automáticos sobre consumo.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://classics.mit.edu/Epicurus/menoec.html\" target=\"_blank\" rel=\"noopener\">Epicuro — Carta a Meneceu, §§127–132; tradução inglesa de Robert Drew Hicks, Internet Classics Archive/MIT\u003c/a>\u003cp>Fonte primária: classificação dos desejos e escolha prudente de prazeres.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://classics.mit.edu/Epicurus/princdoc.html\" target=\"_blank\" rel=\"noopener\">Epicuro — Máximas principais, XXIX–XXX; tradução inglesa, Internet Classics Archive/MIT\u003c/a>\u003cp>Fonte primária: desejos naturais, necessários e opiniões vazias.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/epicurus/\" target=\"_blank\" rel=\"noopener\">David Konstan — Epicurus, Stanford Encyclopedia of Philosophy, seções 1, 2, 4 e 6\u003c/a>\u003cp>Estudo de referência: fontes antigas, Jardim, conhecimento e ética.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">A escola de Epicuro ficou conhecida como 'Jardim', nome ligado à propriedade em que sua comunidade se reunia; a filosofia era praticada como modo de vida, não só como teoria.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Compare desejo e consumo: a pergunta é filosófica — todo desejo merece ser satisfeito? — sem transformar a aula em conselho pessoal.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Epicuro recomenda realizar todos os desejos?\u003c/h5>\u003cp>Epicuro recomenda examinar desejos e consequências: alguns são necessários à vida, outros naturais mas dispensáveis; desejos vãos dependem de opiniões sem limite.\u003c/p>\u003cp>Limite da resposta: Não classifique pessoas, nem moralize necessidades ligadas à pobreza. A distinção entre categorias orienta o exame de desejos; a classe concreta exige considerar finalidade e crenças. A condição social do Jardim não autoriza descrevê-lo como instituição igualitária nos termos atuais. Não se afirma aqui um currículo completo ou uma composição social da escola sem fonte específica.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Desejos naturais e necessários\u003c/dt>\u003cdd>Ligam-se a necessidades cuja satisfação importa para viver, para o bem-estar do corpo ou para a felicidade. A classificação epicurista considera o papel do desejo na vida, não o preço do objeto.\u003c/dd>\u003cdt>Desejos naturais não necessários\u003c/dt>\u003cdd>Têm uma base natural, mas sua forma particular de satisfação não é indispensável. Uma variedade requintada de alimento pode variar o prazer sem ser necessária para remover a fome.\u003c/dd>\u003cdt>Desejos vazios ou vãos\u003c/dt>\u003cdd>Dependem de opiniões sem um limite natural de satisfação, como a busca ilimitada de prestígio, riqueza ou imortalidade. Não são simplesmente todos os desejos que dão trabalho.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Epicuro recomenda realizar todos os desejos?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Desmontar a associação Epicuro = excesso.\u003c/li>\u003cli>Classificar desejos e discutir medida.\u003c/li>\u003cli>Relacionar prazer, amizade, tranquilidade e autonomia.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não reduzir ataraxia a 'não sentir nada'.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Desejos -&gt; avaliar necessidade e consequência -&gt; prazer estável/tranquilidade. Acrescente amizade e reflexão.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: tranquilidade da alma, ausência de perturbação. Q2: naturais e necessários (comer, beber); naturais e não necessários (comida refinada); vãos (fama, riqueza ilimitada). Q3: central para a tranquilidade. Q4: (a) natural e necessário, pela necessidade de remover a sede; (b) vão, pela busca ilimitada de superioridade; (c) a variedade culinária pode ser natural não necessária, mas a amizade tem valor próprio. Aceitar distinções justificadas; não classificar o encontro inteiro automaticamente. Q5: desejos excessivos geram ansiedade e insatisfação; a moderação preserva a tranquilidade. Q6: não; busca prazer estável e ataraxia, abandonando desejos vãos.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003cp>Não há questão vinculada a esta aula na seleção pesquisada de 2016–2025. Isso não significa que o conteúdo nunca tenha sido cobrado.\u003c/p>","id":"s1-filosofia-semana-4","title":"ESTOICISMO E CETICISMO","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-compass\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m15 9-3 8-3-5 6-3z\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-question\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M9 8a4 4 0 1 1 6 3c-2 1-3 2-3 4M12 19h.01\">\u003c/path>\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Estoicismo e ceticismo\u003c/div>\u003ctable class=\"registro-tabela\">\u003ctbody>\u003ctr>\u003cth>Ideia\u003c/th>\u003cth>Em poucas palavras\u003c/th>\u003c/tr>\u003ctr>\u003ctd>estoicismo\u003c/td>\u003ctd>Corrente helenística que valoriza razão, virtude e domínio das próprias respostas diante do que não controlamos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ceticismo\u003c/td>\u003ctd>Corrente filosófica que questiona a possibilidade de certeza e valoriza exame crítico e suspensão do juízo.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>autocontrole\u003c/td>\u003ctd>Capacidade de regular ações e respostas diante de desejos, emoções e circunstâncias.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>suspensão do juízo\u003c/td>\u003ctd>Atitude de não afirmar nem negar algo quando não há razões suficientes para decidir.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-brain\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M12 5a4 4 0 0 0-7 2A4 4 0 0 0 3 14a4 4 0 0 0 4 5 4 4 0 0 0 5 3V5zm0 0a4 4 0 0 1 7 2 4 4 0 0 1 2 7 4 4 0 0 1-4 5 4 4 0 0 1-5 3M7 10l3 2M6 17l3-2m8-5-3 2m4 5-3-2\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> O estoicismo trabalha o que depende de nós; o ceticismo suspende o juízo quando as razões se equilibram; nenhum dos dois é passividade.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Que diferenças existem entre estoicismo e ceticismo diante das dificuldades da vida?\u003c/li>\u003cli>Como o estoicismo distingue aquilo que depende de nós daquilo que não depende?\u003c/li>\u003cli>Que papel a suspensão do juízo pode ter na postura cética?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>O que depende de nós — em Epicteto\u003c/dt>\u003cdd>O Manual distingue juízos, escolhas e impulsos de resultados e condições externos. Preparar uma ação não garante controlar tudo o que ela produzirá.\u003c/dd>\u003cdt>Virtude estoica\u003c/dt>\u003cdd>Excelência do agir racional; para os estoicos, é central ao bem viver. Bens externos não recebem o mesmo estatuto moral da virtude, embora possam ser preferíveis.\u003c/dd>\u003cdt>Epoché e investigação pirrônica\u003c/dt>\u003cdd>Epoché é suspensão do assentimento diante de razões em oposição que não se consegue decidir. Mantém-se a investigação: não equivale à tese dogmática de que nada pode ser conhecido.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Suspender o juízo é desistir de investigar?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Estoicismo e ceticismo\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Depois de Aristóteles, escolas helenísticas propuseram caminhos para viver bem em tempos de incerteza. Os estoicos, como Epicteto (c. 50–c. 135 d.C.), afirmam que algumas coisas dependem de nós, como nossas opiniões, desejos e ações, e outras não, como a opinião alheia, o clima ou o resultado de uma prova. A tranquilidade vem de dedicar esforço ao que depende de nós e aceitar o resto com serenidade. Os céticos, como Pirro, sustentam que, quando razões opostas têm peso semelhante, devemos suspender o juízo, isto é, não afirmar nem negar, e assim evitar a perturbação de falsas certezas. Nenhuma das duas posturas é passividade: ambas pedem exame cuidadoso da vida e das próprias crenças.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Para os estoicos, o que depende de nós e o que não depende?\u003c/li>\u003cli>O que é suspender o juízo?\u003c/li>\u003cli>Por que o texto afirma que nenhuma das duas posturas é passividade?\u003c/li>\u003cli>Você estudou muito, mas a prova foi cancelada. Separe, em duas colunas, o que depende de você e o que não depende.\u003c/li>\u003cli>Como um estoico e como um cético reagiriam a uma notícia duvidosa nas redes? Use 'suspensão do juízo'.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: qual dessas escolas ajuda mais a lidar com a incerteza? Justifique com um conceito.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Liberdade, autocontrole, dúvida e serenidade.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Percurso didático\u003c/h4>\u003cp>Aula comparativa com situações concretas, colocando epicurismo, estoicismo e ceticismo diante do desejo, do sofrimento e da incerteza.\u003c/p>\u003cp class=\"atividade-aluno\">Analisa situações e relaciona cada uma às perspectivas filosóficas estudadas.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS501\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — formação ética\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">estoicismo\u003c/span>\u003cspan class=\"concept-chip\">ceticismo\u003c/span>\u003cspan class=\"concept-chip\">autocontrole\u003c/span>\u003cspan class=\"concept-chip\">suspensão do juízo\u003c/span>\u003c/div>\u003cdiv class=\"concept-definitions\">\u003cdiv class=\"concept-definitions-title\">Vocabulário da aula\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>estoicismo — \u003c/strong>Corrente helenística que valoriza razão, virtude e domínio das próprias respostas diante do que não controlamos.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>ceticismo — \u003c/strong>Corrente filosófica que questiona a possibilidade de certeza e valoriza exame crítico e suspensão do juízo.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>autocontrole — \u003c/strong>Capacidade de regular ações e respostas diante de desejos, emoções e circunstâncias.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>suspensão do juízo — \u003c/strong>Atitude de não afirmar nem negar algo quando não há razões suficientes para decidir.\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-compass\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m15 9-3 8-3-5 6-3z\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-question\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M9 8a4 4 0 1 1 6 3c-2 1-3 2-3 4M12 19h.01\">\u003c/path>\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Estoicismo e ceticismo\u003c/div>\u003ctable class=\"registro-tabela\">\u003ctbody>\u003ctr>\u003cth>Ideia\u003c/th>\u003cth>Em poucas palavras\u003c/th>\u003c/tr>\u003ctr>\u003ctd>estoicismo\u003c/td>\u003ctd>Corrente helenística que valoriza razão, virtude e domínio das próprias respostas diante do que não controlamos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ceticismo\u003c/td>\u003ctd>Corrente filosófica que questiona a possibilidade de certeza e valoriza exame crítico e suspensão do juízo.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>autocontrole\u003c/td>\u003ctd>Capacidade de regular ações e respostas diante de desejos, emoções e circunstâncias.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>suspensão do juízo\u003c/td>\u003ctd>Atitude de não afirmar nem negar algo quando não há razões suficientes para decidir.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-brain\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M12 5a4 4 0 0 0-7 2A4 4 0 0 0 3 14a4 4 0 0 0 4 5 4 4 0 0 0 5 3V5zm0 0a4 4 0 0 1 7 2 4 4 0 0 1 2 7 4 4 0 0 1-4 5 4 4 0 0 1-5 3M7 10l3 2M6 17l3-2m8-5-3 2m4 5-3-2\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> O estoicismo trabalha o que depende de nós; o ceticismo suspende o juízo quando as razões se equilibram; nenhum dos dois é passividade.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Que diferenças existem entre estoicismo e ceticismo diante das dificuldades da vida?\u003c/li>\u003cli>Como o estoicismo distingue aquilo que depende de nós daquilo que não depende?\u003c/li>\u003cli>Que papel a suspensão do juízo pode ter na postura cética?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-4-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-4-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>O que depende de nós — em Epicteto\u003c/dt>\u003cdd>\u003cp>O Manual distingue juízos, escolhas e impulsos de resultados e condições externos. Preparar uma ação não garante controlar tudo o que ela produzirá.\u003c/p>\u003c/dd>\u003cdt>Virtude estoica\u003c/dt>\u003cdd>\u003cp>Excelência do agir racional; para os estoicos, é central ao bem viver. Bens externos não recebem o mesmo estatuto moral da virtude, embora possam ser preferíveis.\u003c/p>\u003c/dd>\u003cdt>Epoché e investigação pirrônica\u003c/dt>\u003cdd>\u003cp>Epoché é suspensão do assentimento diante de razões em oposição que não se consegue decidir. Mantém-se a investigação: não equivale à tese dogmática de que nada pode ser conhecido.\u003c/p>\u003c/dd>\u003cdt>estoicismo\u003c/dt>\u003cdd>\u003cp>Corrente helenística que valoriza razão, virtude e domínio das próprias respostas diante do que não controlamos.\u003c/p>\u003c/dd>\u003cdt>ceticismo\u003c/dt>\u003cdd>\u003cp>Corrente filosófica que questiona a possibilidade de certeza e valoriza exame crítico e suspensão do juízo.\u003c/p>\u003c/dd>\u003cdt>autocontrole\u003c/dt>\u003cdd>\u003cp>Capacidade de regular ações e respostas diante de desejos, emoções e circunstâncias.\u003c/p>\u003c/dd>\u003cdt>suspensão do juízo\u003c/dt>\u003cdd>\u003cp>Atitude de não afirmar nem negar algo quando não há razões suficientes para decidir.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 4\u003c/div>\u003ch4>ESTOICISMO E CETICISMO\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>O estoicismo distingue aquilo que depende de nossas escolhas daquilo que não depende de nós, mas isso não significa passividade social ou supressão de emoções. A ética estoica trabalha juízo, virtude e resposta racional às circunstâncias. Epicteto, antigo escravizado que se tornou professor, é uma figura importante para discutir liberdade interior sem romantizar a escravidão.\u003c/p>\u003cp>O ceticismo antigo, especialmente na tradição pirrônica, valoriza a suspensão do juízo quando razões opostas permanecem equilibradas. Dúvida, nesse caso, não é simples indecisão; é prática filosófica contra a precipitação dogmática.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-4-study-heading\">\u003ch4 id=\"s1-filosofia-semana-4-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>A comparação deve conservar a diferença: o estoico sustenta uma orientação sobre o bem e a ação; o pirrônico problematiza assentimentos quando os argumentos se equilibram. Ambos discutem tranquilidade, mas não chegam a ela pela mesma via.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>O controle de juízos não elimina coerção, doença ou desigualdade. Não converta filosofia em explicação psicológica de sofrimento nem atribua a vítimas a responsabilidade por suportar injustiças.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Após estudar, uma personagem recebe resultado abaixo do esperado; outra compara relatos incompatíveis sem dados suficientes.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>No primeiro caso, separar preparação e resultado permite discutir Epicteto. No segundo, adiar a conclusão pode exemplificar suspensão. Os personagens são fictícios.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://classics.mit.edu/Epictetus/epicench.html\" target=\"_blank\" rel=\"noopener\">Epicteto — Manual, seção 1; tradução inglesa, Internet Classics Archive/MIT\u003c/a>\u003cp>Fonte primária: o que depende de nós.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/stoicism/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Stoicism\u003c/a>\u003cp>Referência conceitual: virtude e paixões.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/skepticism-ancient/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Ancient Skepticism\u003c/a>\u003cp>Referência conceitual: investigação e suspensão do juízo.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Epicteto nasceu em condição de escravidão no mundo romano e mais tarde ensinou filosofia; seus ensinamentos foram registrados por Arriano.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Use situações escolares sobre expectativa e resultado para diferenciar preparação, ação e aquilo que escapa ao controle.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Suspender o juízo é desistir de investigar?\u003c/h5>\u003cp>No pirronismo, suspensão do juízo evita afirmar além das razões disponíveis e acompanha a investigação; não equivale a provar que conhecer é impossível.\u003c/p>\u003cp>Limite da resposta: O controle de juízos não elimina coerção, doença ou desigualdade. Não converta filosofia em explicação psicológica de sofrimento nem atribua a vítimas a responsabilidade por suportar injustiças.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>O que depende de nós — em Epicteto\u003c/dt>\u003cdd>O Manual distingue juízos, escolhas e impulsos de resultados e condições externos. Preparar uma ação não garante controlar tudo o que ela produzirá.\u003c/dd>\u003cdt>Virtude estoica\u003c/dt>\u003cdd>Excelência do agir racional; para os estoicos, é central ao bem viver. Bens externos não recebem o mesmo estatuto moral da virtude, embora possam ser preferíveis.\u003c/dd>\u003cdt>Epoché e investigação pirrônica\u003c/dt>\u003cdd>Epoché é suspensão do assentimento diante de razões em oposição que não se consegue decidir. Mantém-se a investigação: não equivale à tese dogmática de que nada pode ser conhecido.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Suspender o juízo é desistir de investigar?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Distinguir controle de acontecimentos e controle de respostas.\u003c/li>\u003cli>Apresentar Epicteto e a noção de liberdade interior com cuidado histórico.\u003c/li>\u003cli>Introduzir ceticismo e suspensão do juízo; comparar com dogmatismo.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não transformar estoicismo em 'aguente tudo calado' nem ceticismo em 'nada é verdade'.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Estoicismo: juízo -&gt; escolha -&gt; ação. Ceticismo: razões em conflito -&gt; suspensão do juízo -&gt; investigação continuada.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: depende: opiniões, desejos, ações; não depende: opinião alheia, clima, resultado de prova. Q2: não afirmar nem negar quando as razões se equilibram. Q3: ambas pedem exame cuidadoso da vida e das crenças. Q4: depende: estudar, reorganizar plano; não depende: o cancelamento. Q5: estoico foca no que pode fazer (checar, não repassar); cético suspende o juízo até haver razões. Q6: posição defendida com um conceito do texto.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Questões relacionadas ao conteúdo desta semana\u003c/p>\u003cp class=\"ux-editorial-note\">Direta: o conteúdo cobrado coincide com a aula. Aproximação: permite comparação ou aprofundamento. O ano é a edição do exame. A numeração depende do caderno indicado.\u003c/p>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-005\">\u003ch5>Enem — aplicação regular · 2020\u003c/h5>\u003cp class=\"ux-exam-theme\">O estigma associado às doenças mentais na sociedade brasileira\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Discutir dignidade, reconhecimento e barreiras ao exercício de direitos; as redações não exigem um autor específico de reconhecimento.\u003c/p>\u003cp>Edição 2020, aplicação impressa em janeiro de 2021.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/c7f9eb38-a261-4c58-a1f0-21b68d7be34e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-006\">\u003ch5>Enem — aplicação regular · 2021\u003c/h5>\u003cp class=\"ux-exam-theme\">Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Discutir dignidade, reconhecimento e barreiras ao exercício de direitos; as redações não exigem um autor específico de reconhecimento.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/0ec029ac-140b-424a-9c62-f96095c25d3c/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-002\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a formação educacional de surdos no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Discutir dignidade, reconhecimento e barreiras ao exercício de direitos; as redações não exigem um autor específico de reconhecimento.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003cp class=\"ux-editorial-note\">Seleção documentada de 59 registros das edições 2016–2025; não é levantamento exaustivo nem previsão de prova. Um tema de redação não comprova que a prova exigiu o filósofo desta aula.\u003c/p>\u003c/section>","id":"s1-filosofia-semana-5","title":"DIGNIDADE E RECONHECIMENTO","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-hands\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M2 12 8 8l4 3 4-3 6 4-5 7h-3l-2-3-2 3H7zM8 8l-2-4M16 8l2-4\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-heart\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M20.5 5.5a5 5 0 0 0-7 0L12 7l-1.5-1.5a5 5 0 0 0-7 7L12 21l8.5-8.5a5 5 0 0 0 0-7z\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Dignidade e reconhecimento\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>dignidade\u003c/strong> — \u003cspan>Valor atribuído à pessoa enquanto sujeito merecedor de respeito e consideração moral.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>alteridade\u003c/strong> — \u003cspan>Reconhecimento do outro como sujeito distinto, com perspectivas e experiências próprias.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>reconhecimento\u003c/strong> — \u003cspan>Processo social e moral pelo qual pessoas e grupos têm sua dignidade, identidade ou direitos considerados.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>justiça\u003c/strong> — \u003cspan>Princípio relacionado à distribuição de direitos, deveres, oportunidades e tratamento devido às pessoas.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-people\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"8\" cy=\"7\" r=\"3\">\u003c/circle>\u003ccircle cx=\"17\" cy=\"8\" r=\"2.5\">\u003c/circle>\u003cpath d=\"M2 21v-3a6 6 0 0 1 12 0v3H2zm12-8a5 5 0 0 1 8 4v4h-5\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Dignidade é o valor de cada pessoa; reconhecimento é a sociedade tratá-la como tal, e a falta dele é uma forma de injustiça.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 135\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que significa afirmar que a dignidade não depende da posição social de uma pessoa?\u003c/li>\u003cli>Como o reconhecimento influencia a forma como indivíduos e grupos são tratados?\u003c/li>\u003cli>Que relação pode ser estabelecida entre dignidade, respeito e direitos?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Dignidade e instrumentalização\u003c/dt>\u003cdd>Dignidade designa um estatuto de valor que impede reduzir uma pessoa a simples recurso. Instrumentalização ocorre quando sua agência e seus interesses são tratados como descartáveis.\u003c/dd>\u003cdt>Alteridade\u003c/dt>\u003cdd>Condição de o outro não se reduzir à imagem que fazemos dele. Reconhecer alteridade exige admitir que nossa descrição pode ser incompleta e contestada pelo próprio sujeito.\u003c/dd>\u003cdt>Reconhecimento\u003c/dt>\u003cdd>Relação em que alguém é considerado portador de um estatuto, capacidades ou direitos; teorias do reconhecimento relacionam essa dimensão às condições sociais de formação da identidade. Não é mero elogio.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Reconhecer alguém exige concordar com tudo o que faz?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Dignidade e reconhecimento\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Dignidade é o valor que toda pessoa tem apenas por ser pessoa, e que não depende de riqueza, cargo, origem ou aparência. Essa ideia está na base dos Direitos Humanos: a Declaração Universal de 1948 afirma que todos nascem livres e iguais em dignidade e direitos. Mas ter dignidade não é o mesmo que ser reconhecido. Reconhecimento é a sociedade tratar cada pessoa como alguém com direitos, voz e valor, respeitando também suas diferenças. Quando um grupo é ignorado, humilhado ou tratado como inferior, há falta de reconhecimento, e isso é uma forma de injustiça social, pois limita o acesso a direitos e oportunidades. Reconhecer a diferença faz parte da justiça.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>O que é dignidade, segundo o texto?\u003c/li>\u003cli>Em que a dignidade se diferencia do reconhecimento?\u003c/li>\u003cli>Por que, segundo o texto, a falta de reconhecimento é uma injustiça?\u003c/li>\u003cli>Descreva uma situação (real ou fictícia, sem identificar pessoas) em que um grupo é tratado sem reconhecimento e diga que direito fica limitado.\u003c/li>\u003cli>Use 'dignidade' e 'reconhecimento' para explicar por que reconhecer a diferença faz parte da justiça.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: a dignidade de uma pessoa depende de sua posição social? Argumente.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Dignidade humana, alteridade e reconhecimento.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Leitura e atividade\u003c/h4>\u003cp>Honneth é apresentado em material autoral. As p. 133-135 ampliam a discussão com Iris Young e Nancy Fraser, ligando reconhecimento, diferença e justiça social.\u003c/p>\u003cp class=\"atividade-aluno\">Relaciona reconhecimento e justiça social, aplica os conceitos a situações de exclusão e resolve p. 135, Explore 2.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS501; EM13CHS502; EM13CHS605\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — habilidade central da aula\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">dignidade\u003c/span>\u003cspan class=\"concept-chip\">alteridade\u003c/span>\u003cspan class=\"concept-chip\">reconhecimento\u003c/span>\u003cspan class=\"concept-chip\">justiça\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-hands\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M2 12 8 8l4 3 4-3 6 4-5 7h-3l-2-3-2 3H7zM8 8l-2-4M16 8l2-4\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-heart\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M20.5 5.5a5 5 0 0 0-7 0L12 7l-1.5-1.5a5 5 0 0 0-7 7L12 21l8.5-8.5a5 5 0 0 0 0-7z\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Dignidade e reconhecimento\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>dignidade\u003c/strong> — \u003cspan>Valor atribuído à pessoa enquanto sujeito merecedor de respeito e consideração moral.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>alteridade\u003c/strong> — \u003cspan>Reconhecimento do outro como sujeito distinto, com perspectivas e experiências próprias.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>reconhecimento\u003c/strong> — \u003cspan>Processo social e moral pelo qual pessoas e grupos têm sua dignidade, identidade ou direitos considerados.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>justiça\u003c/strong> — \u003cspan>Princípio relacionado à distribuição de direitos, deveres, oportunidades e tratamento devido às pessoas.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-people\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"8\" cy=\"7\" r=\"3\">\u003c/circle>\u003ccircle cx=\"17\" cy=\"8\" r=\"2.5\">\u003c/circle>\u003cpath d=\"M2 21v-3a6 6 0 0 1 12 0v3H2zm12-8a5 5 0 0 1 8 4v4h-5\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Dignidade é o valor de cada pessoa; reconhecimento é a sociedade tratá-la como tal, e a falta dele é uma forma de injustiça.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 135\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que significa afirmar que a dignidade não depende da posição social de uma pessoa?\u003c/li>\u003cli>Como o reconhecimento influencia a forma como indivíduos e grupos são tratados?\u003c/li>\u003cli>Que relação pode ser estabelecida entre dignidade, respeito e direitos?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-5-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-5-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Dignidade e instrumentalização\u003c/dt>\u003cdd>\u003cp>Dignidade designa um estatuto de valor que impede reduzir uma pessoa a simples recurso. Instrumentalização ocorre quando sua agência e seus interesses são tratados como descartáveis.\u003c/p>\u003c/dd>\u003cdt>Alteridade\u003c/dt>\u003cdd>\u003cp>Condição de o outro não se reduzir à imagem que fazemos dele. Reconhecer alteridade exige admitir que nossa descrição pode ser incompleta e contestada pelo próprio sujeito.\u003c/p>\u003c/dd>\u003cdt>Reconhecimento\u003c/dt>\u003cdd>\u003cp>Relação em que alguém é considerado portador de um estatuto, capacidades ou direitos; teorias do reconhecimento relacionam essa dimensão às condições sociais de formação da identidade. Não é mero elogio.\u003c/p>\u003c/dd>\u003cdt>dignidade\u003c/dt>\u003cdd>\u003cp>Valor atribuído à pessoa enquanto sujeito merecedor de respeito e consideração moral.\u003c/p>\u003c/dd>\u003cdt>justiça\u003c/dt>\u003cdd>\u003cp>Princípio relacionado à distribuição de direitos, deveres, oportunidades e tratamento devido às pessoas.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 5\u003c/div>\u003ch4>DIGNIDADE E RECONHECIMENTO\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Dignidade pode ser tratada como princípio segundo o qual pessoas não devem ser reduzidas a objetos ou instrumentos. Alteridade introduz o problema do outro como sujeito irredutível às nossas categorias. Reconhecimento, em Hegel e em autores contemporâneos como Axel Honneth, permite pensar como identidades e autoestima dependem também de relações sociais.\u003c/p>\u003cp>Para ampliar o cânone, a filosofia latino-americana da libertação de Enrique Dussel chama atenção para o ponto de vista daqueles que aparecem como exterioridade ou vítimas de ordens sociais. O ganho não é trocar Kant ou Hegel por Dussel, mas perguntar de onde falamos quando definimos universalidade, dignidade e humanidade.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-5-study-heading\">\u003ch4 id=\"s1-filosofia-semana-5-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Faça a passagem do princípio abstrato à relação: quem decide, quem pode responder e quem é tratado como objeto? Uma análise de reconhecimento pergunta por práticas e instituições, não apenas por sentimentos individuais. Kant, Hegel, Honneth e Dussel não oferecem formulações idênticas.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>A aproximação entre autores é uma comparação didática. Não apresente exterioridade em Dussel como simples outro nome para reconhecimento em Honneth. Para aprofundar essa comparação, é necessária leitura específica das obras.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Uma comissão consulta moradores, mas descarta suas respostas sem lhes permitir contestar a decisão.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>Pergunte se houve apenas presença formal ou possibilidade efetiva de voz. O caso inventado não prova uma violação real.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/recognition/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Recognition\u003c/a>\u003cp>Estudo de referência: dimensões normativas e sociais do reconhecimento.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Dussel construiu parte decisiva de sua filosofia entre Argentina e México, articulando tradição filosófica europeia e experiência histórica latino-americana.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Compare reconhecimento social e identidade digital apenas para perguntar como olhares externos influenciam autoimagem.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Reconhecer alguém exige concordar com tudo o que faz?\u003c/h5>\u003cp>Reconhecimento da dignidade e da condição de interlocutor pode coexistir com crítica fundamentada às ações e ideias.\u003c/p>\u003cp>Limite da resposta: A aproximação entre autores é uma comparação didática. Não apresente exterioridade em Dussel como simples outro nome para reconhecimento em Honneth. Para aprofundar essa comparação, é necessária leitura específica das obras.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Dignidade e instrumentalização\u003c/dt>\u003cdd>Dignidade designa um estatuto de valor que impede reduzir uma pessoa a simples recurso. Instrumentalização ocorre quando sua agência e seus interesses são tratados como descartáveis.\u003c/dd>\u003cdt>Alteridade\u003c/dt>\u003cdd>Condição de o outro não se reduzir à imagem que fazemos dele. Reconhecer alteridade exige admitir que nossa descrição pode ser incompleta e contestada pelo próprio sujeito.\u003c/dd>\u003cdt>Reconhecimento\u003c/dt>\u003cdd>Relação em que alguém é considerado portador de um estatuto, capacidades ou direitos; teorias do reconhecimento relacionam essa dimensão às condições sociais de formação da identidade. Não é mero elogio.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Reconhecer alguém exige concordar com tudo o que faz?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Questões relacionadas ao conteúdo desta semana\u003c/p>\u003cp class=\"ux-editorial-note\">Direta: o conteúdo cobrado coincide com a aula. Aproximação: permite comparação ou aprofundamento. O ano é a edição do exame. A numeração depende do caderno indicado.\u003c/p>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-005\">\u003ch5>Enem — aplicação regular · 2020\u003c/h5>\u003cp class=\"ux-exam-theme\">O estigma associado às doenças mentais na sociedade brasileira\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Discutir dignidade, reconhecimento e barreiras ao exercício de direitos; as redações não exigem um autor específico de reconhecimento.\u003c/p>\u003cp>Edição 2020, aplicação impressa em janeiro de 2021.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/c7f9eb38-a261-4c58-a1f0-21b68d7be34e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-006\">\u003ch5>Enem — aplicação regular · 2021\u003c/h5>\u003cp class=\"ux-exam-theme\">Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Discutir dignidade, reconhecimento e barreiras ao exercício de direitos; as redações não exigem um autor específico de reconhecimento.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/0ec029ac-140b-424a-9c62-f96095c25d3c/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-002\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a formação educacional de surdos no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Discutir dignidade, reconhecimento e barreiras ao exercício de direitos; as redações não exigem um autor específico de reconhecimento.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003cp class=\"ux-editorial-note\">Seleção documentada de 59 registros das edições 2016–2025; não é levantamento exaustivo nem previsão de prova. Um tema de redação não comprova que a prova exigiu o filósofo desta aula.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Definir dignidade e problema da instrumentalização.\u003c/li>\u003cli>Trabalhar alteridade por situações de reconhecimento e estereótipo.\u003c/li>\u003cli>Relacionar reconhecimento a uma pergunta de filosofia latino-americana: quem fica fora do 'universal'?\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não tratar 'o outro' como categoria exótica; alteridade é relação entre sujeitos.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Dignidade -&gt; alteridade -&gt; reconhecimento. Acrescente 'universalidade: quem é incluído?' como pergunta lateral.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: valor de toda pessoa, independente de riqueza, cargo, origem ou aparência. Q2: dignidade é o valor que a pessoa tem; reconhecimento é a sociedade tratar a pessoa como tal. Q3: limita o acesso a direitos e oportunidades. Q4: situação plausível, sem expor pessoas, com direito limitado. Q5: sem reconhecer diferenças e grupos, a igualdade formal não se concretiza. Q6: não; a dignidade vale para todos; a sociedade é que pode falhar em reconhecê-la.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Questões relacionadas ao conteúdo desta semana\u003c/p>\u003cp class=\"ux-editorial-note\">Direta: o conteúdo cobrado coincide com a aula. Aproximação: permite comparação ou aprofundamento. O ano é a edição do exame. A numeração depende do caderno indicado.\u003c/p>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-059\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Liberdade, responsabilidade e relativismo ético-moral\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · Filosofia discursiva, questão 2 · Humanas, 2º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cp>Exercitar a comparação de razões e critérios éticos no fechamento; essas provas não cobram Epicuro, Epicteto ou os céticos.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-005\">\u003ch5>Enem — aplicação regular · 2020\u003c/h5>\u003cp class=\"ux-exam-theme\">O estigma associado às doenças mentais na sociedade brasileira\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cp>Exercitar a comparação de razões e critérios éticos no fechamento; essas provas não cobram Epicuro, Epicteto ou os céticos.\u003c/p>\u003cp>Edição 2020, aplicação impressa em janeiro de 2021.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/c7f9eb38-a261-4c58-a1f0-21b68d7be34e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003cp class=\"ux-editorial-note\">Seleção documentada de 59 registros das edições 2016–2025; não é levantamento exaustivo nem previsão de prova. Um tema de redação não comprova que a prova exigiu o filósofo desta aula.\u003c/p>\u003c/section>","id":"s1-filosofia-semana-6","title":"FECHAMENTO DO BIMESTRE","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-book\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M12 6c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1zm0 0v15\">\u003c/path>\u003cpath d=\"M4 8h5m-5 3h5m6-3h5m-5 3h5\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-speech\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M4 4h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 3v-3a2 2 0 0 1-1-2V6a2 2 0 0 1 2-2zM7 9h10M7 13h7\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Fechamento do bimestre\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>argumentação\u003c/strong> — \u003cspan>Prática de formular, organi
