ass=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Um país fictício amplia trocas externas e, ao mesmo tempo, reforça uma proteção social.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>O exemplo separa conexão internacional e escolha regulatória; não demonstra o sucesso de uma política real.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/neoliberalism/index.html\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Neoliberalism\u003c/a>\u003cp>Referência conceitual: termo disputado e diversidade de formulações.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/globalization/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Globalization\u003c/a>\u003cp>Referência conceitual: conexões transnacionais e divergências explicativas.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Um produto simples pode envolver projeto num país, minerais de outro, montagem em outro e venda global; a etiqueta raramente mostra toda a cadeia.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Reconstrua a cadeia de um objeto cotidiano para discutir globalização sem depender de marcas específicas.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Globalização e neoliberalismo são sinônimos?\u003c/h5>\u003cp>Globalização se refere a conexões e fluxos; neoliberalismo, a orientações de organização econômica e política. Podem se articular sem serem idênticos.\u003c/p>\u003cp>Limite da resposta: Não trate todas as formas de integração internacional como neoliberais, nem suponha que uma mesma reforma tenha efeitos iguais em todos os contextos.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Neoliberalismo\u003c/dt>\u003cdd>Termo disputado para doutrinas e projetos que atribuem papel central a mercados e formas de competição. Seu uso histórico exige identificar políticas, instituições e variantes.\u003c/dd>\u003cdt>Globalização\u003c/dt>\u003cdd>Intensificação e transformação de conexões transnacionais em diferentes dimensões. Não é sinônimo de uma única política econômica.\u003c/dd>\u003cdt>Desregulação e re-regulação\u003c/dt>\u003cdd>Remover certas regras pode coexistir com criar outras. Menor intervenção em uma área não significa ausência total de ação estatal.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Globalização e neoliberalismo são sinônimos?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Quem produziu a fonte, quando e para qual público? O que sua posição permite observar?\u003c/li>\u003cli>Como imagem, palavras, seleção e silêncios constroem a narrativa?\u003c/li>\u003cli>Que afirmação pode ser sustentada? Qual informação exige outra fonte independente?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Globalização e neoliberalismo\u003c/p>\u003cp class=\"ux-editorial-note\">Direta: o conteúdo cobrado coincide com a aula. Aproximação: permite comparação ou aprofundamento. O ano é a edição do exame. A numeração depende do caderno indicado.\u003c/p>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-040\">\u003ch5>Vestibular USP · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Relações de trabalho e uso ideológico do termo colaborador\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: FUVEST · 1ª fase, questão 5 · V\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Analisar como o capitalismo globalizado modifica relações de trabalho; distinguir organização econômica de suas justificações ideológicas.\u003c/p>\u003ca href=\"https://www.fuvest.br/wp-content/uploads/fuvest2023_primeira_fase_prova_V.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-057\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Ricardo Antunes: proletariado de serviços e uberização do trabalho\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · História discursiva, questão 4, itens A/B · Humanas, 2º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Analisar como o capitalismo globalizado modifica relações de trabalho; distinguir organização econômica de suas justificações ideológicas.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-058\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Karl Marx: capitalismo, classes, mercadorias e relação com a natureza\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · Sociologia discursiva, questão 2 · Humanas, 1º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cp>Analisar como o capitalismo globalizado modifica relações de trabalho; distinguir organização econômica de suas justificações ideológicas.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-1.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003caside class=\"ux-exam-practice\">\u003ch5>Treino autoral opcional\u003c/h5>\u003cp>Diferencie integração econômica de um programa de políticas neoliberais e explique um efeito possível sobre o trabalho.\u003c/p>\u003c/aside>\u003cp class=\"ux-editorial-note\">Seleção documentada de 59 registros das edições 2016–2025; não é levantamento exaustivo nem previsão de prova. Um tema de redação não comprova que a prova exigiu o filósofo desta aula.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Definir globalização por fluxos e cadeias.\u003c/li>\u003cli>Apresentar neoliberalismo como conjunto variável de ideias e políticas.\u003c/li>\u003cli>Analisar efeitos sobre trabalho e proteção social, comparando países.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não tratar neoliberalismo como palavra-curinga moralmente autoexplicativa.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Globalização -&gt; fluxos/cadeias/tecnologia. Neoliberalismo -&gt; reformas específicas. Efeitos -&gt; trabalho, Estado social, desigualdade; variam por contexto.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: ideias de reduzir o papel do Estado, privatizar, abrir o comércio e reduzir a regulação. Q2: intensificação das conexões econômicas, tecnológicas e culturais entre países; impulsionada por transportes, telecomunicações, finanças e multinacionais. Q3: terceirização e precarização em muitos casos. Q4: cadeia coerente com hipótese ou pesquisa. Q5: ganhos e perdas dependem da posição de países, empresas e grupos no mercado. Q6: neoliberalismo é um conjunto de ideias e políticas; globalização é um processo de conexão; um pode favorecer o outro.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Geopolítica, multipolaridade e cooperação Sul-Sul\u003c/p>\u003cp class=\"ux-editorial-note\">Direta: o conteúdo cobrado coincide com a aula. Aproximação: permite comparação ou aprofundamento. O ano é a edição do exame. A numeração depende do caderno indicado.\u003c/p>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-052\">\u003ch5>PAS/UnB — 3ª etapa · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Brasil, BRICS e liderança no Sul Global\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Cebraspe · Item 68 · PAS 3, parte geral, edital 2023\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Comparar a posição brasileira no Sul Global com relações de poder na ordem internacional; situar cada afirmação no ano da prova.\u003c/p>\u003cp>O conjunto é um registro temático; não é contagem de questões independentes.\u003c/p>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/884_PAS3_001_01.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-021\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Poder dos Estados Unidos na ordem pós-soviética\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 82 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Comparar a posição brasileira no Sul Global com relações de poder na ordem internacional; situar cada afirmação no ano da prova.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003caside class=\"ux-exam-practice\">\u003ch5>Treino autoral opcional\u003c/h5>\u003cp>Use dados datados para comparar posições econômicas de dois países dos BRICS. Discuta cooperação e desigualdade sem presumir bloco homogêneo.\u003c/p>\u003c/aside>\u003cp class=\"ux-editorial-note\">Seleção documentada de 59 registros das edições 2016–2025; não é levantamento exaustivo nem previsão de prova. Um tema de redação não comprova que a prova exigiu o filósofo desta aula.\u003c/p>\u003c/section>","id":"s3-historia-semana-6","title":"BRASIL E SUL GLOBAL NA NOVA ORDEM MUNDIAL","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-globe\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M3 9l5-2 2-4 4 2-1 4 4 2 3-1m-9 2 3 4-2 5M5 17l4-1\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-handshake\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M2 8 7 5l5 4 4-4 6 4-5 10-5-3-4 3L2 8zm5-3 3-2 5 2m-3 4 4 3m-6 2 5 3\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Brasil e Sul Global na nova ordem mundial\u003c/div>\u003cdiv class=\"registro-flow\">\u003cspan class=\"registro-node\">BRICS\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Sul Global\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">multipolaridade\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">cooperação Sul-Sul\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>BRICS\u003c/strong> — \u003cspan>Fórum de cooperação entre grandes economias emergentes, cuja composição pode se ampliar ao longo do tempo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Sul Global\u003c/strong> — \u003cspan>Categoria política e econômica heterogênea usada para discutir países e sociedades marcados por experiências de colonialismo, dependência ou posição periférica no sistema mundial.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>multipolaridade\u003c/strong> — \u003cspan>Distribuição do poder internacional entre vários centros ou polos relevantes.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>cooperação Sul-Sul\u003c/strong> — \u003cspan>Cooperação entre países do Sul Global em áreas como desenvolvimento, ciência, comércio, tecnologia e diplomacia.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-earth\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M2 12h20M12 2c-6 6-6 14 0 20M12 2c6 6 6 14 0 20M4 7h16M4 17h16\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> O BRICS é um fórum de cooperação entre economias emergentes; o Sul Global é uma categoria heterogênea, e dependência, multipolaridade e cooperação Sul-Sul são conceitos distintos.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que significa situar o Brasil no chamado Sul Global?\u003c/li>\u003cli>Como relações econômicas e políticas internacionais reproduzem assimetrias entre países?\u003c/li>\u003cli>Que estratégias de cooperação entre países do Sul Global podem ampliar autonomia e capacidade de negociação?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Sul Global\u003c/dt>\u003cdd>Categoria político-histórica relacionada a desigualdades e posições na ordem internacional. Não é a lista de países do hemisfério sul nem uma identidade homogênea.\u003c/dd>\u003cdt>Multipolaridade\u003c/dt>\u003cdd>Distribuição de capacidades e influência entre vários polos. Não implica automaticamente igualdade, paz ou justiça.\u003c/dd>\u003cdt>Cooperação Sul-Sul\u003c/dt>\u003cdd>Relações de cooperação entre países assim situados. Não elimina assimetrias de recursos e interesses.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Os BRICS têm um projeto único e eliminam as desigualdades globais?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Brasil, BRICS e Sul Global na nova ordem mundial\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">O BRICS é um fórum de cooperação entre economias emergentes. Começou em 2009 com Brasil, Rússia, Índia e China, e a África do Sul foi incorporada entre 2010 e 2011. Nos últimos anos, outros países passaram a integrar o grupo, e a lista de membros deve ser conferida em fontes oficiais, porque muda. Em 2026, a Índia preside o BRICS. O grupo discute comércio, finanças, desenvolvimento e a reforma de organismos internacionais. O Sul Global é uma expressão que designa países com experiências de colonialismo, dependência econômica ou posição periférica, mas é uma categoria heterogênea, pois seus países têm interesses diferentes. Multipolaridade é a distribuição do poder entre vários centros, e cooperação Sul-Sul é a cooperação entre países em desenvolvimento.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>O que é o BRICS e que temas o grupo discute?\u003c/li>\u003cli>Quais foram os países que iniciaram o grupo?\u003c/li>\u003cli>O que significa 'Sul Global' e por que a categoria é heterogênea?\u003c/li>\u003cli>Em um mapa-múndi, destaque Brasil, Rússia, Índia, China e África do Sul e indique uma diferença de interesse entre dois deles.\u003c/li>\u003cli>Use 'multipolaridade' e 'cooperação Sul-Sul' para explicar por que o BRICS interessa ao Brasil.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: o BRICS representa todo o Sul Global? Justifique.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Brasil de Fato: Índia assume a presidência do BRICS (05/01/2026)","u":"https://www.brasildefato.com.br/2026/01/05/india-assume-oficialmente-presidencia-do-brics-com-agenda-voltada-ao-sul-global/"},{"t":"Planalto: Brasil anuncia a Indonésia como membro pleno do BRICS (06/01/2025, em inglês)","u":"https://www.gov.br/planalto/en/latest-news/2025/01/brazil-announces-indonesia-as-full-member-of-brics"},{"t":"Itamaraty: Indonésia como novo membro do BRICS (06/01/2025, em inglês)","u":"https://www.gov.br/mre/en/contact-us/press-area/press-releases/indonesia-as-a-new-member-of-brics"}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>BRICS, multipolaridade, relações Sul-Sul, dependência e desigualdades internacionais.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Ler imagens e mapas\u003c/h4>\u003cp>Aula de atualização e síntese internacional. O BRICS entra como estudo de caso para compreender cooperação Sul-Sul, multipolaridade e a posição do Brasil nas transformações da ordem mundial.\u003c/p>\u003cp class=\"atividade-aluno\">Localiza os membros em mapa, identifica objetivos de cooperação e discute Sul Global, multipolaridade e assimetrias do sistema internacional.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS201; EM13CHS204; EM13CHS604\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">Articulação contemporânea\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">BRICS\u003c/span>\u003cspan class=\"concept-chip\">Sul Global\u003c/span>\u003cspan class=\"concept-chip\">multipolaridade\u003c/span>\u003cspan class=\"concept-chip\">cooperação Sul-Sul\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-globe\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M3 9l5-2 2-4 4 2-1 4 4 2 3-1m-9 2 3 4-2 5M5 17l4-1\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-handshake\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M2 8 7 5l5 4 4-4 6 4-5 10-5-3-4 3L2 8zm5-3 3-2 5 2m-3 4 4 3m-6 2 5 3\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Brasil e Sul Global na nova ordem mundial\u003c/div>\u003cdiv class=\"registro-flow\">\u003cspan class=\"registro-node\">BRICS\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Sul Global\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">multipolaridade\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">cooperação Sul-Sul\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>BRICS\u003c/strong> — \u003cspan>Fórum de cooperação entre grandes economias emergentes, cuja composição pode se ampliar ao longo do tempo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Sul Global\u003c/strong> — \u003cspan>Categoria política e econômica heterogênea usada para discutir países e sociedades marcados por experiências de colonialismo, dependência ou posição periférica no sistema mundial.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>multipolaridade\u003c/strong> — \u003cspan>Distribuição do poder internacional entre vários centros ou polos relevantes.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>cooperação Sul-Sul\u003c/strong> — \u003cspan>Cooperação entre países do Sul Global em áreas como desenvolvimento, ciência, comércio, tecnologia e diplomacia.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-earth\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M2 12h20M12 2c-6 6-6 14 0 20M12 2c6 6 6 14 0 20M4 7h16M4 17h16\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> O BRICS é um fórum de cooperação entre economias emergentes; o Sul Global é uma categoria heterogênea, e dependência, multipolaridade e cooperação Sul-Sul são conceitos distintos.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que significa situar o Brasil no chamado Sul Global?\u003c/li>\u003cli>Como relações econômicas e políticas internacionais reproduzem assimetrias entre países?\u003c/li>\u003cli>Que estratégias de cooperação entre países do Sul Global podem ampliar autonomia e capacidade de negociação?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s3-historia-semana-6-glossary-title\">\u003ch4 id=\"s3-historia-semana-6-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Sul Global\u003c/dt>\u003cdd>\u003cp>Categoria político-histórica relacionada a desigualdades e posições na ordem internacional. Não é a lista de países do hemisfério sul nem uma identidade homogênea.\u003c/p>\u003c/dd>\u003cdt>Multipolaridade\u003c/dt>\u003cdd>\u003cp>Distribuição de capacidades e influência entre vários polos. Não implica automaticamente igualdade, paz ou justiça.\u003c/p>\u003c/dd>\u003cdt>Cooperação Sul-Sul\u003c/dt>\u003cdd>\u003cp>Relações de cooperação entre países assim situados. Não elimina assimetrias de recursos e interesses.\u003c/p>\u003c/dd>\u003cdt>BRICS e modalidades de participação\u003c/dt>\u003cdd>\u003cp>Arranjo de cooperação com composição e modalidades que mudam. Membro e país parceiro não são categorias equivalentes; confira a fonte oficial na data da aula.\u003c/p>\u003c/dd>\u003cdt>BRICS\u003c/dt>\u003cdd>\u003cp>Fórum de cooperação entre grandes economias emergentes, cuja composição pode se ampliar ao longo do tempo.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">3ª série · História · Semana 6\u003c/div>\u003ch4>BRASIL E SUL GLOBAL NA NOVA ORDEM MUNDIAL\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Sul Global é categoria política e analítica heterogênea; não é simples sinônimo de hemisfério sul, pobreza ou bloco político unificado. Ela remete a experiências de colonialismo, posição periférica ou semiperiférica na economia mundial e reivindicações de maior voz na governança internacional.\u003c/p>\u003cp>O BRICS é um fórum de articulação e cooperação entre economias emergentes. Em 2026, fontes oficiais brasileiras registram onze membros: África do Sul, Arábia Saudita, Brasil, China, Egito, Emirados Árabes Unidos, Etiópia, Índia, Indonésia, Irã e Rússia. A composição ampliada reforça a necessidade de falar em heterogeneidade: interesses econômicos, regimes políticos e prioridades internacionais não são idênticos.\u003c/p>\u003cp>Teorias da dependência latino-americanas, associadas a autores como Celso Furtado, Fernando Henrique Cardoso e Enzo Faletto, ajudam a pensar relações entre desenvolvimento interno e estrutura internacional. Elas também são diversas entre si e não devem ser condensadas numa fórmula única.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s3-historia-semana-6-study-heading\">\u003ch4 id=\"s3-historia-semana-6-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Compare objetivos declarados, instrumentos e interesses nacionais. A composição não prova unidade de regime, prioridade ou resultado. Uma análise de dependência precisa identificar relação econômica e mecanismo, não apenas a posição no mapa.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Evite congelar uma lista de integrantes ou inferir aliança militar a partir de cooperação. Esta preparação remete à página oficial em vez de acrescentar uma contagem que envelheça.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Dois países fictícios cooperam num projeto e disputam condições de financiamento.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>Cooperação e assimetria podem coexistir; investigue contratos e efeitos para avaliar a relação.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://brics.br/pt-br/sobre-o-brics\" target=\"_blank\" rel=\"noopener\">Presidência brasileira do BRICS — Sobre o BRICS\u003c/a>\u003cp>Fonte oficial: composição e modalidades de participação; conferir na data da aula.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/globalization/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Globalization\u003c/a>\u003cp>Referência conceitual: conexões transnacionais e divergências explicativas.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Em 2026, a presidência do BRICS está com a Índia; documentos oficiais brasileiros registram onze países membros e cooperação em várias áreas além de comércio.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Compare BRICS, ONU e outros fóruns apenas em função e composição, evitando transformá-los em 'times' geopolíticos.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Os BRICS têm um projeto único e eliminam as desigualdades globais?\u003c/h5>\u003cp>Cooperação internacional convive com interesses distintos e desigualdades entre participantes. Multipolaridade não implica igualdade.\u003c/p>\u003cp>Limite da resposta: Evite congelar uma lista de integrantes ou inferir aliança militar a partir de cooperação. Esta preparação remete à página oficial em vez de acrescentar uma contagem que envelheça.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Sul Global\u003c/dt>\u003cdd>Categoria político-histórica relacionada a desigualdades e posições na ordem internacional. Não é a lista de países do hemisfério sul nem uma identidade homogênea.\u003c/dd>\u003cdt>Multipolaridade\u003c/dt>\u003cdd>Distribuição de capacidades e influência entre vários polos. Não implica automaticamente igualdade, paz ou justiça.\u003c/dd>\u003cdt>Cooperação Sul-Sul\u003c/dt>\u003cdd>Relações de cooperação entre países assim situados. Não elimina assimetrias de recursos e interesses.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Os BRICS têm um projeto único e eliminam as desigualdades globais?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Quem produziu a fonte, quando e para qual público? O que sua posição permite observar?\u003c/li>\u003cli>Como imagem, palavras, seleção e silêncios constroem a narrativa?\u003c/li>\u003cli>Que afirmação pode ser sustentada? Qual informação exige outra fonte independente?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003cp>Na síntese, avalie: precisão dos conceitos, evidências, relação entre razões e conclusão, melhor objeção e resposta fundamentada. A nota considera a qualidade do argumento, não a concordância com a posição da professora.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Geopolítica, multipolaridade e cooperação Sul-Sul\u003c/p>\u003cp class=\"ux-editorial-note\">Direta: o conteúdo cobrado coincide com a aula. Aproximação: permite comparação ou aprofundamento. O ano é a edição do exame. A numeração depende do caderno indicado.\u003c/p>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-052\">\u003ch5>PAS/UnB — 3ª etapa · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Brasil, BRICS e liderança no Sul Global\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Cebraspe · Item 68 · PAS 3, parte geral, edital 2023\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Comparar a posição brasileira no Sul Global com relações de poder na ordem internacional; situar cada afirmação no ano da prova.\u003c/p>\u003cp>O conjunto é um registro temático; não é contagem de questões independentes.\u003c/p>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/884_PAS3_001_01.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-021\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Poder dos Estados Unidos na ordem pós-soviética\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 82 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cp>Comparar a posição brasileira no Sul Global com relações de poder na ordem internacional; situar cada afirmação no ano da prova.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003caside class=\"ux-exam-practice\">\u003ch5>Treino autoral opcional\u003c/h5>\u003cp>Use dados datados para comparar posições econômicas de dois países dos BRICS. Discuta cooperação e desigualdade sem presumir bloco homogêneo.\u003c/p>\u003c/aside>\u003cp class=\"ux-editorial-note\">Seleção documentada de 59 registros das edições 2016–2025; não é levantamento exaustivo nem previsão de prova. Um tema de redação não comprova que a prova exigiu o filósofo desta aula.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Definir Sul Global e questionar o que a categoria inclui/exclui.\u003c/li>\u003cli>Apresentar BRICS, expansão e áreas de cooperação com dados oficiais atualizados.\u003c/li>\u003cli>Comparar multipolaridade, cooperação Sul-Sul e dependência como conceitos diferentes.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não tratar Sul Global ou BRICS como bloco ideologicamente homogêneo.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Sul Global = categoria heterogênea. BRICS = fórum. Multipolaridade = distribuição de poder. Dependência = lente sobre estrutura econômica. Cooperação Sul-Sul = prática de colaboração.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: fórum de cooperação entre economias emergentes; comércio, finanças, desenvolvimento, reforma de organismos internacionais. Q2: Brasil, Rússia, Índia e China (2009). Q3: países com experiências de colonialismo, dependência ou periferia; interesses diferentes. Q4: mapa com os cinco países e uma diferença de interesse. Q5: ampliar parcerias e voz em um mundo com vários centros de poder. Q6: não; é um grupo específico de países e o Sul Global é heterogêneo. Lembrete da professora: confira a lista atual de membros no Planalto ou no Itamaraty antes da aula.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"}]},{"label":"1ª série · Filosofia","classes":["1ªA","1ªB"],"lessons":[{"exames":"\u003cp>Não há questão vinculada a esta aula na seleção pesquisada de 2016–2025. Isso não significa que o conteúdo nunca tenha sido cobrado.\u003c/p>","id":"s1-filosofia-semana-1","title":"PENSAR E ARGUMENTAR","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-speech\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M4 4h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 3v-3a2 2 0 0 1-1-2V6a2 2 0 0 1 2-2zM7 9h10M7 13h7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-book\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M12 6c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1zm0 0v15\">\u003c/path>\u003cpath d=\"M4 8h5m-5 3h5m6-3h5m-5 3h5\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Pensar e argumentar\u003c/div>\u003ctable class=\"registro-tabela\">\u003ctbody>\u003ctr>\u003cth>Ideia\u003c/th>\u003cth>Em poucas palavras\u003c/th>\u003c/tr>\u003ctr>\u003ctd>tese\u003c/td>\u003ctd>Afirmação ou posição central que um argumento procura sustentar.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>premissa\u003c/td>\u003ctd>Proposição apresentada como fundamento para uma conclusão.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conclusão\u003c/td>\u003ctd>Proposição que resulta das premissas em um argumento.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>validade\u003c/td>\u003ctd>Propriedade lógica de um argumento em que a conclusão decorre das premissas, independentemente de elas serem verdadeiras.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-brain\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M12 5a4 4 0 0 0-7 2A4 4 0 0 0 3 14a4 4 0 0 0 4 5 4 4 0 0 0 5 3V5zm0 0a4 4 0 0 1 7 2 4 4 0 0 1 2 7 4 4 0 0 1-4 5 4 4 0 0 1-5 3M7 10l3 2M6 17l3-2m8-5-3 2m4 5-3-2\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Um argumento é feito de premissas que sustentam uma conclusão; ser válido é questão de lógica, ser verdadeiro depende das premissas.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 36–37\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Qual é a diferença entre raciocínio dedutivo e raciocínio indutivo?\u003c/li>\u003cli>Que papel as premissas desempenham na construção de um argumento?\u003c/li>\u003cli>Como podemos avaliar se uma conclusão está bem sustentada pelas razões apresentadas?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Tese, premissa e conclusão\u003c/dt>\u003cdd>Tese é a posição defendida; premissas são as razões apresentadas; conclusão é o que o argumento pretende estabelecer. A mesma proposição pode desempenhar funções diferentes em argumentos distintos.\u003c/dd>\u003cdt>Validade dedutiva\u003c/dt>\u003cdd>Um argumento é válido quando não é possível que todas as premissas sejam verdadeiras e a conclusão falsa, mantida a interpretação dos termos. Não é uma certificação da verdade das premissas.\u003c/dd>\u003cdt>Solidez e força indutiva\u003c/dt>\u003cdd>Solidez combina validade dedutiva e premissas verdadeiras. Já uma indução oferece apoio graduável à conclusão: mesmo com premissas verdadeiras, pode haver exceção.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Uma conclusão verdadeira torna qualquer argumento válido?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Pensar e argumentar\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Um argumento é um conjunto de afirmações em que algumas, chamadas premissas, são apresentadas como razões para sustentar outra, a conclusão. Em um argumento dedutivo, se as premissas forem verdadeiras e o raciocínio for válido, a conclusão decorre necessariamente delas: 'Todo ser humano é mortal; Sócrates é humano; logo, Sócrates é mortal.' Em um argumento indutivo, parte-se de casos observados para uma conclusão provável, mas não certa: 'Todos os corvos que vi são pretos; logo, provavelmente todos os corvos são pretos.' É preciso distinguir validade, que depende da forma do raciocínio, e verdade, que depende de as premissas corresponderem aos fatos. Um argumento pode ser válido e ter uma premissa falsa.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>O que são premissas e o que é conclusão?\u003c/li>\u003cli>Qual é a diferença entre argumento dedutivo e argumento indutivo, segundo o texto?\u003c/li>\u003cli>Qual é a diferença entre validade e verdade?\u003c/li>\u003cli>Identifique premissas e conclusão: 'Quem estuda regularmente aprende mais. Marta estuda regularmente. Logo, Marta aprende mais.' O argumento é dedutivo ou indutivo?\u003c/li>\u003cli>Dê um exemplo próprio de argumento indutivo e explique por que sua conclusão é apenas provável.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: um argumento válido sempre tem conclusão verdadeira? Use um exemplo.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Tese, premissa, conclusão e validade.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Leitura e atividade\u003c/h4>\u003cp>Apresentação da estrutura básica de um argumento e trabalho com as p. 36-37, usando o esquema comparativo para dedução e indução.\u003c/p>\u003cp class=\"atividade-aluno\">Lê o trecho, identifica premissas e conclusões e constrói a comparação entre dedução e indução.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS103\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — preparação para argumentação ética\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">tese\u003c/span>\u003cspan class=\"concept-chip\">premissa\u003c/span>\u003cspan class=\"concept-chip\">conclusão\u003c/span>\u003cspan class=\"concept-chip\">validade\u003c/span>\u003c/div>\u003cdiv class=\"concept-definitions\">\u003cdiv class=\"concept-definitions-title\">Vocabulário da aula\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>tese — \u003c/strong>Afirmação ou posição central que um argumento procura sustentar.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>premissa — \u003c/strong>Proposição apresentada como fundamento para uma conclusão.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>conclusão — \u003c/strong>Proposição que resulta das premissas em um argumento.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>validade — \u003c/strong>Propriedade lógica de um argumento em que a conclusão decorre das premissas, independentemente de elas serem verdadeiras.\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-speech\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M4 4h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 3v-3a2 2 0 0 1-1-2V6a2 2 0 0 1 2-2zM7 9h10M7 13h7\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-book\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M12 6c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1zm0 0v15\">\u003c/path>\u003cpath d=\"M4 8h5m-5 3h5m6-3h5m-5 3h5\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Pensar e argumentar\u003c/div>\u003ctable class=\"registro-tabela\">\u003ctbody>\u003ctr>\u003cth>Ideia\u003c/th>\u003cth>Em poucas palavras\u003c/th>\u003c/tr>\u003ctr>\u003ctd>tese\u003c/td>\u003ctd>Afirmação ou posição central que um argumento procura sustentar.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>premissa\u003c/td>\u003ctd>Proposição apresentada como fundamento para uma conclusão.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conclusão\u003c/td>\u003ctd>Proposição que resulta das premissas em um argumento.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>validade\u003c/td>\u003ctd>Propriedade lógica de um argumento em que a conclusão decorre das premissas, independentemente de elas serem verdadeiras.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-brain\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M12 5a4 4 0 0 0-7 2A4 4 0 0 0 3 14a4 4 0 0 0 4 5 4 4 0 0 0 5 3V5zm0 0a4 4 0 0 1 7 2 4 4 0 0 1 2 7 4 4 0 0 1-4 5 4 4 0 0 1-5 3M7 10l3 2M6 17l3-2m8-5-3 2m4 5-3-2\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Um argumento é feito de premissas que sustentam uma conclusão; ser válido é questão de lógica, ser verdadeiro depende das premissas.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 36–37\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Qual é a diferença entre raciocínio dedutivo e raciocínio indutivo?\u003c/li>\u003cli>Que papel as premissas desempenham na construção de um argumento?\u003c/li>\u003cli>Como podemos avaliar se uma conclusão está bem sustentada pelas razões apresentadas?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-1-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-1-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Tese, premissa e conclusão\u003c/dt>\u003cdd>\u003cp>Tese é a posição defendida; premissas são as razões apresentadas; conclusão é o que o argumento pretende estabelecer. A mesma proposição pode desempenhar funções diferentes em argumentos distintos.\u003c/p>\u003c/dd>\u003cdt>Validade dedutiva\u003c/dt>\u003cdd>\u003cp>Um argumento é válido quando não é possível que todas as premissas sejam verdadeiras e a conclusão falsa, mantida a interpretação dos termos. Não é uma certificação da verdade das premissas.\u003c/p>\u003c/dd>\u003cdt>Solidez e força indutiva\u003c/dt>\u003cdd>\u003cp>Solidez combina validade dedutiva e premissas verdadeiras. Já uma indução oferece apoio graduável à conclusão: mesmo com premissas verdadeiras, pode haver exceção.\u003c/p>\u003c/dd>\u003cdt>tese\u003c/dt>\u003cdd>\u003cp>Afirmação ou posição central que um argumento procura sustentar.\u003c/p>\u003c/dd>\u003cdt>premissa\u003c/dt>\u003cdd>\u003cp>Proposição apresentada como fundamento para uma conclusão.\u003c/p>\u003c/dd>\u003cdt>conclusão\u003c/dt>\u003cdd>\u003cp>Proposição que resulta das premissas em um argumento.\u003c/p>\u003c/dd>\u003cdt>validade\u003c/dt>\u003cdd>\u003cp>Propriedade lógica de um argumento em que a conclusão decorre das premissas, independentemente de elas serem verdadeiras.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 1\u003c/div>\u003ch4>PENSAR E ARGUMENTAR\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Argumentar não é apenas expor opinião: é oferecer razões que sustentem uma conclusão. A lógica permite examinar relações entre premissas e conclusão sem decidir, sozinha, se as premissas são verdadeiras. Um argumento pode ser válido e partir de premissas falsas; por isso convém distinguir validade, verdade e, quando apropriado, solidez.\u003c/p>\u003cp>A tradição lógica europeia costuma começar com Aristóteles, mas o ensino pode situá-la como uma entre diferentes tradições de raciocínio sistemático. O objetivo da semana é fornecer ferramenta de leitura: identificar o que alguém afirma, quais razões oferece e se a conclusão decorre delas.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-1-study-heading\">\u003ch4 id=\"s1-filosofia-semana-1-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Para explicar, comece pela função de cada enunciado; depois examine a passagem entre eles. A avaliação tem duas perguntas independentes: as razões são aceitáveis? Elas sustentam esta conclusão? Isso evita que a concordância com a conclusão esconda um raciocínio inadequado.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>O padrão de validade desta aula é o da dedução. Não cobre todas as formas de argumentação científica ou cotidiana; exigir certeza dedutiva de uma previsão estatística seria um erro de método.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Todos os peixes voam; a sardinha é um peixe; logo, a sardinha voa.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>A forma é válida, mas uma premissa é falsa. O exemplo foi inventado para separar estrutura lógica e conhecimento empírico.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/logical-consequence/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Logical Consequence\u003c/a>\u003cp>Referência conceitual: consequência dedutiva e indução.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Aristóteles organizou uma teoria do silogismo que permaneceu central por séculos, mas a lógica contemporânea vai muito além do silogismo aristotélico.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Use argumentos de propaganda, esporte ou redes sociais sem expor colegas; o foco é a estrutura, não a posição defendida.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Uma conclusão verdadeira torna qualquer argumento válido?\u003c/h5>\u003cp>A validade depende da relação entre premissas e conclusão. Um argumento válido pode ter premissas falsas; solidez exige também premissas verdadeiras.\u003c/p>\u003cp>Limite da resposta: O padrão de validade desta aula é o da dedução. Não cobre todas as formas de argumentação científica ou cotidiana; exigir certeza dedutiva de uma previsão estatística seria um erro de método.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Tese, premissa e conclusão\u003c/dt>\u003cdd>Tese é a posição defendida; premissas são as razões apresentadas; conclusão é o que o argumento pretende estabelecer. A mesma proposição pode desempenhar funções diferentes em argumentos distintos.\u003c/dd>\u003cdt>Validade dedutiva\u003c/dt>\u003cdd>Um argumento é válido quando não é possível que todas as premissas sejam verdadeiras e a conclusão falsa, mantida a interpretação dos termos. Não é uma certificação da verdade das premissas.\u003c/dd>\u003cdt>Solidez e força indutiva\u003c/dt>\u003cdd>Solidez combina validade dedutiva e premissas verdadeiras. Já uma indução oferece apoio graduável à conclusão: mesmo com premissas verdadeiras, pode haver exceção.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Uma conclusão verdadeira torna qualquer argumento válido?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Separar opinião, tese e argumento.\u003c/li>\u003cli>Identificar premissas e conclusão em exemplos curtos.\u003c/li>\u003cli>Distinguir validade lógica e verdade das premissas.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não ensine 'argumento válido = argumento verdadeiro'.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Tese &lt;- sustentada por premissas -&gt; conclusão. Embaixo: validade = relação lógica; verdade = propriedade das proposições.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: premissas = razões; conclusão = o que se quer sustentar. Q2: dedutivo: conclusão decorre necessariamente das premissas; indutivo: parte de casos para conclusão provável. Q3: validade = forma do raciocínio; verdade = correspondência com os fatos. Q4: premissas: quem estuda regularmente aprende mais; Marta estuda regularmente; conclusão: Marta aprende mais; dedutivo na forma (a premissa geral pode ser discutida). Q5: exemplo livre; provável porque novos casos podem contrariar. Q6: não; pode ser válido com premissa falsa (ex.: 'todos os gatos voam; Mimi é gata; logo Mimi voa').\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003cp>Não há questão vinculada a esta aula na seleção pesquisada de 2016–2025. Isso não significa que o conteúdo nunca tenha sido cobrado.\u003c/p>","id":"s1-filosofia-semana-2","title":"FALÁCIAS E PERSUASÃO","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-warning\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"m12 2 10 18H2L12 2zm0 6v5m0 3v.2\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-speech\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M4 4h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 3v-3a2 2 0 0 1-1-2V6a2 2 0 0 1 2-2zM7 9h10M7 13h7\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Falácias e persuasão\u003c/div>\u003ctable class=\"registro-tabela\">\u003ctbody>\u003ctr>\u003cth>Ideia\u003c/th>\u003cth>Em poucas palavras\u003c/th>\u003c/tr>\u003ctr>\u003ctd>falácia\u003c/td>\u003ctd>Erro ou problema de raciocínio que pode tornar um argumento inadequado; nem toda falácia é uma mentira intencional.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>persuasão\u003c/td>\u003ctd>Processo de buscar adesão a uma ideia por meio de argumentos, linguagem e recursos retóricos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>argumento\u003c/td>\u003ctd>Conjunto de razões ou premissas oferecidas para sustentar uma conclusão.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>evidência\u003c/td>\u003ctd>Informação utilizada para apoiar uma afirmação, cuja força depende de sua qualidade, relevância e relação com a tese.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-search\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\">\u003c/circle>\u003cpath d=\"m15 15 7 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Falácia é um erro de raciocínio que pode parecer convincente; reconhecê-la protege contra manipulação, sem acusar ninguém de mentir.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que caracteriza uma falácia em um argumento?\u003c/li>\u003cli>Por que uma fala persuasiva pode parecer convincente mesmo quando apresenta um erro de raciocínio?\u003c/li>\u003cli>Como identificar uma falácia pode melhorar uma discussão ou debate?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Ad hominem\u003c/dt>\u003cdd>Ataque à pessoa que pretende dispensar o exame de sua tese. Avaliar a confiabilidade de uma testemunha, quando pertinente ao que ela relata, é outra operação.\u003c/dd>\u003cdt>Generalização precipitada\u003c/dt>\u003cdd>Conclusão sobre um conjunto a partir de casos insuficientes ou pouco representativos. O problema depende da amostra e do alcance da afirmação.\u003c/dd>\u003cdt>Apelo à autoridade\u003c/dt>\u003cdd>Uso da competência de uma fonte como razão. Torna-se problemático quando a competência é alheia ao tema, a fonte não é confiável ou sua palavra é tratada como prova incontestável.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Discordar de uma autoridade já é uma falácia?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Falácias e persuasão\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Uma falácia é um erro de raciocínio que pode parecer convincente. Algumas são muito comuns: o ataque pessoal, que ataca quem fala e não o argumento; o apelo à autoridade, que aceita algo só porque alguém famoso disse; o falso dilema, que apresenta apenas duas opções quando há outras; e a generalização apressada, que conclui sobre todos a partir de poucos casos. Persuadir é levar alguém a aceitar uma ideia, por razões ou por emoções; argumentar é oferecer razões que podem ser avaliadas. Reconhecer falácias protege contra a manipulação e melhora os debates, mas não serve para acusar ninguém de mentir: muitas vezes o erro é apenas descuido.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>O que é uma falácia?\u003c/li>\u003cli>Escolha duas falácias citadas no texto e explique cada uma com suas palavras.\u003c/li>\u003cli>Qual é a diferença entre persuadir e argumentar?\u003c/li>\u003cli>Classifique: (a) 'Não confio no que ele diz sobre o clima, ele nem terminou a escola.' (b) 'Ou você apoia esta ideia, ou é contra a escola.' (c) 'Meus dois primos de Goiânia são pontuais, então todo goiano é pontual.'\u003c/li>\u003cli>Reescreva (b) ou (c) como um argumento que se sustente.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: reconhecer falácias basta para ganhar uma discussão? Use 'persuasão' e 'argumentação'.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Raciocínios frágeis no cotidiano e nas mídias.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Em sala\u003c/h4>\u003cp>Aula prática com argumentos do cotidiano, publicidade, redes sociais e situações simuladas. A turma investiga por que parecem convincentes e onde estão suas fragilidades.\u003c/p>\u003cp class=\"atividade-aluno\">Analisa exemplos, identifica a falácia e propõe formas mais consistentes de argumentação.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS103\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — preparação para argumentação ética\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">falácia\u003c/span>\u003cspan class=\"concept-chip\">persuasão\u003c/span>\u003cspan class=\"concept-chip\">argumento\u003c/span>\u003cspan class=\"concept-chip\">evidência\u003c/span>\u003c/div>\u003cdiv class=\"concept-definitions\">\u003cdiv class=\"concept-definitions-title\">Vocabulário da aula\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>falácia — \u003c/strong>Erro ou problema de raciocínio que pode tornar um argumento inadequado; nem toda falácia é uma mentira intencional.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>persuasão — \u003c/strong>Processo de buscar adesão a uma ideia por meio de argumentos, linguagem e recursos retóricos.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>argumento — \u003c/strong>Conjunto de razões ou premissas oferecidas para sustentar uma conclusão.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>evidência — \u003c/strong>Informação utilizada para apoiar uma afirmação, cuja força depende de sua qualidade, relevância e relação com a tese.\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-warning\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"m12 2 10 18H2L12 2zm0 6v5m0 3v.2\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-speech\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M4 4h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 3v-3a2 2 0 0 1-1-2V6a2 2 0 0 1 2-2zM7 9h10M7 13h7\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Falácias e persuasão\u003c/div>\u003ctable class=\"registro-tabela\">\u003ctbody>\u003ctr>\u003cth>Ideia\u003c/th>\u003cth>Em poucas palavras\u003c/th>\u003c/tr>\u003ctr>\u003ctd>falácia\u003c/td>\u003ctd>Erro ou problema de raciocínio que pode tornar um argumento inadequado; nem toda falácia é uma mentira intencional.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>persuasão\u003c/td>\u003ctd>Processo de buscar adesão a uma ideia por meio de argumentos, linguagem e recursos retóricos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>argumento\u003c/td>\u003ctd>Conjunto de razões ou premissas oferecidas para sustentar uma conclusão.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>evidência\u003c/td>\u003ctd>Informação utilizada para apoiar uma afirmação, cuja força depende de sua qualidade, relevância e relação com a tese.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-search\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\">\u003c/circle>\u003cpath d=\"m15 15 7 7\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Falácia é um erro de raciocínio que pode parecer convincente; reconhecê-la protege contra manipulação, sem acusar ninguém de mentir.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que caracteriza uma falácia em um argumento?\u003c/li>\u003cli>Por que uma fala persuasiva pode parecer convincente mesmo quando apresenta um erro de raciocínio?\u003c/li>\u003cli>Como identificar uma falácia pode melhorar uma discussão ou debate?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-2-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-2-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Ad hominem\u003c/dt>\u003cdd>\u003cp>Ataque à pessoa que pretende dispensar o exame de sua tese. Avaliar a confiabilidade de uma testemunha, quando pertinente ao que ela relata, é outra operação.\u003c/p>\u003c/dd>\u003cdt>Generalização precipitada\u003c/dt>\u003cdd>\u003cp>Conclusão sobre um conjunto a partir de casos insuficientes ou pouco representativos. O problema depende da amostra e do alcance da afirmação.\u003c/p>\u003c/dd>\u003cdt>Apelo à autoridade\u003c/dt>\u003cdd>\u003cp>Uso da competência de uma fonte como razão. Torna-se problemático quando a competência é alheia ao tema, a fonte não é confiável ou sua palavra é tratada como prova incontestável.\u003c/p>\u003c/dd>\u003cdt>Falso dilema\u003c/dt>\u003cdd>\u003cp>Apresentação de alternativas como se fossem exaustivas, quando existem possibilidades relevantes excluídas.\u003c/p>\u003c/dd>\u003cdt>falácia\u003c/dt>\u003cdd>\u003cp>Erro ou problema de raciocínio que pode tornar um argumento inadequado; nem toda falácia é uma mentira intencional.\u003c/p>\u003c/dd>\u003cdt>persuasão\u003c/dt>\u003cdd>\u003cp>Processo de buscar adesão a uma ideia por meio de argumentos, linguagem e recursos retóricos.\u003c/p>\u003c/dd>\u003cdt>argumento\u003c/dt>\u003cdd>\u003cp>Conjunto de razões ou premissas oferecidas para sustentar uma conclusão.\u003c/p>\u003c/dd>\u003cdt>evidência\u003c/dt>\u003cdd>\u003cp>Informação utilizada para apoiar uma afirmação, cuja força depende de sua qualidade, relevância e relação com a tese.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 2\u003c/div>\u003ch4>FALÁCIAS E PERSUASÃO\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Falácias são padrões problemáticos de raciocínio, mas o ensino melhora quando elas não viram uma coleção de rótulos decorados. O mesmo formato verbal pode ser razoável ou falacioso conforme contexto, relevância e evidência. A análise deve perguntar: a razão apresentada realmente sustenta a conclusão? Há desvio do problema? Há generalização indevida? A fonte é pertinente?\u003c/p>\u003cp>Persuasão é mais ampla que lógica. Retórica, emoção, autoridade, imagens e enquadramentos influenciam adesão. Isso não significa que toda emoção seja irracional ou que retórica seja sinônimo de manipulação. Uma boa leitura crítica separa força persuasiva e qualidade justificativa.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-2-study-heading\">\u003ch4 id=\"s1-filosofia-semana-2-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Reconstrua a tese e a razão antes de dar um nome à falácia. Em cada caso, explique o defeito: falta de pertinência, generalização injustificada ou exclusão de alternativas. Persuadir e justificar podem ocorrer juntos; emoção não torna automaticamente um argumento inválido.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Uma conclusão mal sustentada pode ser verdadeira. Demonstrar uma falácia não demonstra a falsidade da tese: é preciso avaliar outras razões disponíveis.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Um influenciador afirma: este método de estudo é o melhor porque funcionou com dois seguidores.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>Pergunte quem foram os participantes, como o resultado foi medido e se existiam outras explicações. O caso é fictício, não uma acusação a alguém.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/fallacies/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Fallacies\u003c/a>\u003cp>Referência conceitual: análise contextual de falácias.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Manuais de debate popularizaram dezenas de nomes latinos para falácias; reconhecer o nome é menos importante do que explicar por que o raciocínio falha naquele contexto.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Analise um anúncio ou postagem: o que chama atenção? o que é evidência? o que é apenas enquadramento?\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Discordar de uma autoridade já é uma falácia?\u003c/h5>\u003cp>Avaliar credenciais e pertinência de uma autoridade é legítimo. Há falácia quando a autoridade substitui indevidamente a justificação.\u003c/p>\u003cp>Limite da resposta: Uma conclusão mal sustentada pode ser verdadeira. Demonstrar uma falácia não demonstra a falsidade da tese: é preciso avaliar outras razões disponíveis.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Ad hominem\u003c/dt>\u003cdd>Ataque à pessoa que pretende dispensar o exame de sua tese. Avaliar a confiabilidade de uma testemunha, quando pertinente ao que ela relata, é outra operação.\u003c/dd>\u003cdt>Generalização precipitada\u003c/dt>\u003cdd>Conclusão sobre um conjunto a partir de casos insuficientes ou pouco representativos. O problema depende da amostra e do alcance da afirmação.\u003c/dd>\u003cdt>Apelo à autoridade\u003c/dt>\u003cdd>Uso da competência de uma fonte como razão. Torna-se problemático quando a competência é alheia ao tema, a fonte não é confiável ou sua palavra é tratada como prova incontestável.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Discordar de uma autoridade já é uma falácia?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-ste
