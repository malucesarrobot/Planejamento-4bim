zar, avaliar e responder a argumentos.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>falácias\u003c/strong> — \u003cspan>Formas de raciocínio problemático que podem comprometer a qualidade de uma argumentação.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>filosofias helenísticas\u003c/strong> — \u003cspan>Correntes filosóficas desenvolvidas no período helenístico, como epicurismo, estoicismo e ceticismo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>revisão do bimestre\u003c/strong> — \u003cspan>Retomada das ideias centrais e das relações construídas ao longo do bimestre.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-compass\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m15 9-3 8-3-5 6-3z\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Argumentar bem e escolher como viver são tarefas ligadas: razões claras sustentam decisões e podem ser avaliadas.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Como argumentação, ética e busca da felicidade apareceram nas discussões do bimestre?\u003c/li>\u003cli>Qual conceito estudado ajuda mais a analisar uma decisão cotidiana? Explique.\u003c/li>\u003cli>Como diferentes escolas filosóficas podem oferecer respostas distintas para um mesmo problema humano?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Problema filosófico\u003c/dt>\u003cdd>Questão que exige esclarecer conceitos, pressupostos e razões, e admite confronto de posições. Não é apenas uma pergunta difícil.\u003c/dd>\u003cdt>Comparação de teorias\u003c/dt>\u003cdd>Reconstrução das respostas dadas ao mesmo problema, ou identificação de que os autores respondem a problemas diferentes.\u003c/dd>\u003cdt>Síntese argumentativa\u003c/dt>\u003cdd>Texto que relaciona teses com razões e explicita convergências e divergências. Não pressupõe que todas as posições se fundam em uma teoria.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Teorias diferentes podem ser somadas sem examinar seus pressupostos?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Ideia-chave: argumentação e filosofias da vida\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Neste bimestre, vimos que pensar bem e viver bem estão ligados. Argumentar é oferecer razões que podem ser avaliadas, com premissas, conclusão e atenção às falácias. As filosofias helenísticas ofereceram respostas diferentes sobre como viver: o epicurismo busca a tranquilidade por meio de desejos medidos e da amizade; o estoicismo separa o que depende de nós do que não depende; o ceticismo suspende o juízo diante de razões equilibradas. A discussão sobre dignidade e reconhecimento lembra que decidir como viver envolve outras pessoas e a justiça. Uma boa decisão não é só a que dá resultado, mas a que pode ser explicada com razões claras e respeito aos outros.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Que filosofias o texto cita e o que cada uma propõe?\u003c/li>\u003cli>O que é argumentar, segundo o texto?\u003c/li>\u003cli>Por que dignidade e reconhecimento entram na discussão sobre decisões?\u003c/li>\u003cli>Um colega foi acusado na escola sem provas. Como epicurismo, estoicismo e ceticismo orientariam sua conduta? Responda com uma frase para cada.\u003c/li>\u003cli>Qual falácia você evitaria ao discutir esse caso e por quê?\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: 'uma boa decisão pode ser explicada com razões'. Concorda? Use dois conceitos do bimestre.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Argumentação, falácias e filosofias helenísticas. Aula flexível.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Em sala\u003c/h4>\u003cp>Aula flexível com Arena das Falácias, jogo conceitual ou situações-problema.\u003c/p>\u003cp class=\"atividade-aluno\">Classifica argumentos, relaciona conceitos filosóficos e justifica suas escolhas.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS103; EM13CHS501\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — síntese\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">argumentação\u003c/span>\u003cspan class=\"concept-chip\">falácias\u003c/span>\u003cspan class=\"concept-chip\">filosofias helenísticas\u003c/span>\u003cspan class=\"concept-chip\">síntese\u003c/span>\u003c/div>\u003cdiv class=\"concept-definitions\">\u003cdiv class=\"concept-definitions-title\">Vocabulário da aula\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>argumentação — \u003c/strong>Prática de formular, organizar, avaliar e responder a argumentos.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>falácias — \u003c/strong>Formas de raciocínio problemático que podem comprometer a qualidade de uma argumentação.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>filosofias helenísticas — \u003c/strong>Correntes filosóficas desenvolvidas no período helenístico, como epicurismo, estoicismo e ceticismo.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>síntese — \u003c/strong>Organização integrada das ideias centrais de um conteúdo, destacando relações entre elas.\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-book\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M12 6c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1zm0 0v15\">\u003c/path>\u003cpath d=\"M4 8h5m-5 3h5m6-3h5m-5 3h5\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-speech\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M4 4h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 3v-3a2 2 0 0 1-1-2V6a2 2 0 0 1 2-2zM7 9h10M7 13h7\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Fechamento do bimestre\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>argumentação\u003c/strong> — \u003cspan>Prática de formular, organizar, avaliar e responder a argumentos.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>falácias\u003c/strong> — \u003cspan>Formas de raciocínio problemático que podem comprometer a qualidade de uma argumentação.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>filosofias helenísticas\u003c/strong> — \u003cspan>Correntes filosóficas desenvolvidas no período helenístico, como epicurismo, estoicismo e ceticismo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>revisão do bimestre\u003c/strong> — \u003cspan>Retomada das ideias centrais e das relações construídas ao longo do bimestre.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-compass\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"m15 9-3 8-3-5 6-3z\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Núcleo conceitual:\u003c/strong> Argumentar bem e escolher como viver são tarefas ligadas: razões claras sustentam decisões e podem ser avaliadas.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Como argumentação, ética e busca da felicidade apareceram nas discussões do bimestre?\u003c/li>\u003cli>Qual conceito estudado ajuda mais a analisar uma decisão cotidiana? Explique.\u003c/li>\u003cli>Como diferentes escolas filosóficas podem oferecer respostas distintas para um mesmo problema humano?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-6-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-6-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Problema filosófico\u003c/dt>\u003cdd>\u003cp>Questão que exige esclarecer conceitos, pressupostos e razões, e admite confronto de posições. Não é apenas uma pergunta difícil.\u003c/p>\u003c/dd>\u003cdt>Comparação de teorias\u003c/dt>\u003cdd>\u003cp>Reconstrução das respostas dadas ao mesmo problema, ou identificação de que os autores respondem a problemas diferentes.\u003c/p>\u003c/dd>\u003cdt>Síntese argumentativa\u003c/dt>\u003cdd>\u003cp>Texto que relaciona teses com razões e explicita convergências e divergências. Não pressupõe que todas as posições se fundam em uma teoria.\u003c/p>\u003c/dd>\u003cdt>argumentação\u003c/dt>\u003cdd>\u003cp>Prática de formular, organizar, avaliar e responder a argumentos.\u003c/p>\u003c/dd>\u003cdt>falácias\u003c/dt>\u003cdd>\u003cp>Formas de raciocínio problemático que podem comprometer a qualidade de uma argumentação.\u003c/p>\u003c/dd>\u003cdt>filosofias helenísticas\u003c/dt>\u003cdd>\u003cp>Correntes filosóficas desenvolvidas no período helenístico, como epicurismo, estoicismo e ceticismo.\u003c/p>\u003c/dd>\u003cdt>revisão do bimestre\u003c/dt>\u003cdd>\u003cp>Retomada das ideias centrais e das relações construídas ao longo do bimestre.\u003c/p>\u003c/dd>\u003cdt>síntese\u003c/dt>\u003cdd>\u003cp>Organização integrada das ideias centrais de um conteúdo, destacando relações entre elas.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 6\u003c/div>\u003ch4>SÍNTESE\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>A síntese pode reunir dois eixos: como justificamos o que pensamos e como justificamos modos de viver. Lógica e falácias oferecem critérios para avaliar razões; filosofias helenísticas investigam desejos, juízos e tranquilidade; dignidade e reconhecimento deslocam a ética para relações com outras pessoas.\u003c/p>\u003cp>A melhor conclusão não é escolher uma escola 'vencedora', mas mostrar diferenças de problema e método. A Filosofia aparece como prática de formular questões, argumentar, comparar posições e reconhecer limites.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-6-study-heading\">\u003ch4 id=\"s1-filosofia-semana-6-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Organize a revisão por perguntas: que razões sustentam uma conclusão? O que torna uma vida boa? Como tratar outras pessoas? Peça que o aluno indique, em cada resposta, o critério empregado e uma possível objeção.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Uma semelhança de vocabulário não estabelece identidade de doutrina. Tranquilidade em Epicuro e no pirronismo, por exemplo, precisa ser relacionada ao caminho de cada escola.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Uma personagem defende que todo desejo deve ser satisfeito e usa a popularidade dessa ideia como prova.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>A turma pode examinar separadamente o argumento e o critério ético. A situação é inventada e não tem uma resposta única pronta.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/logical-consequence/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Logical Consequence\u003c/a>\u003cp>Referência conceitual: consequência dedutiva e indução.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/fallacies/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Fallacies\u003c/a>\u003cp>Referência conceitual: análise contextual de falácias.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://classics.mit.edu/Epicurus/menoec.html\" target=\"_blank\" rel=\"noopener\">Epicuro — Carta a Meneceu, §§127–132; tradução inglesa de Robert Drew Hicks, Internet Classics Archive/MIT\u003c/a>\u003cp>Fonte primária: classificação dos desejos e escolha prudente de prazeres.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/skepticism-ancient/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Ancient Skepticism\u003c/a>\u003cp>Referência conceitual: investigação e suspensão do juízo.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Escolas helenísticas eram comunidades de ensino e prática, não apenas capítulos de livro: filosofia envolvia exercícios, hábitos e modos de vida.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Peça à turma para distinguir conselho, argumento e princípio ético em frases contemporâneas.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Teorias diferentes podem ser somadas sem examinar seus pressupostos?\u003c/h5>\u003cp>Comparar exige explicitar problema, premissas e critério de cada teoria; convergência prática não demonstra identidade conceitual.\u003c/p>\u003cp>Limite da resposta: Uma semelhança de vocabulário não estabelece identidade de doutrina. Tranquilidade em Epicuro e no pirronismo, por exemplo, precisa ser relacionada ao caminho de cada escola.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema de conceitos\u003c/h3>\u003cdl>\u003cdt>Problema filosófico\u003c/dt>\u003cdd>Questão que exige esclarecer conceitos, pressupostos e razões, e admite confronto de posições. Não é apenas uma pergunta difícil.\u003c/dd>\u003cdt>Comparação de teorias\u003c/dt>\u003cdd>Reconstrução das respostas dadas ao mesmo problema, ou identificação de que os autores respondem a problemas diferentes.\u003c/dd>\u003cdt>Síntese argumentativa\u003c/dt>\u003cdd>Texto que relaciona teses com razões e explicita convergências e divergências. Não pressupõe que todas as posições se fundam em uma teoria.\u003c/dd>\u003c/dl>\u003cp class=\"ux-board-question\">Teorias diferentes podem ser somadas sem examinar seus pressupostos?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003cp>Na síntese, avalie: precisão dos conceitos, evidências, relação entre razões e conclusão, melhor objeção e resposta fundamentada. A nota considera a qualidade do argumento, não a concordância com a posição da professora.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Questões relacionadas ao conteúdo desta semana\u003c/p>\u003cp class=\"ux-editorial-note\">Direta: o conteúdo cobrado coincide com a aula. Aproximação: permite comparação ou aprofundamento. O ano é a edição do exame. A numeração depende do caderno indicado.\u003c/p>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-059\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Liberdade, responsabilidade e relativismo ético-moral\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · Filosofia discursiva, questão 2 · Humanas, 2º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cp>Exercitar a comparação de razões e critérios éticos no fechamento; essas provas não cobram Epicuro, Epicteto ou os céticos.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-005\">\u003ch5>Enem — aplicação regular · 2020\u003c/h5>\u003cp class=\"ux-exam-theme\">O estigma associado às doenças mentais na sociedade brasileira\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cp>Exercitar a comparação de razões e critérios éticos no fechamento; essas provas não cobram Epicuro, Epicteto ou os céticos.\u003c/p>\u003cp>Edição 2020, aplicação impressa em janeiro de 2021.\u003c/p>\u003ca href=\"https://riep.inep.gov.br/bitstreams/c7f9eb38-a261-4c58-a1f0-21b68d7be34e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003cp class=\"ux-editorial-note\">Seleção documentada de 59 registros das edições 2016–2025; não é levantamento exaustivo nem previsão de prova. Um tema de redação não comprova que a prova exigiu o filósofo desta aula.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Retomar argumento e falácia em exemplos filosóficos.\u003c/li>\u003cli>Comparar Epicuro, estoicos e céticos sobre vida boa.\u003c/li>\u003cli>Produzir síntese conectando autonomia e reconhecimento.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Evite transformar a síntese em lista de definições.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Dois eixos conectados: ARGUMENTAÇÃO (razões) &lt;-&gt; VIDA BOA (desejos/juízos) &lt;-&gt; RELAÇÕES (dignidade/reconhecimento).\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: epicurismo (desejos medidos e amizade); estoicismo (o que depende de nós); ceticismo (suspensão do juízo). Q2: oferecer razões que podem ser avaliadas. Q3: decisões envolvem outras pessoas e justiça. Q4: epicurismo: tranquilidade e amizade; estoicismo: agir no que depende (buscar fatos); ceticismo: não concluir sem razões. Q5: p. ex. ataque pessoal, generalização apressada, falso dilema. Q6: posição com dois conceitos.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"}]}]}</script><script>
      (function(){'use strict';const data=JSON.parse(document.getElementById('shareData').textContent),select=document.getElementById('shareGroup'),content=document.querySelector('.share-content'),weeks=document.querySelector('.share-weeks'),tabs=document.querySelector('.share-tabs');let index=0,material='quadro';
      document.title=data.title;document.getElementById('shareHeading').textContent=data.title;
      data.items.forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=g.label;select.append(o);});
      const materials=data.kind==='professor'?[['preparacao','Preparação'],['quadro','Quadro'],['esquema','Esquema'],['atividade','Atividades'],['exames','Exames'],['fontes','Fontes']]:[['quadro','Quadro'],['esquema','Esquema'],['atividade','Atividades'],['exames','Exames'],['fontes','Fontes']];
      materials.forEach(([key,label])=>{const b=document.createElement('button');b.type='button';b.dataset.material=key;b.textContent=label;b.setAttribute('role','tab');b.onclick=()=>{material=key;render();};tabs.append(b);});
      function render(){const g=data.items[Number(select.value)],lesson=g.lessons[index];document.getElementById('shareAudience').textContent=g.classes.join(' · ');document.querySelector('.share-title').textContent=lesson.title;content.replaceChildren();weeks.replaceChildren();g.lessons.forEach((l,i)=>{const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','Semana '+(i+1));b.setAttribute('aria-pressed',String(i===index));b.onclick=()=>{index=i;render();window.scrollTo(0,0);};weeks.append(b);});
      tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.material===material)));
      if(material==='fontes'){const ul=document.createElement('ul');ul.className='share-sources';lesson.fontes.forEach(f=>{const li=document.createElement('li'),a=document.createElement('a');a.textContent=f.t;a.href=f.u;a.target='_blank';a.rel='noopener';li.append(a);ul.append(li);});content.append(ul);if(!lesson.fontes.length)content.textContent='Nenhuma fonte cadastrada nesta aula.';}else content.innerHTML=lesson[material]||'';}
      select.onchange=()=>{index=0;render();window.scrollTo(0,0);};document.getElementById('shareProject').onclick=()=>{const on=document.body.classList.toggle('share-project');material='quadro';document.getElementById('shareProject').textContent=on?'Sair da projeção':'Projetar quadro';render();window.scrollTo(0,0);};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('share-project'))document.getElementById('shareProject').click();});render();})();
      </script></body></html>
