 as três esferas do reconhecimento às autorrelações apresentadas no texto.\u003c/li>\u003cli>Em um caso fictício, uma estudante é elogiada, mas nunca pode opinar nas decisões do grupo. Por que o elogio não resolve o problema?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Reconhecimento — em Honneth\u003c/dt>\u003cdd>Relação intersubjetiva em que a pessoa encontra consideração por suas necessidades, seu estatuto de sujeito de direitos e suas contribuições.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Cuidado e vínculos afetivos\u003c/dt>\u003cdd>Esfera do reconhecimento ligada a necessidades e vínculos próximos, importante para a autoconfiança; não significa exigir amor pessoal de todos.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Reconhecimento jurídico\u003c/dt>\u003cdd>Consideração da pessoa como sujeito de direitos, importante para o autorrespeito; não depende de prestígio social.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Ser visto por outras pessoas é o mesmo que ser reconhecido com respeito?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Honneth: reconhecimento e pertencimento\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Axel Honneth entende o reconhecimento como uma relação entre pessoas que participa da construção de sua relação consigo mesmas. Cuidado e vínculos afetivos ajudam a desenvolver autoconfiança. Ser reconhecido como sujeito de direitos se relaciona ao autorrespeito. A consideração social pelas capacidades e contribuições se relaciona à autoestima. Essas esferas não são etapas para merecer direitos. Reconhecimento também não é sinônimo de visibilidade ou elogio: alguém pode receber atenção e ainda ser humilhado ou excluído. A análise precisa considerar como pessoas e instituições tratam necessidades, direitos e contribuições.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Por que reconhecimento não é sinônimo de visibilidade?\u003c/li>\u003cli>Relacione as três esferas do reconhecimento às autorrelações apresentadas no texto.\u003c/li>\u003cli>Em um caso fictício, uma estudante é elogiada, mas nunca pode opinar nas decisões do grupo. Por que o elogio não resolve o problema?\u003c/li>\u003cli>Faça o organizador sugerido: Três blocos: cuidado → autoconfiança; direitos → autorrespeito; estima social → autoestima.\u003c/li>\u003cli>Escolha dois conceitos e use cada um em uma frase que explique o caso da aula.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas respondendo à questão-problema. Use conceitos e uma razão; considere uma objeção.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Reconhecimento, teoria crítica e sociedade: sobre desenvolvimento da obra de Axel Honneth e os desafios da sua aplicação no Brasil","u":"https://www.scielo.br/j/soc/a/Drhr9LsbFXdHvyXyjfwv53p/","n":"Artigo acadêmico em português; leitura de apoio sobre reconhecimento e sua recepção no Brasil."},{"t":"Stanford Encyclopedia of Philosophy — Recognition","u":"https://plato.stanford.edu/entries/recognition/","n":"Estudo de referência: dimensões normativas e sociais do reconhecimento."},{"t":"ONU/UNICEF — Declaração Universal dos Direitos Humanos","u":"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos","n":"Texto em português; selecione artigos conforme o objetivo da semana."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Honneth: reconhecimento e pertencimento; Reconhecimento — em Honneth; Cuidado e vínculos afetivos; Reconhecimento jurídico; Solidariedade e estima social.\u003c/p>\u003c/section>\u003csection class=\"wide\">\u003ch4>Leitura e atividade\u003c/h4>\u003cp>Três blocos: cuidado → autoconfiança; direitos → autorrespeito; estima social → autoestima.\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS605\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — direitos civis, políticos e sociais; dignidade em Kant; reconhecimento em Axel Honneth. Matriz 2026, 4º bimestre: recorte fornecido pela professora.\u003c/p>\u003c/section>\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">Reconhecimento — em Honneth\u003c/span>\u003cspan class=\"concept-chip\">Cuidado e vínculos afetivos\u003c/span>\u003cspan class=\"concept-chip\">Reconhecimento jurídico\u003c/span>\u003cspan class=\"concept-chip\">Solidariedade e estima social\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Honneth: reconhecimento e pertencimento\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Reconhecimento — em Honneth\u003c/strong>\u003cspan>Relação intersubjetiva em que a pessoa encontra consideração por suas necessidades, seu estatuto de sujeito de direitos e suas contribuições.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Cuidado e vínculos afetivos\u003c/strong>\u003cspan>Esfera do reconhecimento ligada a necessidades e vínculos próximos, importante para a autoconfiança; não significa exigir amor pessoal de todos.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Reconhecimento jurídico\u003c/strong>\u003cspan>Consideração da pessoa como sujeito de direitos, importante para o autorrespeito; não depende de prestígio social.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Solidariedade e estima social\u003c/strong>\u003cspan>Valorização de capacidades e contribuições em uma comunidade; relaciona-se à autoestima e não se reduz à fama.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Três blocos: cuidado → autoconfiança; direitos → autorrespeito; estima social → autoestima.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Por que reconhecimento não é sinônimo de visibilidade?\u003c/li>\u003cli>Relacione as três esferas do reconhecimento às autorrelações apresentadas no texto.\u003c/li>\u003cli>Em um caso fictício, uma estudante é elogiada, mas nunca pode opinar nas decisões do grupo. Por que o elogio não resolve o problema?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-5-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-5-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Reconhecimento — em Honneth\u003c/dt>\u003cdd>\u003cp>Relação intersubjetiva em que a pessoa encontra consideração por suas necessidades, seu estatuto de sujeito de direitos e suas contribuições.\u003c/p>\u003c/dd>\u003cdt>Cuidado e vínculos afetivos\u003c/dt>\u003cdd>\u003cp>Esfera do reconhecimento ligada a necessidades e vínculos próximos, importante para a autoconfiança; não significa exigir amor pessoal de todos.\u003c/p>\u003c/dd>\u003cdt>Reconhecimento jurídico\u003c/dt>\u003cdd>\u003cp>Consideração da pessoa como sujeito de direitos, importante para o autorrespeito; não depende de prestígio social.\u003c/p>\u003c/dd>\u003cdt>Solidariedade e estima social\u003c/dt>\u003cdd>\u003cp>Valorização de capacidades e contribuições em uma comunidade; relaciona-se à autoestima e não se reduz à fama.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 5\u003c/div>\u003ch4>Honneth: reconhecimento e pertencimento\u003c/h4>\u003c/div>\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Em Luta por reconhecimento, Axel Honneth analisa relações de cuidado e amor, direitos e solidariedade ou estima social. Essas esferas se relacionam, respectivamente, à autoconfiança, ao autorrespeito e à autoestima. Não são uma escada de merecimento: a pessoa não precisa conquistar popularidade para ter direitos.\u003c/p>\u003cp>O reconhecimento não é apenas elogio ou visibilidade. Uma pessoa pode aparecer em público sob uma representação humilhante, ou receber elogios e continuar excluída de decisões. Analise relações e instituições, não apenas sentimentos individuais. O reconhecimento jurídico e a estima social devem ser distinguidos para não fazer os direitos dependerem do valor atribuído às contribuições.\u003c/p>\u003ch4>Roteiro de aplicação\u003c/h4>\u003cp>Comece pela questão-problema, explique os conceitos, leia a fonte indicada e analise um caso fictício. Feche com um registro e uma justificativa. Adapte o tempo e os recursos à turma.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-5-study-heading\">\u003ch4 id=\"s1-filosofia-semana-5-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Em Luta por reconhecimento, Axel Honneth analisa relações de cuidado e amor, direitos e solidariedade ou estima social. Essas esferas se relacionam, respectivamente, à autoconfiança, ao autorrespeito e à autoestima. Não são uma escada de merecimento: a pessoa não precisa conquistar popularidade para ter direitos.\u003c/p>\u003cp>O reconhecimento não é apenas elogio ou visibilidade. Uma pessoa pode aparecer em público sob uma representação humilhante, ou receber elogios e continuar excluída de decisões. Analise relações e instituições, não apenas sentimentos individuais. O reconhecimento jurídico e a estima social devem ser distinguidos para não fazer os direitos dependerem do valor atribuído às contribuições.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>As esferas do reconhecimento não são etapas para merecer direitos. Evite confundir cuidado com obrigação de gostar de todos, reconhecimento jurídico com prestígio, ou autoestima com simples pensamento positivo.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Em um caso fictício, uma estudante é elogiada, mas nunca pode opinar nas decisões do grupo. Por que o elogio não resolve o problema?\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>O caso é uma situação fictícia de aplicação dos conceitos, não um relato documentado. Visibilidade é aparecer; reconhecimento exige consideração pelas necessidades, direitos e contribuições. É possível aparecer sob humilhação. Cuidado e amor: autoconfiança; direitos: autorrespeito; solidariedade e estima: autoestima. Não tratar essas relações como etapas para merecer direitos. Elogio não garante participação nem respeito à sua agência. Identificar a exclusão nas práticas do grupo e propor mudança na tomada de decisões.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://www.scielo.br/j/soc/a/Drhr9LsbFXdHvyXyjfwv53p/\" target=\"_blank\" rel=\"noopener\">Reconhecimento, teoria crítica e sociedade: sobre desenvolvimento da obra de Axel Honneth e os desafios da sua aplicação no Brasil\u003c/a>\u003cp>Artigo acadêmico em português; leitura de apoio sobre reconhecimento e sua recepção no Brasil.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/recognition/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Recognition\u003c/a>\u003cp>Estudo de referência: dimensões normativas e sociais do reconhecimento.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Ser visto por outras pessoas é o mesmo que ser reconhecido com respeito?\u003c/h5>\u003cp>Em Luta por reconhecimento, Axel Honneth analisa relações de cuidado e amor, direitos e solidariedade ou estima social. Essas esferas se relacionam, respectivamente, à autoconfiança, ao autorrespeito e à autoestima. Não são uma escada de merecimento: a pessoa não precisa conquistar popularidade para ter direitos. O reconhecimento não é apenas elogio ou visibilidade. Uma pessoa pode aparecer em público sob uma representação humilhante, ou receber elogios e continuar excluída de decisões. Analise relações e instituições, não apenas sentimentos individuais. O reconhecimento jurídico e a estima social devem ser distinguidos para não fazer os direitos dependerem do valor atribuído às contribuições.\u003c/p>\u003cp>Limite da resposta: As esferas do reconhecimento não são etapas para merecer direitos. Evite confundir cuidado com obrigação de gostar de todos, reconhecimento jurídico com prestígio, ou autoestima com simples pensamento positivo.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Reconhecimento — em Honneth\u003c/dt>\u003cdd>Relação intersubjetiva em que a pessoa encontra consideração por suas necessidades, seu estatuto de sujeito de direitos e suas contribuições.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Cuidado e vínculos afetivos\u003c/dt>\u003cdd>Esfera do reconhecimento ligada a necessidades e vínculos próximos, importante para a autoconfiança; não significa exigir amor pessoal de todos.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Reconhecimento jurídico\u003c/dt>\u003cdd>Consideração da pessoa como sujeito de direitos, importante para o autorrespeito; não depende de prestígio social.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Ser visto por outras pessoas é o mesmo que ser reconhecido com respeito?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Honneth: reconhecimento e pertencimento\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"redacao-pas-2025-identidade\">\u003ch5>PAS/UnB — 3ª etapa · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Como nossa identidade é definida atualmente?\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Cebraspe · Tema 2, p. 5 · Edital 2025\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003cp>O candidato escolhia um entre três temas; esta é a proposta 2.\u003c/p>\u003c/details>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/098_PAS3_001_DISC.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-008\">\u003ch5>Enem — aplicação regular · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para o enfrentamento da invisibilidade do trabalho de cuidado realizado pela mulher no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/6f6e6a08-9f0b-4365-9f52-a24c5e4ab2e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Estude Honneth: reconhecimento e pertencimento para explicar as diferenças conceituais e conduzir a análise de situações. A leitura serve de apoio à habilidade GO-EMCHS606A da matriz de 2026 fornecida pela professora.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.scielo.br/j/soc/a/Drhr9LsbFXdHvyXyjfwv53p/\" target=\"_blank\" rel=\"noopener\">Reconhecimento, teoria crítica e sociedade: sobre desenvolvimento da obra de Axel Honneth e os desafios da sua aplicação no Brasil\u003c/a>\u003cp>Leitura prioritária: Honneth: reconhecimento e pertencimento. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Artigo acadêmico em português; leitura de apoio sobre reconhecimento e sua recepção no Brasil.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/recognition/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Recognition\u003c/a>\u003cp>Leitura prioritária: Honneth: reconhecimento e pertencimento. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Estudo de referência: dimensões normativas e sociais do reconhecimento.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Leitura prioritária: Honneth: reconhecimento e pertencimento. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\u003cp>25 min para leitura e registro; 35 min para as questões; 20 min para organizador e parágrafo; 10 min para revisão. Ajuste à turma.\u003c/p>\u003ch5>Respostas e critérios\u003c/h5>\u003col>\u003cli>Visibilidade é aparecer; reconhecimento exige consideração pelas necessidades, direitos e contribuições. É possível aparecer sob humilhação.\u003c/li>\u003cli>Cuidado e amor: autoconfiança; direitos: autorrespeito; solidariedade e estima: autoestima. Não tratar essas relações como etapas para merecer direitos.\u003c/li>\u003cli>Elogio não garante participação nem respeito à sua agência. Identificar a exclusão nas práticas do grupo e propor mudança na tomada de decisões.\u003c/li>\u003cli>O organizador deve explicitar relações coerentes entre os conceitos e o caso.\u003c/li>\u003cli>As frases devem aplicar os conceitos sem confundi-los.\u003c/li>\u003cli>Avalie tese, razões, conceitos e objeção; não a concordância com a opinião da professora.\u003c/li>\u003c/ol>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Reconhecimento, exclusão e defesa dos direitos\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"redacao-pas-2024\">\u003ch5>PAS/UnB — 3ª etapa · 2024\u003c/h5>\u003cp class=\"ux-exam-theme\">Redes sociais: de “terra de ninguém” a espaço acolhedor para os muitos alguéns\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Cebraspe · Proposta de redação, p. 1 · Edital 2024\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/987_PAS3_001_DISC.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-009\">\u003ch5>Enem — aplicação regular · 2024\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a valorização da herança africana no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://download.inep.gov.br/enem/provas_e_gabaritos/2024_PV_impresso_D1_CD2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s1-filosofia-semana-6","title":"Reconhecimento, exclusão e defesa dos direitos","quadro":"\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Reconhecimento, exclusão e defesa dos direitos\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Exclusão\u003c/strong>\u003cspan>Barreiras que impedem ou reduzem participação e acesso a direitos, mesmo quando não há uma proibição explícita.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Preconceito\u003c/strong>\u003cspan>Julgamento prévio que inferioriza ou generaliza pessoas a partir de características atribuídas a um grupo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Desrespeito\u003c/strong>\u003cspan>Práticas que negam consideração às necessidades, aos direitos ou às contribuições da pessoa.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Justiça social\u003c/strong>\u003cspan>Análise das condições, relações e instituições que permitem participação e proteção de direitos; não se limita à boa vontade individual.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Defesa dos direitos\u003c/strong>\u003cspan>Ação fundamentada que identifica uma barreira ou violação e propõe condições para proteger dignidade, liberdade e participação.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Caso → direito → barreira → Kant/Honneth → medida → verificação do resultado.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Compare o problema da instrumentalização em Kant com o do desrespeito em Honneth.\u003c/li>\u003cli>Por que um procedimento igual pode não garantir participação em condições de igualdade?\u003c/li>\u003cli>Uma turma precisa de informações para escolher representantes, mas parte dela não consegue acessar o formato do aviso. Identifique direitos, barreiras e uma medida de mudança.\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Exclusão\u003c/dt>\u003cdd>Barreiras que impedem ou reduzem participação e acesso a direitos, mesmo quando não há uma proibição explícita.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Preconceito\u003c/dt>\u003cdd>Julgamento prévio que inferioriza ou generaliza pessoas a partir de características atribuídas a um grupo.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Desrespeito\u003c/dt>\u003cdd>Práticas que negam consideração às necessidades, aos direitos ou às contribuições da pessoa.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Uma regra igual para todos pode manter pessoas excluídas?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Reconhecimento, exclusão e defesa dos direitos\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Uma regra pode parecer igual e ainda produzir barreiras diferentes. Se um aviso necessário à participação existe apenas em um formato inacessível a parte dos estudantes, o problema não se resolve dizendo que todos receberam o mesmo procedimento. A dignidade, em Kant, exige que pessoas não sejam tratadas apenas como instrumentos. O reconhecimento, em Honneth, permite examinar necessidades, direitos e estima social. Para defender um direito, precisamos identificar a barreira, justificar a análise e propor uma mudança concreta. A medida deve ser avaliada por seus efeitos sobre participação e respeito, e não apenas por sua boa intenção.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Compare o problema da instrumentalização em Kant com o do desrespeito em Honneth.\u003c/li>\u003cli>Por que um procedimento igual pode não garantir participação em condições de igualdade?\u003c/li>\u003cli>Uma turma precisa de informações para escolher representantes, mas parte dela não consegue acessar o formato do aviso. Identifique direitos, barreiras e uma medida de mudança.\u003c/li>\u003cli>Faça o organizador sugerido: Caso → direito → barreira → Kant/Honneth → medida → verificação do resultado.\u003c/li>\u003cli>Escolha dois conceitos e use cada um em uma frase que explique o caso da aula.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas respondendo à questão-problema. Use conceitos e uma razão; considere uma objeção.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"ONU/UNICEF — Declaração Universal dos Direitos Humanos","u":"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos","n":"Texto em português; selecione artigos conforme o objetivo da semana."},{"t":"Immanuel Kant — Fundamentação da metafísica dos costumes, seção II","u":"https://www.gutenberg.org/ebooks/5682","n":"Tradução inglesa de Thomas Kingsmill Abbott, intitulada Fundamental Principles of the Metaphysic of Morals. Leitura de apoio da professora."},{"t":"Reconhecimento, teoria crítica e sociedade: sobre desenvolvimento da obra de Axel Honneth e os desafios da sua aplicação no Brasil","u":"https://www.scielo.br/j/soc/a/Drhr9LsbFXdHvyXyjfwv53p/","n":"Artigo acadêmico em português; leitura de apoio sobre reconhecimento e sua recepção no Brasil."},{"t":"Stanford Encyclopedia of Philosophy — Recognition","u":"https://plato.stanford.edu/entries/recognition/","n":"Estudo de referência: dimensões normativas e sociais do reconhecimento."},{"t":"Jorge Furtado — Ilha das Flores (1989), Casa de Cinema de Porto Alegre","u":"https://arquivo.casacinepoa.com.br/site_antigo/port/filmes/ilhadasf.htm","n":"Filme e roteiro: página da produtora com ficha e textos. Acesso ao filme pode depender de plataforma; a página não garante exibição integral gratuita."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Reconhecimento, exclusão e defesa dos direitos; Exclusão; Preconceito; Desrespeito; Justiça social; Defesa dos direitos.\u003c/p>\u003c/section>\u003csection class=\"wide\">\u003ch4>Leitura e atividade\u003c/h4>\u003cp>Caso → direito → barreira → Kant/Honneth → medida → verificação do resultado.\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS605\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — direitos civis, políticos e sociais; dignidade em Kant; reconhecimento em Axel Honneth. Matriz 2026, 4º bimestre: recorte fornecido pela professora.\u003c/p>\u003c/section>\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">Exclusão\u003c/span>\u003cspan class=\"concept-chip\">Preconceito\u003c/span>\u003cspan class=\"concept-chip\">Desrespeito\u003c/span>\u003cspan class=\"concept-chip\">Justiça social\u003c/span>\u003cspan class=\"concept-chip\">Defesa dos direitos\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Reconhecimento, exclusão e defesa dos direitos\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Exclusão\u003c/strong>\u003cspan>Barreiras que impedem ou reduzem participação e acesso a direitos, mesmo quando não há uma proibição explícita.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Preconceito\u003c/strong>\u003cspan>Julgamento prévio que inferioriza ou generaliza pessoas a partir de características atribuídas a um grupo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Desrespeito\u003c/strong>\u003cspan>Práticas que negam consideração às necessidades, aos direitos ou às contribuições da pessoa.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Justiça social\u003c/strong>\u003cspan>Análise das condições, relações e instituições que permitem participação e proteção de direitos; não se limita à boa vontade individual.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Defesa dos direitos\u003c/strong>\u003cspan>Ação fundamentada que identifica uma barreira ou violação e propõe condições para proteger dignidade, liberdade e participação.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Caso → direito → barreira → Kant/Honneth → medida → verificação do resultado.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Compare o problema da instrumentalização em Kant com o do desrespeito em Honneth.\u003c/li>\u003cli>Por que um procedimento igual pode não garantir participação em condições de igualdade?\u003c/li>\u003cli>Uma turma precisa de informações para escolher representantes, mas parte dela não consegue acessar o formato do aviso. Identifique direitos, barreiras e uma medida de mudança.\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-6-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-6-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Exclusão\u003c/dt>\u003cdd>\u003cp>Barreiras que impedem ou reduzem participação e acesso a direitos, mesmo quando não há uma proibição explícita.\u003c/p>\u003c/dd>\u003cdt>Preconceito\u003c/dt>\u003cdd>\u003cp>Julgamento prévio que inferioriza ou generaliza pessoas a partir de características atribuídas a um grupo.\u003c/p>\u003c/dd>\u003cdt>Desrespeito\u003c/dt>\u003cdd>\u003cp>Práticas que negam consideração às necessidades, aos direitos ou às contribuições da pessoa.\u003c/p>\u003c/dd>\u003cdt>Justiça social\u003c/dt>\u003cdd>\u003cp>Análise das condições, relações e instituições que permitem participação e proteção de direitos; não se limita à boa vontade individual.\u003c/p>\u003c/dd>\u003cdt>Defesa dos direitos\u003c/dt>\u003cdd>\u003cp>Ação fundamentada que identifica uma barreira ou violação e propõe condições para proteger dignidade, liberdade e participação.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 6\u003c/div>\u003ch4>Reconhecimento, exclusão e defesa dos direitos\u003c/h4>\u003c/div>\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>A síntese compara problemas e critérios, sem fundir Kant e Honneth em uma única teoria. Kant contribui para avaliar o respeito à pessoa e a instrumentalização; Honneth ajuda a analisar relações de reconhecimento e experiências de desrespeito. A DUDH oferece uma referência para identificar direitos relacionados aos casos.\u003c/p>\u003cp>Trabalhe uma situação fictícia de acesso à informação ou de participação escolar. Peça direito envolvido, evidência do problema, conceito utilizado e proposta concreta. A proposta deve indicar quem age, o que muda e como verificar o resultado. Não exija concordância com a opinião da professora: avalie precisão, sustentação e consideração de objeções.\u003c/p>\u003ch4>Roteiro de aplicação\u003c/h4>\u003cp>Comece pela questão-problema, explique os conceitos, leia a fonte indicada e analise um caso fictício. Feche com um registro e uma justificativa. Adapte o tempo e os recursos à turma.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-6-study-heading\">\u003ch4 id=\"s1-filosofia-semana-6-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>A síntese compara problemas e critérios, sem fundir Kant e Honneth em uma única teoria. Kant contribui para avaliar o respeito à pessoa e a instrumentalização; Honneth ajuda a analisar relações de reconhecimento e experiências de desrespeito. A DUDH oferece uma referência para identificar direitos relacionados aos casos.\u003c/p>\u003cp>Trabalhe uma situação fictícia de acesso à informação ou de participação escolar. Peça direito envolvido, evidência do problema, conceito utilizado e proposta concreta. A proposta deve indicar quem age, o que muda e como verificar o resultado. Não exija concordância com a opinião da professora: avalie precisão, sustentação e consideração de objeções.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Não classifique qualquer discordância como preconceito ou violação. Examine a situação e as evidências. A avaliação deve considerar argumentos e conceitos, não a concordância com a professora ou a exposição da vida pessoal.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Uma turma precisa de informações para escolher representantes, mas parte dela não consegue acessar o formato do aviso. Identifique direitos, barreiras e uma medida de mudança.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>O caso é uma situação fictícia de aplicação dos conceitos, não um relato documentado. Kant examina o respeito à pessoa como fim; Honneth analisa relações de reconhecimento e formas de desrespeito. Não tratá-los como conceitos idênticos. Diferenças de acesso podem tornar o mesmo procedimento excludente; identificar a barreira e o direito afetado. Relacionar informação, participação e igualdade; propor formatos acessíveis, consulta aos envolvidos e verificação de acesso, com responsáveis definidos.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.gutenberg.org/ebooks/5682\" target=\"_blank\" rel=\"noopener\">Immanuel Kant — Fundamentação da metafísica dos costumes, seção II\u003c/a>\u003cp>Tradução inglesa de Thomas Kingsmill Abbott, intitulada Fundamental Principles of the Metaphysic of Morals. Leitura de apoio da professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.scielo.br/j/soc/a/Drhr9LsbFXdHvyXyjfwv53p/\" target=\"_blank\" rel=\"noopener\">Reconhecimento, teoria crítica e sociedade: sobre desenvolvimento da obra de Axel Honneth e os desafios da sua aplicação no Brasil\u003c/a>\u003cp>Artigo acadêmico em português; leitura de apoio sobre reconhecimento e sua recepção no Brasil.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/recognition/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Recognition\u003c/a>\u003cp>Estudo de referência: dimensões normativas e sociais do reconhecimento.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Uma regra igual para todos pode manter pessoas excluídas?\u003c/h5>\u003cp>A síntese compara problemas e critérios, sem fundir Kant e Honneth em uma única teoria. Kant contribui para avaliar o respeito à pessoa e a instrumentalização; Honneth ajuda a analisar relações de reconhecimento e experiências de desrespeito. A DUDH oferece uma referência para identificar direitos relacionados aos casos. Trabalhe uma situação fictícia de acesso à informação ou de participação escolar. Peça direito envolvido, evidência do problema, conceito utilizado e proposta concreta. A proposta deve indicar quem age, o que muda e como verificar o resultado. Não exija concordância com a opinião da professora: avalie precisão, sustentação e consideração de objeções.\u003c/p>\u003cp>Limite da resposta: Não classifique qualquer discordância como preconceito ou violação. Examine a situação e as evidências. A avaliação deve considerar argumentos e conceitos, não a concordância com a professora ou a exposição da vida pessoal.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Exclusão\u003c/dt>\u003cdd>Barreiras que impedem ou reduzem participação e acesso a direitos, mesmo quando não há uma proibição explícita.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Preconceito\u003c/dt>\u003cdd>Julgamento prévio que inferioriza ou generaliza pessoas a partir de características atribuídas a um grupo.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Desrespeito\u003c/dt>\u003cdd>Práticas que negam consideração às necessidades, aos direitos ou às contribuições da pessoa.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Uma regra igual para todos pode manter pessoas excluídas?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003cp>Na síntese, avalie: precisão dos conceitos, evidências, relação entre razões e conclusão, melhor objeção e resposta fundamentada. A nota considera a qualidade do argumento, não a concordância com a posição da professora.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Reconhecimento, exclusão e defesa dos direitos\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"redacao-pas-2024\">\u003ch5>PAS/UnB — 3ª etapa · 2024\u003c/h5>\u003cp class=\"ux-exam-theme\">Redes sociais: de “terra de ninguém” a espaço acolhedor para os muitos alguéns\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Cebraspe · Proposta de redação, p. 1 · Edital 2024\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/987_PAS3_001_DISC.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-009\">\u003ch5>Enem — aplicação regular · 2024\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a valorização da herança africana no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://download.inep.gov.br/enem/provas_e_gabaritos/2024_PV_impresso_D1_CD2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Estude Reconhecimento, exclusão e defesa dos direitos para explicar as diferenças conceituais e conduzir a análise de situações. A leitura serve de apoio à habilidade GO-EMCHS606A da matriz de 2026 fornecida pela professora.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Leitura prioritária: Reconhecimento, exclusão e defesa dos direitos. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.gutenberg.org/ebooks/5682\" target=\"_blank\" rel=\"noopener\">Immanuel Kant — Fundamentação da metafísica dos costumes, seção II\u003c/a>\u003cp>Leitura prioritária: Reconhecimento, exclusão e defesa dos direitos. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Tradução inglesa de Thomas Kingsmill Abbott, intitulada Fundamental Principles of the Metaphysic of Morals. Leitura de apoio da professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.scielo.br/j/soc/a/Drhr9LsbFXdHvyXyjfwv53p/\" target=\"_blank\" rel=\"noopener\">Reconhecimento, teoria crítica e sociedade: sobre desenvolvimento da obra de Axel Honneth e os desafios da sua aplicação no Brasil\u003c/a>\u003cp>Leitura prioritária: Reconhecimento, exclusão e defesa dos direitos. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Artigo acadêmico em português; leitura de apoio sobre reconhecimento e sua recepção no Brasil.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/recognition/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Recognition\u003c/a>\u003cp>Leitura prioritária: Reconhecimento, exclusão e defesa dos direitos. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Estudo de referência: dimensões normativas e sociais do reconhecimento.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://arquivo.casacinepoa.com.br/site_antigo/port/filmes/ilhadasf.htm\" target=\"_blank\" rel=\"noopener\">Jorge Furtado — Ilha das Flores (1989), Casa de Cinema de Porto Alegre\u003c/a>\u003cp>Repertório opcional: analise como a montagem de Ilha das Flores evidencia barreiras ao acesso e à dignidade. O filme não substitui a DUDH nem funciona como relato estatístico do presente.\u003c/p>\u003cp>Filme e roteiro: página da produtora com ficha e textos. Acesso ao filme pode depender de plataforma; a página não garante exibição integral gratuita.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\u003cp>25 min para leitura e registro; 35 min para as questões; 20 min para organizador e parágrafo; 10 min para revisão. Ajuste à turma.\u003c/p>\u003ch5>Respostas e critérios\u003c/h5>\u003col>\u003cli>Kant examina o respeito à pessoa como fim; Honneth analisa relações de reconhecimento e formas de desrespeito. Não tratá-los como conceitos idênticos.\u003c/li>\u003cli>Diferenças de acesso podem tornar o mesmo procedimento excludente; identificar a barreira e o direito afetado.\u003c/li>\u003cli>Relacionar informação, participação e igualdade; propor formatos acessíveis, consulta aos envolvidos e verificação de acesso, com responsáveis definidos.\u003c/li>\u003cli>O organizador deve explicitar relações coerentes entre os conceitos e o caso.\u003c/li>\u003cli>As frases devem aplicar os conceitos sem confundi-los.\u003c/li>\u003cli>Avalie tese, razões, conceitos e objeção; não a concordância com a opinião da professora.\u003c/li>\u003c/ol>\u003c/div>\u003c/details>\u003c/section>"}]}]}</script><script>
      (function(){'use strict';const data=JSON.parse(document.getElementById('shareData').textContent),select=document.getElementById('shareGroup'),content=document.querySelector('.share-content'),weeks=document.querySelector('.share-weeks'),tabs=document.querySelector('.share-tabs');let index=0,material='quadro';
      document.title=data.title;document.getElementById('shareHeading').textContent=data.title;
      data.items.forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=g.label;select.append(o);});
      const materials=data.kind==='professor'?[['preparacao','Preparação'],['quadro','Quadro'],['esquema','Esquema'],['atividade','Atividades'],['exames','Exames'],['fontes','Fontes']]:[['quadro','Caderno'],['esquema','Esquema'],['atividade','Atividades'],['exames','Exames'],['fontes','Fontes e repertório']];
      materials.forEach(([key,label])=>{const b=document.createElement('button');b.type='button';b.dataset.material=key;b.textContent=label;b.setAttribute('role','tab');b.onclick=()=>{material=key;render();};tabs.append(b);});
      function render(){const g=data.items[Number(select.value)],lesson=g.lessons[index];document.getElementById('shareAudience').textContent=g.classes.join(' · ');document.querySelector('.share-title').textContent=lesson.title;content.replaceChildren();weeks.replaceChildren();g.lessons.forEach((l,i)=>{const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','Semana '+(i+1));b.setAttribute('aria-pressed',String(i===index));b.onclick=()=>{index=i;render();window.scrollTo(0,0);};weeks.append(b);});
      tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.material===material)));
      if(material==='fontes'){const ul=document.createElement('ul');ul.className='share-sources';lesson.fontes.forEach(f=>{const li=document.createElement('li'),a=document.createElement('a');a.textContent=f.t;a.href=f.u;a.target='_blank';a.rel='noopener';li.append(a);if(f.n){const note=document.createElement('p');note.textContent=f.n;li.append(note);}ul.append(li);});content.append(ul);if(!lesson.fontes.length)content.textContent='Nenhuma fonte cadastrada nesta aula.';}else content.innerHTML=lesson[material]||'';}
      select.onchange=()=>{index=0;render();window.scrollTo(0,0);};const project=document.getElementById('shareProject');if(project)project.onclick=()=>{const on=document.body.classList.toggle('share-project');material='quadro';document.getElementById('shareProject').textContent=on?'Sair da projeção':'Projetar quadro';render();window.scrollTo(0,0);};document.addEventListener('keydown',e=>{if(project&&e.key==='Escape'&&document.body.classList.contains('share-project'))project.click();});render();})();
      </script></body></html>
