final não revela sozinho todo o conflito.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://infograficos.camara.leg.br/35-anos-da-constituicao-federal/\" target=\"_blank\" rel=\"noopener\">Câmara dos Deputados — 35 anos da Constituição Federal\u003c/a>\u003cp>Fonte institucional: processo constituinte e participação popular.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">A Câmara registra 71.719 cartas de cidadãos enviadas com sugestões antes e durante o processo constituinte, além de mecanismos formais de participação.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Compare mecanismos constitucionais de participação sem transformar a aula em debate eleitoral.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>A Constituição expressa a vontade de um único grupo?\u003c/h5>\u003cp>O texto resultou de participação social, representação, disputas e compromissos. Distinguir atores ajuda a explicar conquistas e limites.\u003c/p>\u003cp>Limite da resposta: Um dispositivo não explica sozinho sua implementação. Para discussão jurídica concreta, consulte redação vigente e interpretação pertinente.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Constituinte e Constituição\u003c/dt>\u003cdd>Constituinte é processo e órgão de elaboração; Constituição é o texto resultante, submetido a interpretação e mudanças sob regras próprias.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Participação e representação\u003c/dt>\u003cdd>Participação envolve intervenção de pessoas e grupos; representação envolve atuação em nome de outros sob formas institucionais. Podem complementar-se e entrar em tensão.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Compromisso constitucional\u003c/dt>\u003cdd>Resultado de negociação entre projetos, não prova de ausência de conflito.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">A Constituição expressa a vontade de um único grupo?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Quem produziu a fonte, quando e para qual público? O que sua posição permite observar?\u003c/li>\u003cli>Como imagem, palavras, seleção e silêncios constroem a narrativa?\u003c/li>\u003cli>Que afirmação pode ser sustentada? Qual informação exige outra fonte independente?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Constituição de 1988 e participação popular\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-026\">\u003ch5>Enem — aplicação regular · 2019\u003c/h5>\u003cp class=\"ux-exam-theme\">SUS, Constituição de 1988 e características das políticas públicas\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 88 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Relacionar o texto constitucional à participação social, aos direitos e à limitação do poder estatal.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/ef59158b-11f9-4bf7-a9fc-64d801cd06e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-056\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Participação indígena na Constituição de 1988 e após a redemocratização\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · História discursiva, questão 3, itens A/B · Humanas, 2º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Relacionar o texto constitucional à participação social, aos direitos e à limitação do poder estatal.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003c/details>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-031\">\u003ch5>Enem — aplicação regular · 2022\u003c/h5>\u003cp class=\"ux-exam-theme\">Estado de direito e limites ao exercício do poder\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 88 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Relacionar o texto constitucional à participação social, aos direitos e à limitação do poder estatal.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/7d656252-c499-42dc-93c9-ea825cce7a0e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-006\">\u003ch5>Enem — aplicação regular · 2021\u003c/h5>\u003cp class=\"ux-exam-theme\">Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>O registro civil relaciona-se ao exercício da cidadania e ajuda a comparar direitos e acesso. A proposta não cobra o processo histórico da Constituinte.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/0ec029ac-140b-424a-9c62-f96095c25d3c/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Observe discursos, reivindicações e negociação na Constituinte. Diferencie uma demanda apresentada, uma norma aprovada e sua efetivação posterior.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://infograficos.camara.leg.br/35-anos-da-constituicao-federal/\" target=\"_blank\" rel=\"noopener\">Câmara dos Deputados — 35 anos da Constituição Federal\u003c/a>\u003cp>Leitura prioritária para a explicação: Constituinte e Constituição; Participação e representação; Compromisso constitucional.\u003c/p>\u003cp>Fonte institucional: processo constituinte e participação popular.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.camara.leg.br/tv/191357-anna-maria-rattes-a-conquista-dos-direitos-da-mulheres/\" target=\"_blank\" rel=\"noopener\">TV Câmara — Anna Maria Rattes: A conquista dos direitos da mulheres (20/08/2008)\u003c/a>\u003cp>Confronte depoimento e reivindicações da Constituinte. Identifique autoria, data e o que cada registro permite concluir.\u003c/p>\u003cp>Vídeo institucional do Diário da Constituinte: registro e depoimento retrospectivo. Considere a data do depoimento e o papel da entrevistada.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Ler artigos selecionados e localizar tipos de direitos.\u003c/li>\u003cli>Reconstruir participação social na Constituinte.\u003c/li>\u003cli>Distinguir reconhecimento, implementação e acesso.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não usar 'Constituição Cidadã' como se fosse consenso sobre todos os seus efeitos; é um nome histórico associado à ampliação de direitos.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Constituição = instituições + direitos + participação. Acrescente: reconhecimento jurídico &lt;-&gt; implementação &lt;-&gt; disputas sociais.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: Assembleia Constituinte eleita em 1986, com participação social; ampliou direitos. Q2: civil: liberdade de expressão; político: voto; social: saúde, educação ou trabalho. Q3: plebiscito, referendo e iniciativa popular de leis. Q4: incisos copiados do art. 5º com explicação coerente. Q5: o direito reconhecido precisa de políticas públicas, serviços e cobrança social. Q6: balanço com conquistas e limites, sem tese simplista.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Nova República e instituições democráticas\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-014\">\u003ch5>Enem — aplicação regular · 2016\u003c/h5>\u003cp class=\"ux-exam-theme\">Nova República: continuidades e rupturas na transição democrática\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 4 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Situar a Nova República e comparar democracia, direitos sociais e desenvolvimento; o indicador econômico não explica sozinho as condições de vida.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/dcb0d85d-5da4-48ee-b49a-e34db65c9c8b/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-020\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Amartya Sen: desenvolvimento e ampliação das liberdades\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 81 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Situar a Nova República e comparar democracia, direitos sociais e desenvolvimento; o indicador econômico não explica sozinho as condições de vida.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-026\">\u003ch5>Enem — aplicação regular · 2019\u003c/h5>\u003cp class=\"ux-exam-theme\">SUS, Constituição de 1988 e características das políticas públicas\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 88 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Situar a Nova República e comparar democracia, direitos sociais e desenvolvimento; o indicador econômico não explica sozinho as condições de vida.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/ef59158b-11f9-4bf7-a9fc-64d801cd06e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-006\">\u003ch5>Enem — aplicação regular · 2021\u003c/h5>\u003cp class=\"ux-exam-theme\">Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>A garantia de acesso à cidadania permite examinar efetivação de direitos na Nova República. A redação não pede uma cronologia dos governos.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/0ec029ac-140b-424a-9c62-f96095c25d3c/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s3-historia-semana-3","title":"NOVA REPÚBLICA","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-building\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M4 21V5h16v16M2 21h20M8 9h2m4 0h2M8 13h2m4 0h2M10 21v-5h4v5\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-ballot\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003crect height=\"10\" rx=\"1.5\" width=\"18\" x=\"3\" y=\"11\">\u003c/rect>\u003cpath d=\"M8 15h8M7 4l7-2 3 7-7 2zM11 6l2 1\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Nova República\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Nova República\u003c/strong> — \u003cspan>Designação do período iniciado com o fim do regime militar e a retomada de governos civis no Brasil.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>participação social\u003c/strong> — \u003cspan>Atuação de pessoas e grupos em decisões, organizações, debates e ações de interesse coletivo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>desigualdades\u003c/strong> — \u003cspan>Diferenças sociais que se tornam hierárquicas quando produzem acesso desigual a recursos, direitos e oportunidades.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>democracia\u003c/strong> — \u003cspan>Forma de organização política baseada em participação, direitos, pluralismo, representação e regras de disputa pelo poder.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-people\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"8\" cy=\"7\" r=\"3\">\u003c/circle>\u003ccircle cx=\"17\" cy=\"8\" r=\"2.5\">\u003c/circle>\u003cpath d=\"M2 21v-3a6 6 0 0 1 12 0v3H2zm12-8a5 5 0 0 1 8 4v4h-5\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> A Nova República combina democracia política e permanência de desigualdades, e a avaliação exige separar dimensões e períodos.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Quais desafios políticos e econômicos marcaram os primeiros anos da Nova República?\u003c/li>\u003cli>Como inflação, eleições e reorganização partidária influenciaram a vida política brasileira?\u003c/li>\u003cli>Por que a consolidação democrática envolve instituições, conflitos e participação social?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Nova República\u003c/dt>\u003cdd>Periodização da história política brasileira a partir da transição de 1985. Não significa um governo único ou ausência de mudanças internas.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Democracia e qualidade institucional\u003c/dt>\u003cdd>Análise de participação, garantias, controle e funcionamento das instituições. Não se reduz à existência periódica de eleições.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Série histórica e causalidade\u003c/dt>\u003cdd>Uma sequência de indicadores mostra variação no tempo; explicar a variação exige investigar políticas, condições e outros fatores.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Um gráfico prova que um governo causou uma mudança social?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Nova República: democracia e desigualdades\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">A Nova República é o período iniciado em 1985, com o fim da ditadura. Teve conquistas políticas: eleições diretas regulares, liberdade de imprensa, partidos e sindicatos livres e instituições fortalecidas, como o Ministério Público. Houve também avanços sociais, como a criação do Sistema Único de Saúde (SUS) e a ampliação do acesso à escola. Ao mesmo tempo, o período enfrentou crises econômicas e inflação alta nos anos 1980 e 1990, o Plano Real (1994), desigualdades persistentes de renda, raça e território e dificuldades de efetivar direitos. Avaliar esse período exige separar dimensões (política, social, econômica) e momentos, em vez de dizer simplesmente que a democracia 'deu certo' ou 'fracassou'.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Que conquistas políticas da Nova República o texto cita?\u003c/li>\u003cli>Que avanços sociais o texto cita?\u003c/li>\u003cli>Que dificuldades persistentes o texto aponta?\u003c/li>\u003cli>Faça um quadro com três colunas (política, social, econômica) e dois itens em cada uma, com base no texto.\u003c/li>\u003cli>Use 'efetivação de direitos' e 'desigualdade' para explicar por que democracia política e desigualdade podem coexistir.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas com tese, evidência e ressalva: a democracia brasileira 'deu certo'?\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Jornal Opção: TSE aprova o calendário eleitoral de 2026 (03/03/2026)","u":"https://www.jornalopcao.com.br/ultimas-noticias/eleicoes-tse-aprova-calendario-eleitoral-oficial-de-2026-799720/","n":""},{"t":"OpenStax — Introduction to Sociology 3e, 2.2 Research Methods","u":"https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods","n":"Manual universitário: desenho de pesquisa e limites da evidência."},{"t":"IBGE — Desigualdades sociais por cor ou raça no Brasil, 2ª edição, 2022","u":"https://www.ibge.gov.br/estatisticas/sociais/populacao/25844-desigualdades-sociais-por-cor-ou-raca.html?edicao=35440&t=resultados","n":"Fonte estatística: consultar indicador, ano e população analisada."},{"t":"Fundação Biblioteca Nacional — Hemeroteca Digital Brasileira","u":"https://bndigital.bn.gov.br/hemeroteca-digital/","n":"Acervo de jornais e revistas para pesquisa, não uma reportagem específica já localizada. Na consulta de 04/10/2026, a página avisava indisponibilidade e indicava o Acervo Digital como alternativa. Registre título, edição, data e página ao selecionar uma matéria."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Participação social e permanências das desigualdades.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Leitura e atividade\u003c/h4>\u003cp>Uso seletivo das p. 390-394. O foco é perceber como democracia institucional, cidadania e desigualdade convivem no Brasil pós-1988.\u003c/p>\u003cp class=\"atividade-aluno\">Produz uma síntese distinguindo direitos formalmente reconhecidos e acesso concreto aos direitos.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS602; EM13CHS606\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS605C / GO-EMCH605D\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">Nova República\u003c/span>\u003cspan class=\"concept-chip\">participação social\u003c/span>\u003cspan class=\"concept-chip\">desigualdades\u003c/span>\u003cspan class=\"concept-chip\">democracia\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-building\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M4 21V5h16v16M2 21h20M8 9h2m4 0h2M8 13h2m4 0h2M10 21v-5h4v5\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-ballot\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003crect height=\"10\" rx=\"1.5\" width=\"18\" x=\"3\" y=\"11\">\u003c/rect>\u003cpath d=\"M8 15h8M7 4l7-2 3 7-7 2zM11 6l2 1\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Nova República\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Nova República\u003c/strong> — \u003cspan>Designação do período iniciado com o fim do regime militar e a retomada de governos civis no Brasil.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>participação social\u003c/strong> — \u003cspan>Atuação de pessoas e grupos em decisões, organizações, debates e ações de interesse coletivo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>desigualdades\u003c/strong> — \u003cspan>Diferenças sociais que se tornam hierárquicas quando produzem acesso desigual a recursos, direitos e oportunidades.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>democracia\u003c/strong> — \u003cspan>Forma de organização política baseada em participação, direitos, pluralismo, representação e regras de disputa pelo poder.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-people\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"8\" cy=\"7\" r=\"3\">\u003c/circle>\u003ccircle cx=\"17\" cy=\"8\" r=\"2.5\">\u003c/circle>\u003cpath d=\"M2 21v-3a6 6 0 0 1 12 0v3H2zm12-8a5 5 0 0 1 8 4v4h-5\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> A Nova República combina democracia política e permanência de desigualdades, e a avaliação exige separar dimensões e períodos.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Quais desafios políticos e econômicos marcaram os primeiros anos da Nova República?\u003c/li>\u003cli>Como inflação, eleições e reorganização partidária influenciaram a vida política brasileira?\u003c/li>\u003cli>Por que a consolidação democrática envolve instituições, conflitos e participação social?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s3-historia-semana-3-glossary-title\">\u003ch4 id=\"s3-historia-semana-3-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Nova República\u003c/dt>\u003cdd>\u003cp>Periodização da história política brasileira a partir da transição de 1985. Não significa um governo único ou ausência de mudanças internas.\u003c/p>\u003c/dd>\u003cdt>Democracia e qualidade institucional\u003c/dt>\u003cdd>\u003cp>Análise de participação, garantias, controle e funcionamento das instituições. Não se reduz à existência periódica de eleições.\u003c/p>\u003c/dd>\u003cdt>Série histórica e causalidade\u003c/dt>\u003cdd>\u003cp>Uma sequência de indicadores mostra variação no tempo; explicar a variação exige investigar políticas, condições e outros fatores.\u003c/p>\u003c/dd>\u003cdt>participação social\u003c/dt>\u003cdd>\u003cp>Atuação de pessoas e grupos em decisões, organizações, debates e ações de interesse coletivo.\u003c/p>\u003c/dd>\u003cdt>desigualdades\u003c/dt>\u003cdd>\u003cp>Diferenças sociais que se tornam hierárquicas quando produzem acesso desigual a recursos, direitos e oportunidades.\u003c/p>\u003c/dd>\u003cdt>democracia\u003c/dt>\u003cdd>\u003cp>Forma de organização política baseada em participação, direitos, pluralismo, representação e regras de disputa pelo poder.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">3ª série · História · Semana 3\u003c/div>\u003ch4>NOVA REPÚBLICA\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>A Nova República combina estabilidade constitucional com crises econômicas, reformas institucionais, ampliação de políticas sociais e persistência de desigualdades. O período não deve ser explicado como trajetória uniforme. Mudaram governos, coalizões, políticas econômicas e formas de participação.\u003c/p>\u003cp>A análise histórica pode articular democratização política e desigualdade social: eleições regulares e direitos formais coexistem com desigualdades de renda, raça, gênero, território e acesso a serviços. Dados do IBGE documentam padrões; a interpretação precisa reconstruir processos históricos e políticas.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s3-historia-semana-3-study-heading\">\u003ch4 id=\"s3-historia-semana-3-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Defina o recorte antes de comparar governos e indicadores. Diferencie avaliação do regime, de uma política e de um resultado social; as três perguntas precisam de critérios próprios.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Não atribua toda variação econômica a um governante nem generalize uma experiência individual para uma década inteira.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Um gráfico fictício mostra melhora de um indicador enquanto outro permanece estável.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>Explicite medidas, população e período. A coexistência dos resultados impede uma narrativa de melhora ou piora total.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods\" target=\"_blank\" rel=\"noopener\">OpenStax — Introduction to Sociology 3e, 2.2 Research Methods\u003c/a>\u003cp>Manual universitário: desenho de pesquisa e limites da evidência.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.ibge.gov.br/estatisticas/sociais/populacao/25844-desigualdades-sociais-por-cor-ou-raca.html?edicao=35440&amp;t=resultados\" target=\"_blank\" rel=\"noopener\">IBGE — Desigualdades sociais por cor ou raça no Brasil, 2ª edição, 2022\u003c/a>\u003cp>Fonte estatística: consultar indicador, ano e população analisada.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Conselhos, conferências e outros canais participativos ganharam espaço em diferentes políticas públicas após 1988, mostrando formas de participação além das eleições.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Compare democracia representativa e participativa como mecanismos complementares possíveis, sem recomendar posições políticas.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Um gráfico prova que um governo causou uma mudança social?\u003c/h5>\u003cp>O gráfico mostra uma relação temporal; causalidade requer examinar mecanismos, políticas, contexto e explicações concorrentes.\u003c/p>\u003cp>Limite da resposta: Não atribua toda variação econômica a um governante nem generalize uma experiência individual para uma década inteira.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Nova República\u003c/dt>\u003cdd>Periodização da história política brasileira a partir da transição de 1985. Não significa um governo único ou ausência de mudanças internas.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Democracia e qualidade institucional\u003c/dt>\u003cdd>Análise de participação, garantias, controle e funcionamento das instituições. Não se reduz à existência periódica de eleições.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Série histórica e causalidade\u003c/dt>\u003cdd>Uma sequência de indicadores mostra variação no tempo; explicar a variação exige investigar políticas, condições e outros fatores.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Um gráfico prova que um governo causou uma mudança social?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Quem produziu a fonte, quando e para qual público? O que sua posição permite observar?\u003c/li>\u003cli>Como imagem, palavras, seleção e silêncios constroem a narrativa?\u003c/li>\u003cli>Que afirmação pode ser sustentada? Qual informação exige outra fonte independente?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Nova República e instituições democráticas\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-014\">\u003ch5>Enem — aplicação regular · 2016\u003c/h5>\u003cp class=\"ux-exam-theme\">Nova República: continuidades e rupturas na transição democrática\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 4 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Situar a Nova República e comparar democracia, direitos sociais e desenvolvimento; o indicador econômico não explica sozinho as condições de vida.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/dcb0d85d-5da4-48ee-b49a-e34db65c9c8b/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-020\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Amartya Sen: desenvolvimento e ampliação das liberdades\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 81 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Situar a Nova República e comparar democracia, direitos sociais e desenvolvimento; o indicador econômico não explica sozinho as condições de vida.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-026\">\u003ch5>Enem — aplicação regular · 2019\u003c/h5>\u003cp class=\"ux-exam-theme\">SUS, Constituição de 1988 e características das políticas públicas\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 88 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Situar a Nova República e comparar democracia, direitos sociais e desenvolvimento; o indicador econômico não explica sozinho as condições de vida.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/ef59158b-11f9-4bf7-a9fc-64d801cd06e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-006\">\u003ch5>Enem — aplicação regular · 2021\u003c/h5>\u003cp class=\"ux-exam-theme\">Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>A garantia de acesso à cidadania permite examinar efetivação de direitos na Nova República. A redação não pede uma cronologia dos governos.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/0ec029ac-140b-424a-9c62-f96095c25d3c/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Selecione um indicador social com período e metodologia. Confronte seu comportamento com marcos da Nova República sem concluir causalidade apenas pela coincidência temporal.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods\" target=\"_blank\" rel=\"noopener\">OpenStax — Introduction to Sociology 3e, 2.2 Research Methods\u003c/a>\u003cp>Leitura prioritária para a explicação: Nova República; Democracia e qualidade institucional; Série histórica e causalidade.\u003c/p>\u003cp>Manual universitário: desenho de pesquisa e limites da evidência.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.ibge.gov.br/estatisticas/sociais/populacao/25844-desigualdades-sociais-por-cor-ou-raca.html?edicao=35440&amp;t=resultados\" target=\"_blank\" rel=\"noopener\">IBGE — Desigualdades sociais por cor ou raça no Brasil, 2ª edição, 2022\u003c/a>\u003cp>Leitura complementar: Nova República; Democracia e qualidade institucional; Série histórica e causalidade.\u003c/p>\u003cp>Fonte estatística: consultar indicador, ano e população analisada.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://bndigital.bn.gov.br/hemeroteca-digital/\" target=\"_blank\" rel=\"noopener\">Fundação Biblioteca Nacional — Hemeroteca Digital Brasileira\u003c/a>\u003cp>Selecione duas edições relativas a um mesmo marco da Nova República. Compare vocabulário e fontes antes de explicar mudanças de opinião.\u003c/p>\u003cp>Acervo de jornais e revistas para pesquisa, não uma reportagem específica já localizada. Na consulta de 04/10/2026, a página avisava indisponibilidade e indicava o Acervo Digital como alternativa. Registre título, edição, data e página ao selecionar uma matéria.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Definir Nova República como período e marcar mudanças de conjuntura.\u003c/li>\u003cli>Trabalhar participação institucional e social.\u003c/li>\u003cli>Ler indicadores de desigualdade e discutir permanências.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não avaliar a Nova República como 'sucesso' ou 'fracasso' global; decomponha dimensões e períodos.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Democracia política | participação social | políticas públicas | desigualdades persistentes. Use linhas paralelas, não uma seta de progresso.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: eleições diretas regulares, liberdade de imprensa, partidos e sindicatos livres, Ministério Público. Q2: SUS e ampliação do acesso à escola. Q3: crises, inflação, desigualdades de renda, raça e território, dificuldade de efetivar direitos. Q4: quadro coerente. Q5: democracia política garante voto e liberdades, mas não elimina sozinha desigualdades históricas. Q6: tese clara, evidência do texto e ressalva; evita 'deu certo' ou 'fracassou' sem separar dimensões.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Movimentos sociais e ampliação de direitos\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-056\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Participação indígena na Constituição de 1988 e após a redemocratização\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · História discursiva, questão 3, itens A/B · Humanas, 2º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Investigar participação política e conquistas de direitos, observando diferenças de raça, gênero e posição social.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003c/details>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-019\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Participação feminina e sub-representação política\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 57 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Investigar participação política e conquistas de direitos, observando diferenças de raça, gênero e posição social.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-038\">\u003ch5>Vestibular USP · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Kimberlé Crenshaw: interseccionalidade aplicada ao mercado de trabalho\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: FUVEST · 1ª fase, questão 1 · V\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Investigar participação política e conquistas de direitos, observando diferenças de raça, gênero e posição social.\u003c/p>\u003cp>Cobrança nominal da autora e aplicação do conceito a dados do Dieese.\u003c/p>\u003c/details>\u003ca href=\"https://www.fuvest.br/wp-content/uploads/fuvest2023_primeira_fase_prova_V.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-008\">\u003ch5>Enem — aplicação regular · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para o enfrentamento da invisibilidade do trabalho de cuidado realizado pela mulher no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>A invisibilidade do cuidado conecta gênero, reivindicação e reconhecimento. A história dos movimentos ajuda a argumentar, mas não é um conteúdo nominal da proposta.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/6f6e6a08-9f0b-4365-9f52-a24c5e4ab2e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-009\">\u003ch5>Enem — aplicação regular · 2024\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a valorização da herança africana no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>A valorização da herança africana permite discutir mobilização negra e disputas de memória. O tema da redação não demonstra por si a história de um movimento específico.\u003c/p>\u003c/details>\u003ca href=\"https://download.inep.gov.br/enem/provas_e_gabaritos/2024_PV_impresso_D1_CD2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s3-historia-semana-4","title":"MOVIMENTOS SOCIAIS E CIDADANIA","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-people\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"8\" cy=\"7\" r=\"3\">\u003c/circle>\u003ccircle cx=\"17\" cy=\"8\" r=\"2.5\">\u003c/circle>\u003cpath d=\"M2 21v-3a6 6 0 0 1 12 0v3H2zm12-8a5 5 0 0 1 8 4v4h-5\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-megaphone\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M3 10h5l11-6v16L8 14H3zM7 14l2 7h4l-3-6M21 9l2-1M21 14l2 1\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Movimentos sociais e cidadania\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>movimentos sociais\u003c/strong> — \u003cspan>Ações coletivas organizadas que buscam defender interesses, identidades, direitos ou mudanças sociais.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>raça\u003c/strong> — \u003cspan>Categoria social e histórica usada para classificar pessoas e produzir relações de poder; não corresponde a essências biológicas humanas.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>gênero\u003c/strong> — \u003cspan>Conjunto de relações, normas e identidades socialmente construídas em torno das diferenças sexuais e das formas de viver masculinidades, feminilidades e outras identidades.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>trabalho\u003c/strong> — \u003cspan>Atividade humana de produção, transformação e organização da vida social.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-scroll\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M7 4h13v15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1zm0 0v14a2 2 0 0 1-4 0M10 8h7M10 12h7M10 16h4\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> Movimentos sociais deram forma a reivindicações coletivas e influenciaram a ampliação de direitos na redemocratização.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 394–397\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Como movimentos sociais contribuíram para ampliar a agenda de direitos no Brasil contemporâneo?\u003c/li>\u003cli>Que relações existem entre organização coletiva, reconhecimento e políticas públicas?\u003c/li>\u003cli>Por que diferentes movimentos podem disputar prioridades dentro de uma democracia?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Organização, identidade e reivindicação\u003c/dt>\u003cdd>Organização sustenta ação; identidade pode articular pertencimento; reivindicação expressa uma demanda. Sua relação precisa ser reconstruída, não presumida.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Repertório e conquista\u003c/dt>\u003cdd>Repertório são formas de ação; conquista é um resultado atribuído a uma luta. A ligação entre os dois pede documentos, decisões e análise.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Conflitos internos\u003c/dt>\u003cdd>Divergências entre participantes não anulam um movimento; podem revelar projetos e condições diferentes.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Um movimento fala por todas as pessoas de uma categoria?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Movimentos sociais e cidadania\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Durante a redemocratização, movimentos sociais deram forma a reivindicações coletivas. O movimento sindical do ABC paulista, no fim dos anos 1970, organizou greves por salários e direitos. O movimento negro denunciou o racismo e o mito da 'democracia racial' e lutou pela criminalização do racismo. Mulheres, reunidas em torno do Conselho Nacional dos Direitos da Mulher, entregaram à Constituinte, em março de 1987, a Carta das Mulheres Brasileiras aos Constituintes. Povos indígenas, com lideranças como Ailton Krenak, defenderam seus direitos sobre territórios. Movimentos por moradia, saúde e educação pressionaram por políticas públicas. Muitas dessas demandas entraram na Constituição de 1988, mas as disputas continuam.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Que movimentos o texto cita e o que cada um defendeu?\u003c/li>\u003cli>Quando e a quem as mulheres entregaram a Carta, segundo o texto?\u003c/li>\u003cli>Que demandas entraram na Constituição de 1988?\u003c/li>\u003cli>Analise um documento de movimento social indicado pela professora, respondendo: quem escreve, para quem, o que pede e com que efeito.\u003c/li>\u003cli>Use 'participação' e 'Direitos Humanos' para explicar o papel dos movimentos na ampliação de direitos.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas comparando dois movimentos citados: uma diferença e um ponto em comum.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Câmara dos Deputados: entrega da Carta das Mulheres à Constituinte (26/03/1987)","u":"https://www2.camara.leg.br/atividade-legislativa/plenario/discursos/escrevendohistoria/destaque-de-materias/mulher-constituinte","n":""},{"t":"Câmara dos Deputados: a Constituinte e as mulheres (inclui a Carta das Mulheres Brasileiras aos Constituintes)","u":"https://www2.camara.leg.br/atividade-legislativa/legislacao/Constituicoes_Brasileiras/constituicao-cidada/a-constituinte-e-as-mulheres","n":""},{"t":"OpenStax — Introduction to Sociology 3e, 21.2 Social Movements","u":"https://openstax.org/books/introduction-sociology-3e/pages/21-2-social-movements","n":"Manual universitário: mobilização, recursos e enquadramentos."},{"t":"OpenStax — Introduction to Sociology 3e, 2.2 Research Methods","u":"https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods","n":"Manual universitário: desenho de pesquisa e limites da evidência."},{"t":"Eduardo Coutinho — Cabra marcado para morrer (1984), Instituto Moreira Salles","u":"https://ims.com.br/filme/cabra-marcado-para-morrer/","n":"Filme: apresentação e ficha no IMS. O link identifica a obra; não é promessa de streaming nem de sessão vigente."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Raça, gênero, trabalho e direitos.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Com o livro\u003c/h4>\u003cp>Uso das p. 394-397, com destaque para “Movimentos sociais e democracia”. A aula relaciona participação social, Direitos Humanos e combate às desigualdades.\u003c/p>\u003cp class=\"atividade-aluno\">Escolhe um movimento e identifica sujeito histórico, reivindicação, direito envolvido e forma de mobilização.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS501; EM13CHS601; EM13CHS605\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS605C\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">movimentos sociais\u003c/span>\u003cspan class=\"concept-chip\">raça\u003c/span>\u003cspan class=\"concept-chip\">gênero\u003c/span>\u003cspan class=\"concept-chip\">trabalho\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-people\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"8\" cy=\"7\" r=\"3\">\u003c/circle>\u003ccircle cx=\"17\" cy=\"8\" r=\"2.5\">\u003c/circle>\u003cpath d=\"M2 21v-3a6 6 0 0 1 12 0v3H2zm12-8a5 5 0 0 1 8 4v4h-5\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-megaphone\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M3 10h5l11-6v16L8 14H3zM7 14l2 7h4l-3-6M21 9l2-1M21 14l2 1\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Movimentos sociais e cidadania\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>movimentos sociais\u003c/strong> — \u003cspan>Ações coletivas organizadas que buscam defender interesses, identidades, direitos ou mudanças sociais.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>raça\u003c/strong> — \u003cspan>Categoria social e histórica usada para classificar pessoas e produzir relações de poder; não corresponde a essências biológicas humanas.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>gênero\u003c/strong> — \u003cspan>Conjunto de relações, normas e identidades socialmente construídas em torno das diferenças sexuais e das formas de viver masculinidades, feminilidades e outras identidades.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>trabalho\u003c/strong> — \u003cspan>Atividade humana de produção, transformação e organização da vida social.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-scroll\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M7 4h13v15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1zm0 0v14a2 2 0 0 1-4 0M10 8h7M10 12h7M10 16h4\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> Movimentos sociais deram forma a reivindicações coletivas e influenciaram a ampliação de direitos na redemocratização.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 394–397\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Como movimentos sociais contribuíram para ampliar a agenda de direitos no Brasil contemporâneo?\u003c/li>\u003cli>Que relações existem entre organização coletiva, reconhecimento e políticas públicas?\u003c/li>\u003cli>Por que diferentes movimentos podem disputar prioridades dentro de uma democracia?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s3-historia-semana-4-glossary-title\">\u003ch4 id=\"s3-historia-semana-4-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Organização, identidade e reivindicação\u003c/dt>\u003cdd>\u003cp>Organização sustenta ação; identidade pode articular pertencimento; reivindicação expressa uma demanda. Sua relação precisa ser reconstruída, não presumida.\u003c/p>\u003c/dd>\u003cdt>Repertório e conquista\u003c/dt>\u003cdd>\u003cp>Repertório são formas de ação; conquista é um resultado atribuído a uma luta. A ligação entre os dois pede documentos, decisões e análise.\u003c/p>\u003c/dd>\u003cdt>Conflitos internos\u003c/dt>\u003cdd>\u003cp>Divergências entre participantes não anulam um movimento; podem revelar projetos e condições diferentes.\u003c/p>\u003c/dd>\u003cdt>movimentos sociais\u003c/dt>\u003cdd>\u003cp>Ações coletivas organizadas que buscam defender interesses, identidades, direitos ou mudanças sociais.\u003c/p>\u003c/dd>\u003cdt>raça\u003c/dt>\u003cdd>\u003cp>Categoria social e histórica usada para classificar pessoas e produzir relações de poder; não corresponde a essências biológicas humanas.\u003c/p>\u003c/dd>\u003cdt>gênero\u003c/dt>\u003cdd>\u003cp>Conjunto de relações, normas e identidades socialmente construídas em torno das diferenças sexuais e das formas de viver masculinidades, feminilidades e outras identidades.\u003c/p>\u003c/dd>\u003cdt>trabalho\u003c/dt>\u003cdd>\u003cp>Atividade humana de produção, transformação e organização da vida social.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">3ª série · História · Semana 4\u003c/div>\u003ch4>MOVIMENTOS SOCIAIS E CIDADANIA\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Movimentos sociais contemporâneos formulam identidades, diagnósticos e reivindicações; sua atuação inclui protestos, litigância, produção cultural, associações, sindicatos e participação institucional. Movimento negro, feminismos, movimentos de trabalhadores, movimentos por moradia e organizações indígenas possuem histórias e agendas plurais.\u003c/p>\u003cp>A perspectiva afro-latino-americana de Lélia Gonzalez e a ideia de interseccionalidade ajudam a analisar como raça, gênero e classe se articulam sem reduzir sujeitos a uma única identidade. No Brasil, movimentos também dialogam com redes latino-americanas e transnacionais.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s3-historia-semana-4-study-heading\">\u003ch4 id=\"s3-historia-semana-4-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Escolha uma mobilização documentada e identifique quem fala em nome de quem, suas demandas e interlocutores. Para raça, gênero e trabalho, não suponha que todas as organizações defendam o mesmo projeto.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Não confunda reconhecimento posterior com unanimidade no momento da luta. Fontes oficiais, militantes e jornalísticas têm posições e finalidades distintas.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Um coletivo fictício diverge sobre negociar uma demanda parcial ou manter uma reivindicação mais ampla.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>Reconstrua as razões de cada estratégia sem converter divergência em falta de consciência.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://openstax.org/books/introduction-sociology-3e/pages/21-2-social-movements\" target=\"_blank\" rel=\"noopener\">OpenStax — Introduction to Sociology 3e, 21.2 Social Movements\u003c/a>\u003cp>Manual universitário: mobilização, recursos e enquadramentos.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods\" target=\"_blank\" rel=\"noopener\">OpenStax — Introduction to Sociology 3e, 2.2 Research Methods\u003c/a>\u003cp>Manual universitário: desenho de pesquisa e limites da evidência.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Lélia Gonzalez usou 'amefricanidade' para deslocar o olhar do Brasil para histórias compartilhadas de populações negras e indígenas nas Américas.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Analise formas de organização coletiva conhecidas publicamente, sem pedir declaração de preferência política.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Um movimento fala por todas as pessoas de uma categoria?\u003c/h5>\u003cp>Movimentos constroem representações e reivindicações, mas contêm diferenças internas e não representam automaticamente todos os membros de um grupo.\u003c/p>\u003cp>Limite da resposta: Não confunda reconhecimento posterior com unanimidade no momento da luta. Fontes oficiais, militantes e jornalísticas têm posições e finalidades distintas.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Organização, identidade e reivindicação\u003c/dt>\u003cdd>Organização sustenta ação; identidade pode articular pertencimento; reivindicação expressa uma demanda. Sua relação precisa ser reconstruída, não presumida.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Repertório e conquista\u003c/dt>\u003cdd>Repertório são formas de ação; conquista é um resultado atribuído a uma luta. A ligação entre os dois pede documentos, decisões e análise.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Conflitos internos\u003c/dt>\u003cdd>Divergências entre participantes não anulam um movimento; podem revelar projetos e condições diferentes.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Um movimento fala por todas as pessoas de uma categoria?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Quem produziu a fonte, quando e para qual público? O que sua posição permite observar?\u003c/li>\u003cli>Como imagem, palavras, seleção e silêncios constroem a narrativa?\u003c/li>\u003cli>Que afirmação pode ser sustentada? Qual informação exige outra fonte independente?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Movimentos sociais e ampliação de direitos\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-056\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Participação indígena na Constituição de 1988 e após a redemocratização\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · História discursiva, questão 3, itens A/B · Humanas, 2º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Investigar participação política e conquistas de direitos, observando diferenças de raça, gênero e posição social.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003c/details>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-019\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Participação feminina e sub-representação política\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 57 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Investigar participação política e conquistas de direitos, observando diferenças de raça, gênero e posição social.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-038\">\u003ch5>Vestibular USP · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Kimberlé Crenshaw: interseccionalidade aplicada ao mercado de trabalho\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: FUVEST · 1ª fase, questão 1 · V\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Investigar participação política e conquistas de direitos, observando diferenças de raça, gênero e posição social.\u003c/p>\u003cp>Cobrança nominal da autora e aplicação do conceito a dados do Dieese.\u003c/p>\u003c/details>\u003ca href=\"https://www.fuvest.br/wp-content/uploads/fuvest2023_primeira_fase_prova_V.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-008\">\u003ch5>Enem — aplicação regular · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para o enfrentamento da invisibilidade do trabalho de cuidado realizado pela mulher no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>A invisibilidade do cuidado conecta gênero, reivindicação e reconhecimento. A história dos movimentos ajuda a argumentar, mas não é um conteúdo nominal da proposta.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/6f6e6a08-9f0b-4365-9f52-a24c5e4ab2e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-009\">\u003ch5>Enem — aplicação regular · 2024\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a valorização da herança africana no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>A valorização da herança africana permite discutir mobilização negra e disputas de memória. O tema da redação não demonstra por si a história de um movimento específico.\u003c/p>\u003c/details>\u003ca href=\"https://download.inep.gov.br/enem/provas_e_gabaritos/2024_PV_impresso_D1_CD2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Compare repertórios de movimentos negros, indígenas e de mulheres. Investigue uma conquista com agentes e documentos; evite apresentar movimentos como grupos internamente uniformes.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://openstax.org/books/introduction-sociology-3e/pages/21-2-social-movements\" target=\"_blank\" rel=\"noopener\">OpenStax — Introduction to Sociology 3e, 21.2 Social Movements\u003c/a>\u003cp>Leitura prioritária para a explicação: Organização, identidade e reivindicação; Repertório e conquista; Conflitos internos.\u003c/p>\u003cp>Manual universitário: mobilização, recursos e enquadramentos.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods\" target=\"_blank\" rel=\"noopener\">OpenStax — Introduction to Sociology 3e, 2.2 Research Methods\u003c/a>\u003cp>Leitura complementar: Organização, identidade e reivindicação; Repertório e conquista; Conflitos internos.\u003c/p>\u003cp>Manual universitário: desenho de pesquisa e limites da evidência.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://ims.com.br/filme/cabra-marcado-para-morrer/\" target=\"_blank\" rel=\"noopener\">Eduardo Coutinho — Cabra marcado para morrer (1984), Instituto Moreira Salles\u003c/a>\u003cp>Estude a construção de memória e a organização camponesa como caso de movimento social, com contexto próprio e limites de comparação.\u003c/p>\u003cp>Filme: apresentação e ficha no IMS. O link identifica a obra; não é promessa de streaming nem de sessão vigente.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Definir movimento social e repertórios de ação.\u003c/li>\u003cli>Comparar movimento negro, feminismos e trabalho.\u003c/li>\u003cli>Introduzir interseccionalidade e conexões latino-americanas.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não tratar movimentos sociais como blocos homogêneos nem atribuir uma única motivação a todos os participantes.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Sujeitos coletivos -&gt; diagnóstico -&gt; repertórios -&gt; direitos. Camada transversal: raça/gênero/classe e conexões amefricanas.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: sindical (salários e direitos), negro (contra o racismo), mulheres (direitos), indígenas (territórios), moradia/saúde/educação (políticas públicas). Q2: março de 1987, à Assembleia Constituinte. Q3: muitas demandas, como o racismo definido como crime e direitos de indígenas. Q4: análise com autor, destinatário, pedido e efeito. Q5: pressão e participação transformam demandas em direitos. Q6: comparação com diferença e ponto em comum; mostra diversidade, sem 'povo' homogêneo.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Globalização e neoliberalismo\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-040\">\u003ch5>Vestibular USP · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Relações de trabalho e uso ideológico do termo colaborador\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: FUVEST · 1ª fase, questão 5 · V\u003c/p>\u
