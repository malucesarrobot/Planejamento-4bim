>\u003cp class=\"ux-board-question\">Ter liberdade de expressão basta para que todas as pessoas possam participar da sociedade?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Direitos civis, políticos e sociais\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-006\">\u003ch5>Enem — aplicação regular · 2021\u003c/h5>\u003cp class=\"ux-exam-theme\">Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/0ec029ac-140b-424a-9c62-f96095c25d3c/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-002\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a formação educacional de surdos no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Estude Direitos civis, políticos e sociais para explicar as diferenças conceituais e conduzir a análise de situações. A leitura serve de apoio à habilidade GO-EMCHS606A da matriz de 2026 fornecida pela professora.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Leitura prioritária: Direitos civis, políticos e sociais. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\u003cp>25 min para leitura e registro; 35 min para as questões; 20 min para organizador e parágrafo; 10 min para revisão. Ajuste à turma.\u003c/p>\u003ch5>Respostas e critérios\u003c/h5>\u003col>\u003cli>Civis: liberdades e garantias; políticos: participação pública; sociais: condições de vida e participação. Aceitar exemplos pertinentes, justificados.\u003c/li>\u003cli>Direitos são interdependentes: barreiras à educação também podem limitar acesso à informação, trabalho e participação.\u003c/li>\u003cli>Educação e acesso em condições de igualdade; a análise pode incluir autonomia e participação. O caso não basta para determinar responsabilidade jurídica.\u003c/li>\u003cli>O organizador deve explicitar relações coerentes entre os conceitos e o caso.\u003c/li>\u003cli>As frases devem aplicar os conceitos sem confundi-los.\u003c/li>\u003cli>Avalie tese, razões, conceitos e objeção; não a concordância com a opinião da professora.\u003c/li>\u003c/ol>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">DUDH: universalidade, igualdade e diversidade\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-001\">\u003ch5>Enem — aplicação regular · 2016\u003c/h5>\u003cp class=\"ux-exam-theme\">Caminhos para combater a intolerância religiosa no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 2º dia, caderno 5\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/b2b444d8-dd24-4e19-89b6-7c629e4c40ff/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-007\">\u003ch5>Enem — aplicação regular · 2022\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a valorização de comunidades e povos tradicionais no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/7d656252-c499-42dc-93c9-ea825cce7a0e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s1-filosofia-semana-2","title":"DUDH: universalidade, igualdade e diversidade","quadro":"\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">DUDH: universalidade, igualdade e diversidade\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Universalidade\u003c/strong>\u003cspan>Os direitos humanos dizem respeito a todas as pessoas, sem depender de pertencimento a uma maioria.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Igualdade em dignidade e direitos\u003c/strong>\u003cspan>Exige reconhecer igual valor às pessoas; não afirma que elas tenham histórias, necessidades ou condições idênticas.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Não discriminação\u003c/strong>\u003cspan>Impede excluir ou inferiorizar pessoas em razão de características como origem, cor, religião ou outras condições.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Liberdade de consciência\u003c/strong>\u003cspan>Possibilidade de formar convicções e exercer crenças; relaciona-se ao respeito às convicções diferentes das próprias.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Mapa: direito universal → diferença concreta → barreira → medida de acesso.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que significa dizer que os direitos humanos são universais?\u003c/li>\u003cli>Qual é a diferença entre respeitar uma pessoa e concordar com suas opiniões?\u003c/li>\u003cli>Uma escola oferece o mesmo aviso a todos, mas apenas em áudio. Como analisar esse caso em relação à participação de estudantes surdos?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Universalidade\u003c/dt>\u003cdd>Os direitos humanos dizem respeito a todas as pessoas, sem depender de pertencimento a uma maioria.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Igualdade em dignidade e direitos\u003c/dt>\u003cdd>Exige reconhecer igual valor às pessoas; não afirma que elas tenham histórias, necessidades ou condições idênticas.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Não discriminação\u003c/dt>\u003cdd>Impede excluir ou inferiorizar pessoas em razão de características como origem, cor, religião ou outras condições.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Um direito deixa de valer quando a pessoa pertence a uma minoria ou pensa diferente da maioria?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">DUDH: universalidade, igualdade e diversidade\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">A Declaração Universal dos Direitos Humanos foi proclamada em 1948. Ela afirma a dignidade e os direitos de todas as pessoas e enfrenta a ideia de que alguém pode ser excluído por sua origem, cor, religião ou condição. Universalidade significa que os direitos não pertencem apenas à maioria. Igualdade de direitos também não significa que as pessoas sejam idênticas: condições de acesso podem exigir atenção a necessidades diferentes. Respeitar a liberdade de consciência de alguém não obriga a concordar com suas crenças. A análise de uma situação deve identificar o direito, a possível barreira e as razões para uma medida que proteja a participação de todos.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>O que significa dizer que os direitos humanos são universais?\u003c/li>\u003cli>Qual é a diferença entre respeitar uma pessoa e concordar com suas opiniões?\u003c/li>\u003cli>Uma escola oferece o mesmo aviso a todos, mas apenas em áudio. Como analisar esse caso em relação à participação de estudantes surdos?\u003c/li>\u003cli>Faça o organizador sugerido: Mapa: direito universal → diferença concreta → barreira → medida de acesso.\u003c/li>\u003cli>Escolha dois conceitos e use cada um em uma frase que explique o caso da aula.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas respondendo à questão-problema. Use conceitos e uma razão; considere uma objeção.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"ONU/UNICEF — Declaração Universal dos Direitos Humanos","u":"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos","n":"Texto em português; selecione artigos conforme o objetivo da semana."},{"t":"Jorge Furtado — Ilha das Flores (1989), Casa de Cinema de Porto Alegre","u":"https://arquivo.casacinepoa.com.br/site_antigo/port/filmes/ilhadasf.htm","n":"Filme e roteiro: página da produtora com ficha e textos. Acesso ao filme pode depender de plataforma; a página não garante exibição integral gratuita."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>DUDH: universalidade, igualdade e diversidade; Universalidade; Igualdade em dignidade e direitos; Não discriminação; Liberdade de consciência.\u003c/p>\u003c/section>\u003csection class=\"wide\">\u003ch4>Leitura e atividade\u003c/h4>\u003cp>Mapa: direito universal → diferença concreta → barreira → medida de acesso.\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS605\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — direitos civis, políticos e sociais; dignidade em Kant; reconhecimento em Axel Honneth. Matriz 2026, 4º bimestre: recorte fornecido pela professora.\u003c/p>\u003c/section>\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">Universalidade\u003c/span>\u003cspan class=\"concept-chip\">Igualdade em dignidade e direitos\u003c/span>\u003cspan class=\"concept-chip\">Não discriminação\u003c/span>\u003cspan class=\"concept-chip\">Liberdade de consciência\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">DUDH: universalidade, igualdade e diversidade\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Universalidade\u003c/strong>\u003cspan>Os direitos humanos dizem respeito a todas as pessoas, sem depender de pertencimento a uma maioria.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Igualdade em dignidade e direitos\u003c/strong>\u003cspan>Exige reconhecer igual valor às pessoas; não afirma que elas tenham histórias, necessidades ou condições idênticas.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Não discriminação\u003c/strong>\u003cspan>Impede excluir ou inferiorizar pessoas em razão de características como origem, cor, religião ou outras condições.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Liberdade de consciência\u003c/strong>\u003cspan>Possibilidade de formar convicções e exercer crenças; relaciona-se ao respeito às convicções diferentes das próprias.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Mapa: direito universal → diferença concreta → barreira → medida de acesso.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que significa dizer que os direitos humanos são universais?\u003c/li>\u003cli>Qual é a diferença entre respeitar uma pessoa e concordar com suas opiniões?\u003c/li>\u003cli>Uma escola oferece o mesmo aviso a todos, mas apenas em áudio. Como analisar esse caso em relação à participação de estudantes surdos?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-2-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-2-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Universalidade\u003c/dt>\u003cdd>\u003cp>Os direitos humanos dizem respeito a todas as pessoas, sem depender de pertencimento a uma maioria.\u003c/p>\u003c/dd>\u003cdt>Igualdade em dignidade e direitos\u003c/dt>\u003cdd>\u003cp>Exige reconhecer igual valor às pessoas; não afirma que elas tenham histórias, necessidades ou condições idênticas.\u003c/p>\u003c/dd>\u003cdt>Não discriminação\u003c/dt>\u003cdd>\u003cp>Impede excluir ou inferiorizar pessoas em razão de características como origem, cor, religião ou outras condições.\u003c/p>\u003c/dd>\u003cdt>Liberdade de consciência\u003c/dt>\u003cdd>\u003cp>Possibilidade de formar convicções e exercer crenças; relaciona-se ao respeito às convicções diferentes das próprias.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 2\u003c/div>\u003ch4>DUDH: universalidade, igualdade e diversidade\u003c/h4>\u003c/div>\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>A DUDH, proclamada em 1948, oferece uma referência pública para discutir dignidade, liberdades, participação e condições de vida. Leia seu preâmbulo e artigos selecionados com contexto: é uma declaração histórica, não um inventário de todos os mecanismos nacionais para garantir cada direito.\u003c/p>\u003cp>Universalidade não significa apagar diferenças. Uma regra aparentemente igual pode produzir barreiras distintas. Trabalhe exemplos fictícios e pergunte quais direitos estão em jogo, que informação sustenta a interpretação e qual condição de acesso precisa mudar. Não confunda respeito a pessoas com concordância obrigatória com todas as opiniões.\u003c/p>\u003ch4>Roteiro de aplicação\u003c/h4>\u003cp>Comece pela questão-problema, explique os conceitos, leia a fonte indicada e analise um caso fictício. Feche com um registro e uma justificativa. Adapte o tempo e os recursos à turma.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-2-study-heading\">\u003ch4 id=\"s1-filosofia-semana-2-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>A DUDH, proclamada em 1948, oferece uma referência pública para discutir dignidade, liberdades, participação e condições de vida. Leia seu preâmbulo e artigos selecionados com contexto: é uma declaração histórica, não um inventário de todos os mecanismos nacionais para garantir cada direito.\u003c/p>\u003cp>Universalidade não significa apagar diferenças. Uma regra aparentemente igual pode produzir barreiras distintas. Trabalhe exemplos fictícios e pergunte quais direitos estão em jogo, que informação sustenta a interpretação e qual condição de acesso precisa mudar. Não confunda respeito a pessoas com concordância obrigatória com todas as opiniões.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>A DUDH orienta o debate, mas não substitui a análise de cada contexto ou a leitura das normas aplicáveis. Evite exigir relatos pessoais de discriminação; use exemplos fictícios e textos públicos.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Uma escola oferece o mesmo aviso a todos, mas apenas em áudio. Como analisar esse caso em relação à participação de estudantes surdos?\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>O caso é uma situação fictícia de aplicação dos conceitos, não um relato documentado. Os direitos se referem a todas as pessoas, sem depender de maioria, origem ou aprovação social. Respeito à dignidade e à liberdade de consciência não obriga adesão a uma opinião; ideias podem ser criticadas com razões. O procedimento é igual, mas pode criar uma barreira à informação; discutir formatos acessíveis, autonomia e participação, sem tratar surdez como incapacidade geral.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Um direito deixa de valer quando a pessoa pertence a uma minoria ou pensa diferente da maioria?\u003c/h5>\u003cp>A DUDH, proclamada em 1948, oferece uma referência pública para discutir dignidade, liberdades, participação e condições de vida. Leia seu preâmbulo e artigos selecionados com contexto: é uma declaração histórica, não um inventário de todos os mecanismos nacionais para garantir cada direito. Universalidade não significa apagar diferenças. Uma regra aparentemente igual pode produzir barreiras distintas. Trabalhe exemplos fictícios e pergunte quais direitos estão em jogo, que informação sustenta a interpretação e qual condição de acesso precisa mudar. Não confunda respeito a pessoas com concordância obrigatória com todas as opiniões.\u003c/p>\u003cp>Limite da resposta: A DUDH orienta o debate, mas não substitui a análise de cada contexto ou a leitura das normas aplicáveis. Evite exigir relatos pessoais de discriminação; use exemplos fictícios e textos públicos.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Universalidade\u003c/dt>\u003cdd>Os direitos humanos dizem respeito a todas as pessoas, sem depender de pertencimento a uma maioria.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Igualdade em dignidade e direitos\u003c/dt>\u003cdd>Exige reconhecer igual valor às pessoas; não afirma que elas tenham histórias, necessidades ou condições idênticas.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Não discriminação\u003c/dt>\u003cdd>Impede excluir ou inferiorizar pessoas em razão de características como origem, cor, religião ou outras condições.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Um direito deixa de valer quando a pessoa pertence a uma minoria ou pensa diferente da maioria?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">DUDH: universalidade, igualdade e diversidade\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-001\">\u003ch5>Enem — aplicação regular · 2016\u003c/h5>\u003cp class=\"ux-exam-theme\">Caminhos para combater a intolerância religiosa no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 2º dia, caderno 5\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/b2b444d8-dd24-4e19-89b6-7c629e4c40ff/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-007\">\u003ch5>Enem — aplicação regular · 2022\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a valorização de comunidades e povos tradicionais no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/7d656252-c499-42dc-93c9-ea825cce7a0e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Estude DUDH: universalidade, igualdade e diversidade para explicar as diferenças conceituais e conduzir a análise de situações. A leitura serve de apoio à habilidade GO-EMCHS606A da matriz de 2026 fornecida pela professora.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Leitura prioritária: DUDH: universalidade, igualdade e diversidade. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://arquivo.casacinepoa.com.br/site_antigo/port/filmes/ilhadasf.htm\" target=\"_blank\" rel=\"noopener\">Jorge Furtado — Ilha das Flores (1989), Casa de Cinema de Porto Alegre\u003c/a>\u003cp>Repertório opcional: analise como a montagem de Ilha das Flores evidencia barreiras ao acesso e à dignidade. O filme não substitui a DUDH nem funciona como relato estatístico do presente.\u003c/p>\u003cp>Filme e roteiro: página da produtora com ficha e textos. Acesso ao filme pode depender de plataforma; a página não garante exibição integral gratuita.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\u003cp>25 min para leitura e registro; 35 min para as questões; 20 min para organizador e parágrafo; 10 min para revisão. Ajuste à turma.\u003c/p>\u003ch5>Respostas e critérios\u003c/h5>\u003col>\u003cli>Os direitos se referem a todas as pessoas, sem depender de maioria, origem ou aprovação social.\u003c/li>\u003cli>Respeito à dignidade e à liberdade de consciência não obriga adesão a uma opinião; ideias podem ser criticadas com razões.\u003c/li>\u003cli>O procedimento é igual, mas pode criar uma barreira à informação; discutir formatos acessíveis, autonomia e participação, sem tratar surdez como incapacidade geral.\u003c/li>\u003cli>O organizador deve explicitar relações coerentes entre os conceitos e o caso.\u003c/li>\u003cli>As frases devem aplicar os conceitos sem confundi-los.\u003c/li>\u003cli>Avalie tese, razões, conceitos e objeção; não a concordância com a opinião da professora.\u003c/li>\u003c/ol>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Kant: dignidade e pessoa como fim\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-005\">\u003ch5>Enem — aplicação regular · 2020\u003c/h5>\u003cp class=\"ux-exam-theme\">O estigma associado às doenças mentais na sociedade brasileira\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003cp>Edição 2020, aplicação impressa em janeiro de 2021.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/c7f9eb38-a261-4c58-a1f0-21b68d7be34e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s1-filosofia-semana-3","title":"Kant: dignidade e pessoa como fim","quadro":"\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Kant: dignidade e pessoa como fim\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Dignidade — em Kant\u003c/strong>\u003cspan>Valor que não se reduz a preço, utilidade ou possibilidade de troca; exige respeito à pessoa.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Pessoa como fim\u003c/strong>\u003cspan>Reconhecimento de que a pessoa e sua capacidade de agir não podem ser reduzidas a recursos para objetivos alheios.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Instrumentalização\u003c/strong>\u003cspan>Tratamento da pessoa apenas como meio, ignorando sua agência, seus interesses ou sua possibilidade de consentir.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Preço e valor moral\u003c/strong>\u003cspan>O preço permite comparação e troca de bens; a dignidade não é uma medida comercial nem um prêmio por desempenho.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Comparação: objeto com preço × pessoa com dignidade; cooperação × uso apenas como meio.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Como a distinção entre preço e dignidade ajuda a compreender a ética kantiana?\u003c/li>\u003cli>Por que colaborar com alguém não é necessariamente tratá-lo apenas como meio?\u003c/li>\u003cli>Em uma situação fictícia, um grupo usa o nome de uma colega em um trabalho sem consultá-la. Como analisar agência e instrumentalização?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Dignidade — em Kant\u003c/dt>\u003cdd>Valor que não se reduz a preço, utilidade ou possibilidade de troca; exige respeito à pessoa.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Pessoa como fim\u003c/dt>\u003cdd>Reconhecimento de que a pessoa e sua capacidade de agir não podem ser reduzidas a recursos para objetivos alheios.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Instrumentalização\u003c/dt>\u003cdd>Tratamento da pessoa apenas como meio, ignorando sua agência, seus interesses ou sua possibilidade de consentir.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Uma pessoa perde a dignidade quando não é útil, popular ou produtiva?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Kant: dignidade e pessoa como fim\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Para Kant, a dignidade não se confunde com preço. Um objeto pode ser trocado por outro de valor equivalente, mas a pessoa não deve ser avaliada apenas pelo benefício que oferece. Considerar alguém como fim significa respeitar sua agência e seus projetos. Isso não proíbe toda colaboração: pessoas podem ajudar umas às outras e participar de atividades comuns. O problema ocorre quando alguém é tratado apenas como instrumento, sem informação, consideração ou possibilidade de escolha. Dignidade também não é um prêmio por popularidade, riqueza ou produtividade. Podemos criticar uma ação sem negar o valor da pessoa que a realizou.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Como a distinção entre preço e dignidade ajuda a compreender a ética kantiana?\u003c/li>\u003cli>Por que colaborar com alguém não é necessariamente tratá-lo apenas como meio?\u003c/li>\u003cli>Em uma situação fictícia, um grupo usa o nome de uma colega em um trabalho sem consultá-la. Como analisar agência e instrumentalização?\u003c/li>\u003cli>Faça o organizador sugerido: Comparação: objeto com preço × pessoa com dignidade; cooperação × uso apenas como meio.\u003c/li>\u003cli>Escolha dois conceitos e use cada um em uma frase que explique o caso da aula.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas respondendo à questão-problema. Use conceitos e uma razão; considere uma objeção.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Immanuel Kant — Fundamentação da metafísica dos costumes, seção II","u":"https://www.gutenberg.org/ebooks/5682","n":"Tradução inglesa de Thomas Kingsmill Abbott, intitulada Fundamental Principles of the Metaphysic of Morals. Leitura de apoio da professora."},{"t":"Stanford Encyclopedia of Philosophy — Kant’s Moral Philosophy","u":"https://plato.stanford.edu/entries/kant-moral/","n":"Texto em inglês; seções sobre dever, fórmula da humanidade e autonomia."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Kant: dignidade e pessoa como fim; Dignidade — em Kant; Pessoa como fim; Instrumentalização; Preço e valor moral.\u003c/p>\u003c/section>\u003csection class=\"wide\">\u003ch4>Leitura e atividade\u003c/h4>\u003cp>Comparação: objeto com preço × pessoa com dignidade; cooperação × uso apenas como meio.\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS605\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — direitos civis, políticos e sociais; dignidade em Kant; reconhecimento em Axel Honneth. Matriz 2026, 4º bimestre: recorte fornecido pela professora.\u003c/p>\u003c/section>\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">Dignidade — em Kant\u003c/span>\u003cspan class=\"concept-chip\">Pessoa como fim\u003c/span>\u003cspan class=\"concept-chip\">Instrumentalização\u003c/span>\u003cspan class=\"concept-chip\">Preço e valor moral\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Kant: dignidade e pessoa como fim\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Dignidade — em Kant\u003c/strong>\u003cspan>Valor que não se reduz a preço, utilidade ou possibilidade de troca; exige respeito à pessoa.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Pessoa como fim\u003c/strong>\u003cspan>Reconhecimento de que a pessoa e sua capacidade de agir não podem ser reduzidas a recursos para objetivos alheios.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Instrumentalização\u003c/strong>\u003cspan>Tratamento da pessoa apenas como meio, ignorando sua agência, seus interesses ou sua possibilidade de consentir.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Preço e valor moral\u003c/strong>\u003cspan>O preço permite comparação e troca de bens; a dignidade não é uma medida comercial nem um prêmio por desempenho.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Comparação: objeto com preço × pessoa com dignidade; cooperação × uso apenas como meio.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Como a distinção entre preço e dignidade ajuda a compreender a ética kantiana?\u003c/li>\u003cli>Por que colaborar com alguém não é necessariamente tratá-lo apenas como meio?\u003c/li>\u003cli>Em uma situação fictícia, um grupo usa o nome de uma colega em um trabalho sem consultá-la. Como analisar agência e instrumentalização?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-3-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-3-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Dignidade — em Kant\u003c/dt>\u003cdd>\u003cp>Valor que não se reduz a preço, utilidade ou possibilidade de troca; exige respeito à pessoa.\u003c/p>\u003c/dd>\u003cdt>Pessoa como fim\u003c/dt>\u003cdd>\u003cp>Reconhecimento de que a pessoa e sua capacidade de agir não podem ser reduzidas a recursos para objetivos alheios.\u003c/p>\u003c/dd>\u003cdt>Instrumentalização\u003c/dt>\u003cdd>\u003cp>Tratamento da pessoa apenas como meio, ignorando sua agência, seus interesses ou sua possibilidade de consentir.\u003c/p>\u003c/dd>\u003cdt>Preço e valor moral\u003c/dt>\u003cdd>\u003cp>O preço permite comparação e troca de bens; a dignidade não é uma medida comercial nem um prêmio por desempenho.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 3\u003c/div>\u003ch4>Kant: dignidade e pessoa como fim\u003c/h4>\u003c/div>\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Na Fundamentação da metafísica dos costumes, Kant relaciona dignidade e humanidade à capacidade racional de agir segundo princípios. A fórmula da humanidade exige considerar a humanidade, em si e nos outros, também como fim. O ponto decisivo é não usar a pessoa apenas como meio.\u003c/p>\u003cp>Cooperação e trabalho podem envolver meios e fins sem eliminar respeito: examine informação, possibilidade de escolha e consideração pelos projetos da pessoa. Dignidade não deve virar uma escala de produtividade ou inteligência. O estatuto moral da pessoa deve ser distinguido da avaliação crítica de suas ações. A discussão histórica dos limites da filosofia kantiana não autoriza excluir pessoas dos direitos humanos.\u003c/p>\u003ch4>Roteiro de aplicação\u003c/h4>\u003cp>Comece pela questão-problema, explique os conceitos, leia a fonte indicada e analise um caso fictício. Feche com um registro e uma justificativa. Adapte o tempo e os recursos à turma.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-3-study-heading\">\u003ch4 id=\"s1-filosofia-semana-3-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Na Fundamentação da metafísica dos costumes, Kant relaciona dignidade e humanidade à capacidade racional de agir segundo princípios. A fórmula da humanidade exige considerar a humanidade, em si e nos outros, também como fim. O ponto decisivo é não usar a pessoa apenas como meio.\u003c/p>\u003cp>Cooperação e trabalho podem envolver meios e fins sem eliminar respeito: examine informação, possibilidade de escolha e consideração pelos projetos da pessoa. Dignidade não deve virar uma escala de produtividade ou inteligência. O estatuto moral da pessoa deve ser distinguido da avaliação crítica de suas ações. A discussão histórica dos limites da filosofia kantiana não autoriza excluir pessoas dos direitos humanos.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Não transforme dignidade em prêmio por desempenho ou capacidade cognitiva. A fórmula kantiana critica o uso apenas como meio; ela não proíbe qualquer relação de cooperação, trabalho ou troca.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Em uma situação fictícia, um grupo usa o nome de uma colega em um trabalho sem consultá-la. Como analisar agência e instrumentalização?\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>O caso é uma situação fictícia de aplicação dos conceitos, não um relato documentado. Preço admite troca e comparação; dignidade não depende de utilidade e exige respeito à pessoa. Cooperação pode respeitar escolha, informação e projetos; a crítica é ao uso apenas como meio. A colega tem sua agência ignorada: é preciso consultá-la e permitir decisão informada. Não reduzir a resposta à reputação ou ao benefício que o grupo obterá.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://www.gutenberg.org/ebooks/5682\" target=\"_blank\" rel=\"noopener\">Immanuel Kant — Fundamentação da metafísica dos costumes, seção II\u003c/a>\u003cp>Tradução inglesa de Thomas Kingsmill Abbott, intitulada Fundamental Principles of the Metaphysic of Morals. Leitura de apoio da professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/kant-moral/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Kant’s Moral Philosophy\u003c/a>\u003cp>Texto em inglês; seções sobre dever, fórmula da humanidade e autonomia.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Uma pessoa perde a dignidade quando não é útil, popular ou produtiva?\u003c/h5>\u003cp>Na Fundamentação da metafísica dos costumes, Kant relaciona dignidade e humanidade à capacidade racional de agir segundo princípios. A fórmula da humanidade exige considerar a humanidade, em si e nos outros, também como fim. O ponto decisivo é não usar a pessoa apenas como meio. Cooperação e trabalho podem envolver meios e fins sem eliminar respeito: examine informação, possibilidade de escolha e consideração pelos projetos da pessoa. Dignidade não deve virar uma escala de produtividade ou inteligência. O estatuto moral da pessoa deve ser distinguido da avaliação crítica de suas ações. A discussão histórica dos limites da filosofia kantiana não autoriza excluir pessoas dos direitos humanos.\u003c/p>\u003cp>Limite da resposta: Não transforme dignidade em prêmio por desempenho ou capacidade cognitiva. A fórmula kantiana critica o uso apenas como meio; ela não proíbe qualquer relação de cooperação, trabalho ou troca.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Dignidade — em Kant\u003c/dt>\u003cdd>Valor que não se reduz a preço, utilidade ou possibilidade de troca; exige respeito à pessoa.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Pessoa como fim\u003c/dt>\u003cdd>Reconhecimento de que a pessoa e sua capacidade de agir não podem ser reduzidas a recursos para objetivos alheios.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Instrumentalização\u003c/dt>\u003cdd>Tratamento da pessoa apenas como meio, ignorando sua agência, seus interesses ou sua possibilidade de consentir.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Uma pessoa perde a dignidade quando não é útil, popular ou produtiva?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Kant: dignidade e pessoa como fim\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-005\">\u003ch5>Enem — aplicação regular · 2020\u003c/h5>\u003cp class=\"ux-exam-theme\">O estigma associado às doenças mentais na sociedade brasileira\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003cp>Edição 2020, aplicação impressa em janeiro de 2021.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/c7f9eb38-a261-4c58-a1f0-21b68d7be34e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Estude Kant: dignidade e pessoa como fim para explicar as diferenças conceituais e conduzir a análise de situações. A leitura serve de apoio à habilidade GO-EMCHS606A da matriz de 2026 fornecida pela professora.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.gutenberg.org/ebooks/5682\" target=\"_blank\" rel=\"noopener\">Immanuel Kant — Fundamentação da metafísica dos costumes, seção II\u003c/a>\u003cp>Leitura prioritária: Kant: dignidade e pessoa como fim. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Tradução inglesa de Thomas Kingsmill Abbott, intitulada Fundamental Principles of the Metaphysic of Morals. Leitura de apoio da professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/kant-moral/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Kant’s Moral Philosophy\u003c/a>\u003cp>Leitura prioritária: Kant: dignidade e pessoa como fim. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Texto em inglês; seções sobre dever, fórmula da humanidade e autonomia.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\u003cp>25 min para leitura e registro; 35 min para as questões; 20 min para organizador e parágrafo; 10 min para revisão. Ajuste à turma.\u003c/p>\u003ch5>Respostas e critérios\u003c/h5>\u003col>\u003cli>Preço admite troca e comparação; dignidade não depende de utilidade e exige respeito à pessoa.\u003c/li>\u003cli>Cooperação pode respeitar escolha, informação e projetos; a crítica é ao uso apenas como meio.\u003c/li>\u003cli>A colega tem sua agência ignorada: é preciso consultá-la e permitir decisão informada. Não reduzir a resposta à reputação ou ao benefício que o grupo obterá.\u003c/li>\u003cli>O organizador deve explicitar relações coerentes entre os conceitos e o caso.\u003c/li>\u003cli>As frases devem aplicar os conceitos sem confundi-los.\u003c/li>\u003cli>Avalie tese, razões, conceitos e objeção; não a concordância com a opinião da professora.\u003c/li>\u003c/ol>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Kant: autonomia, dever e respeito\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"redacao-paes-2024\">\u003ch5>PAES/UEMA · 2024\u003c/h5>\u003cp class=\"ux-exam-theme\">O que é ser livre, em pleno século XXI?\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: UEMA · Produção textual — etapa única · Edição 2024\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003cp>Aplicado em 26/11/2023. Tema confirmado em notícia oficial da UEMA; o link leva à publicação institucional.\u003c/p>\u003c/details>\u003ca href=\"https://www.uema.br/2023/11/paes-2024-mais-de-36-mil-candidatos-prestaram-vestibular-da-uema-neste-domingo-26/\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s1-filosofia-semana-4","title":"Kant: autonomia, dever e respeito","quadro":"\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Kant: autonomia, dever e respeito\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Autonomia moral — em Kant\u003c/strong>\u003cspan>Capacidade de orientar a vontade por princípios que se podem reconhecer racionalmente; não equivale a fazer qualquer coisa desejada.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Dever\u003c/strong>\u003cspan>Exigência moral que não depende apenas da conveniência ou do benefício pessoal esperado.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Universalização\u003c/strong>\u003cspan>Exame de uma máxima perguntando se ela poderia valer como princípio para todos, e não apenas como exceção favorável a mim.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Respeito\u003c/strong>\u003cspan>Consideração pela pessoa e pela exigência moral; distingue-se de medo da punição e de busca de aprovação.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Quadro: ação → motivo explicitado → máxima → respeito à pessoa.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Diferencie agir por dever e agir apenas por interesse.\u003c/li>\u003cli>Por que autonomia moral não significa ausência de limites?\u003c/li>\u003cli>Duas pessoas devolvem um objeto encontrado: uma para receber recompensa; outra por reconhecer que não deve apropriar-se dele. Compare os motivos e a conduta exterior.\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Autonomia moral — em Kant\u003c/dt>\u003cdd>Capacidade de orientar a vontade por princípios que se podem reconhecer racionalmente; não equivale a fazer qualquer coisa desejada.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Dever\u003c/dt>\u003cdd>Exigência moral que não depende apenas da conveniência ou do benefício pessoal esperado.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Universalização\u003c/dt>\u003cdd>Exame de uma máxima perguntando se ela poderia valer como princípio para todos, e não apenas como exceção favorável a mim.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Uma atitude só é respeitosa quando traz vantagem para quem a pratica?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Kant: autonomia, dever e respeito\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">A ética kantiana pergunta por que e segundo qual princípio agimos. Cumprir uma regra apenas para ganhar uma vantagem é diferente de reconhecê-la como uma exigência moral. Agir por dever não significa obedecer cegamente a qualquer ordem: é orientar a vontade por um princípio racional. Autonomia moral também não significa fazer tudo o que se deseja. Para examinar uma ação, podemos perguntar se a regra que a orienta poderia valer para todos e se ela respeita as pessoas como fins. Casos fictícios permitem comparar motivos sem pretender conhecer a intenção íntima de pessoas reais.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Diferencie agir por dever e agir apenas por interesse.\u003c/li>\u003cli>Por que autonomia moral não significa ausência de limites?\u003c/li>\u003cli>Duas pessoas devolvem um objeto encontrado: uma para receber recompensa; outra por reconhecer que não deve apropriar-se dele. Compare os motivos e a conduta exterior.\u003c/li>\u003cli>Faça o organizador sugerido: Quadro: ação → motivo explicitado → máxima → respeito à pessoa.\u003c/li>\u003cli>Escolha dois conceitos e use cada um em uma frase que explique o caso da aula.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas respondendo à questão-problema. Use conceitos e uma razão; considere uma objeção.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Immanuel Kant — Fundamentação da metafísica dos costumes, seção II","u":"https://www.gutenberg.org/ebooks/5682","n":"Tradução inglesa de Thomas Kingsmill Abbott, intitulada Fundamental Principles of the Metaphysic of Morals. Leitura de apoio da professora."},{"t":"Stanford Encyclopedia of Philosophy — Kant’s Moral Philosophy","u":"https://plato.stanford.edu/entries/kant-moral/","n":"Texto em inglês; seções sobre dever, fórmula da humanidade e autonomia."},{"t":"ONU/UNICEF — Declaração Universal dos Direitos Humanos","u":"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos","n":"Texto em português; selecione artigos conforme o objetivo da semana."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Kant: autonomia, dever e respeito; Autonomia moral — em Kant; Dever; Universalização; Respeito.\u003c/p>\u003c/section>\u003csection class=\"wide\">\u003ch4>Leitura e atividade\u003c/h4>\u003cp>Quadro: ação → motivo explicitado → máxima → respeito à pessoa.\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS605\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — direitos civis, políticos e sociais; dignidade em Kant; reconhecimento em Axel Honneth. Matriz 2026, 4º bimestre: recorte fornecido pela professora.\u003c/p>\u003c/section>\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">Autonomia moral — em Kant\u003c/span>\u003cspan class=\"concept-chip\">Dever\u003c/span>\u003cspan class=\"concept-chip\">Universalização\u003c/span>\u003cspan class=\"concept-chip\">Respeito\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Kant: autonomia, dever e respeito\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Autonomia moral — em Kant\u003c/strong>\u003cspan>Capacidade de orientar a vontade por princípios que se podem reconhecer racionalmente; não equivale a fazer qualquer coisa desejada.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Dever\u003c/strong>\u003cspan>Exigência moral que não depende apenas da conveniência ou do benefício pessoal esperado.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Universalização\u003c/strong>\u003cspan>Exame de uma máxima perguntando se ela poderia valer como princípio para todos, e não apenas como exceção favorável a mim.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Respeito\u003c/strong>\u003cspan>Consideração pela pessoa e pela exigência moral; distingue-se de medo da punição e de busca de aprovação.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Quadro: ação → motivo explicitado → máxima → respeito à pessoa.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Diferencie agir por dever e agir apenas por interesse.\u003c/li>\u003cli>Por que autonomia moral não significa ausência de limites?\u003c/li>\u003cli>Duas pessoas devolvem um objeto encontrado: uma para receber recompensa; outra por reconhecer que não deve apropriar-se dele. Compare os motivos e a conduta exterior.\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-4-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-4-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Autonomia moral — em Kant\u003c/dt>\u003cdd>\u003cp>Capacidade de orientar a vontade por princípios que se podem reconhecer racionalmente; não equivale a fazer qualquer coisa desejada.\u003c/p>\u003c/dd>\u003cdt>Dever\u003c/dt>\u003cdd>\u003cp>Exigência moral que não depende apenas da conveniência ou do benefício pessoal esperado.\u003c/p>\u003c/dd>\u003cdt>Universalização\u003c/dt>\u003cdd>\u003cp>Exame de uma máxima perguntando se ela poderia valer como princípio para todos, e não apenas como exceção favorável a mim.\u003c/p>\u003c/dd>\u003cdt>Respeito\u003c/dt>\u003cdd>\u003cp>Consideração pela pessoa e pela exigência moral; distingue-se de medo da punição e de busca de aprovação.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 4\u003c/div>\u003ch4>Kant: autonomia, dever e respeito\u003c/h4>\u003c/div>\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Kant distingue uma ação conforme ao dever de uma ação realizada por dever. A mesma conduta exterior pode ter motivações distintas. O valor moral não se reduz ao benefício obtido ou à aparência pública da ação. Isso não exige adivinhar a intenção de pessoas reais: formule motivos explicitamente em casos fictícios.\u003c/p>\u003cp>Autonomia não é ausência de limites nem simples satisfação de desejos. Ela envolve reconhecer uma exigência moral racional. Examine a máxima de uma ação, sua possibilidade de universalização e sua relação com a humanidade como fim. Evite tratar Kant como defensor de obediência cega a qualquer ordem ou de indiferença ao sofrimento.\u003c/p>\u003ch4>Roteiro de aplicação\u003c/h4>\u003cp>Comece pela questão-problema, explique os conceitos, leia a fonte indicada e analise um caso fictício. Feche com um registro e uma justificativa. Adapte o tempo e os recursos à turma.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-4-study-heading\">\u003ch4 id=\"s1-filosofia-semana-4-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Kant distingue uma ação conforme ao dever de uma ação realizada por dever. A mesma conduta exterior pode ter motivações distintas. O valor moral não se reduz ao benefício obtido ou à aparência pública da ação. Isso não exige adivinhar a intenção de pessoas reais: formule motivos explicitamente em casos fictícios.\u003c/p>\u003cp>Autonomia não é ausência de limites nem simples satisfação de desejos. Ela envolve reconhecer uma exigência moral racional. Examine a máxima de uma ação, sua possibilidade de universalização e sua relação com a humanidade como fim. Evite tratar Kant como defensor de obediência cega a qualquer ordem ou de indiferença ao sofrimento.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Use motivos explicitados em situações fictícias, sem diagnosticar a intenção de colegas. Não confunda dever moral com obediência a qualquer autoridade, nem autonomia com liberdade sem consideração pelos outros.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Duas pessoas devolvem um objeto encontrado: uma para receber recompensa; outra por reconhecer que não deve apropriar-se dele. Compare os motivos e a conduta exterior.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>O caso é uma situação fictícia de aplicação dos conceitos, não um relato documentado. O dever se apoia na exigência moral; o interesse se orienta pela vantagem. A conduta externa pode coincidir. A autonomia envolve princípios racionais e respeito, e não autorização para satisfazer qualquer desejo. Ambas devolvem o objeto, mas o motivo explicitado no caso é diferente. Não concluir que toda ação útil ou prazerosa seja imoral.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://www.gutenberg.org/ebooks/5682\" target=\"_blank\" rel=\"noopener\">Immanuel Kant — Fundamentação da metafísica dos costumes, seção II\u003c/a>\u003cp>Tradução inglesa de Thomas Kingsmill Abbott, intitulada Fundamental Principles of the Metaphysic of Morals. Leitura de apoio da professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/kant-moral/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Kant’s Moral Philosophy\u003c/a>\u003cp>Texto em inglês; seções sobre dever, fórmula da humanidade e autonomia.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Uma atitude só é respeitosa quando traz vantagem para quem a pratica?\u003c/h5>\u003cp>Kant distingue uma ação conforme ao dever de uma ação realizada por dever. A mesma conduta exterior pode ter motivações distintas. O valor moral não se reduz ao benefício obtido ou à aparência pública da ação. Isso não exige adivinhar a intenção de pessoas reais: formule motivos explicitamente em casos fictícios. Autonomia não é ausência de limites nem simples satisfação de desejos. Ela envolve reconhecer uma exigência moral racional. Examine a máxima de uma ação, sua possibilidade de universalização e sua relação com a humanidade como fim. Evite tratar Kant como defensor de obediência cega a qualquer ordem ou de indiferença ao sofrimento.\u003c/p>\u003cp>Limite da resposta: Use motivos explicitados em situações fictícias, sem diagnosticar a intenção de colegas. Não confunda dever moral com obediência a qualquer autoridade, nem autonomia com liberdade sem consideração pelos outros.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Autonomia moral — em Kant\u003c/dt>\u003cdd>Capacidade de orientar a vontade por princípios que se podem reconhecer racionalmente; não equivale a fazer qualquer coisa desejada.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Dever\u003c/dt>\u003cdd>Exigência moral que não depende apenas da conveniência ou do benefício pessoal esperado.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Universalização\u003c/dt>\u003cdd>Exame de uma máxima perguntando se ela poderia valer como princípio para todos, e não apenas como exceção favorável a mim.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Uma atitude só é respeitosa quando traz vantagem para quem a pratica?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Qual problema o autor ou a obra formula, e em qual contexto?\u003c/li>\u003cli>Como conceitos, composição, suporte e enquadramento orientam a interpretação?\u003c/li>\u003cli>Que tese ou interpretação é justificável, e qual objeção ou elemento da obra limita essa leitura?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Kant: autonomia, dever e respeito\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"redacao-paes-2024\">\u003ch5>PAES/UEMA · 2024\u003c/h5>\u003cp class=\"ux-exam-theme\">O que é ser livre, em pleno século XXI?\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: UEMA · Produção textual — etapa única · Edição 2024\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003cp>Aplicado em 26/11/2023. Tema confirmado em notícia oficial da UEMA; o link leva à publicação institucional.\u003c/p>\u003c/details>\u003ca href=\"https://www.uema.br/2023/11/paes-2024-mais-de-36-mil-candidatos-prestaram-vestibular-da-uema-neste-domingo-26/\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Estude Kant: autonomia, dever e respeito para explicar as diferenças conceituais e conduzir a análise de situações. A leitura serve de apoio à habilidade GO-EMCHS606A da matriz de 2026 fornecida pela professora.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.gutenberg.org/ebooks/5682\" target=\"_blank\" rel=\"noopener\">Immanuel Kant — Fundamentação da metafísica dos costumes, seção II\u003c/a>\u003cp>Leitura prioritária: Kant: autonomia, dever e respeito. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Tradução inglesa de Thomas Kingsmill Abbott, intitulada Fundamental Principles of the Metaphysic of Morals. Leitura de apoio da professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/kant-moral/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Kant’s Moral Philosophy\u003c/a>\u003cp>Leitura prioritária: Kant: autonomia, dever e respeito. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Texto em inglês; seções sobre dever, fórmula da humanidade e autonomia.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Leitura prioritária: Kant: autonomia, dever e respeito. Localize o problema da semana e confronte o conceito com o caso fictício antes da aula.\u003c/p>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\u003cp>25 min para leitura e registro; 35 min para as questões; 20 min para organizador e parágrafo; 10 min para revisão. Ajuste à turma.\u003c/p>\u003ch5>Respostas e critérios\u003c/h5>\u003col>\u003cli>O dever se apoia na exigência moral; o interesse se orienta pela vantagem. A conduta externa pode coincidir.\u003c/li>\u003cli>A autonomia envolve princípios racionais e respeito, e não autorização para satisfazer qualquer desejo.\u003c/li>\u003cli>Ambas devolvem o objeto, mas o motivo explicitado no caso é diferente. Não concluir que toda ação útil ou prazerosa seja imoral.\u003c/li>\u003cli>O organizador deve explicitar relações coerentes entre os conceitos e o caso.\u003c/li>\u003cli>As frases devem aplicar os conceitos sem confundi-los.\u003c/li>\u003cli>Avalie tese, razões, conceitos e objeção; não a concordância com a opinião da professora.\u003c/li>\u003c/ol>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Honneth: reconhecimento e pertencimento\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"redacao-pas-2025-identidade\">\u003ch5>PAS/UnB — 3ª etapa · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Como nossa identidade é definida atualmente?\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Cebraspe · Tema 2, p. 5 · Edital 2025\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003cp>O candidato escolhia um entre três temas; esta é a proposta 2.\u003c/p>\u003c/details>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/098_PAS3_001_DISC.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-008\">\u003ch5>Enem — aplicação regular · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para o enfrentamento da invisibilidade do trabalho de cuidado realizado pela mulher no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/6f6e6a08-9f0b-4365-9f52-a24c5e4ab2e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s1-filosofia-semana-5","title":"Honneth: reconhecimento e pertencimento","quadro":"\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Honneth: reconhecimento e pertencimento\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Reconhecimento — em Honneth\u003c/strong>\u003cspan>Relação intersubjetiva em que a pessoa encontra consideração por suas necessidades, seu estatuto de sujeito de direitos e suas contribuições.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Cuidado e vínculos afetivos\u003c/strong>\u003cspan>Esfera do reconhecimento ligada a necessidades e vínculos próximos, importante para a autoconfiança; não significa exigir amor pessoal de todos.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Reconhecimento jurídico\u003c/strong>\u003cspan>Consideração da pessoa como sujeito de direitos, importante para o autorrespeito; não depende de prestígio social.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Solidariedade e estima social\u003c/strong>\u003cspan>Valorização de capacidades e contribuições em uma comunidade; relaciona-se à autoestima e não se reduz à fama.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Três blocos: cuidado → autoconfiança; direitos → autorrespeito; estima social → autoestima.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Por que reconhecimento não é sinônimo de visibilidade?\u003c/li>\u003cli>Relacione
