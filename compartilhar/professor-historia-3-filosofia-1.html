<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material de aula</title><style>/* Bloco 1 */

:root{--bg:#f4f0e8;--paper:#fffdfa;--ink:#20272a;--muted:#566168;--line:#ded7cc;--wine:#743642;--hist:#8c5a2b;--fil:#54508f;--soc:#2e6c5e;--shadow:0 10px 28px rgba(45,38,30,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 7% 0%,rgba(116,54,66,.09),transparent 28rem),radial-gradient(circle at 92% 4%,rgba(46,108,94,.08),transparent 25rem),var(--bg);color:var(--ink);line-height:1.55}a{color:inherit}.hero{background:linear-gradient(135deg,#252b2e,#3b3231);color:white;padding:54px 20px 34px}.hero>div,.toolbar>div,main,footer{max-width:1200px;margin:auto}.kicker,small{text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:.8125rem}.kicker{color:#d7b4ba}.hero h1,.series-head h1,.discipline-title h2{font-family:Georgia,serif}.hero h1{font-size:clamp(2.2rem,6vw,4.8rem);line-height:1;margin:.3rem 0 1rem}.hero p{max-width:870px;color:#e9e2db;font-size:1.05rem}.toolbar{position:sticky;top:0;z-index:30;background:rgba(255,253,250,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.toolbar>div{padding:10px 18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,.pill,.filebtn,.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;font:inherit;font-size:.86rem;font-weight:750;text-decoration:none;cursor:pointer}button:hover,.pill:hover,.filebtn:hover,.chip:hover{border-color:#9b8d7e}.search{margin-left:auto;min-width:230px;flex:1;max-width:360px}.search input{width:100%;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font:inherit}main{padding:28px 18px 80px}.notice{background:#fff7dc;border:1px solid #e9d79a;border-radius:18px;padding:14px 16px;color:#5c512d}.series{margin-top:38px;scroll-margin-top:78px}.series-head{background:#252b2e;color:white;padding:22px 24px;border-radius:24px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}.series-head small{color:#cbbdc0}.series-head h1{font-size:2.3rem;margin:.1rem 0 0}.chips{display:flex;gap:8px;flex-wrap:wrap}.series-head .chip{background:#353c3f;color:white;border-color:#555c5f}.discipline{margin-top:34px;scroll-margin-top:84px}.discipline-title{display:flex;justify-content:space-between;align-items:end;gap:16px;padding:0 4px 12px;border-bottom:2px solid var(--line)}.discipline-title h2{font-size:2rem;margin:.05rem 0}.discipline-title p{margin:0;color:var(--muted)}.discipline-title a{font-size:.84rem;color:var(--muted);text-decoration:none}.historia .discipline-title{border-color:rgba(140,90,43,.5)}.filosofia .discipline-title{border-color:rgba(84,80,143,.5)}.sociologia .discipline-title{border-color:rgba(46,108,94,.5)}.week-card{margin-top:17px;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.week-head{display:flex;align-items:center;gap:14px;padding:17px 19px;border-bottom:1px solid var(--line)}.week-head span{padding:7px 10px;border-radius:11px;background:#eee7dc;font-size:.8125rem;font-weight:850;text-transform:uppercase;letter-spacing:.06em}.historia .week-head span{background:#f2e4d5;color:#70461f}.filosofia .week-head span{background:#e8e6f6;color:#49467c}.sociologia .week-head span{background:#dfeee9;color:#275a4e}.week-head h3{margin:0;font-size:1.18rem}.plan-grid{display:grid;grid-template-columns:1fr 1fr}.plan-grid section{padding:14px 17px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.plan-grid section:nth-child(even){border-right:0}.plan-grid .wide{grid-column:1/-1;border-right:0}h4{margin:0 0 5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:.8125rem}p{margin:0}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem}.notebook{background:#fbf6e8}.notebook.empty{color:#4d4943}
/* Identidade visual dos blocos de caderno */
.wide.notebook{position:relative;margin-top:2px;padding:20px 18px 18px 76px;background:linear-gradient(to right,rgba(205,68,68,.24) 0,rgba(205,68,68,.24) 2px,transparent 2px) 54px 0/2px 100% no-repeat,repeating-linear-gradient(to bottom,#fffefb 0 30px,#d6e3ff 30px 31px);border:1px solid #d7cdbd;border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 6px 14px rgba(77,63,43,.06)}
.wide.notebook::before{content:"NO CADERNO";display:inline-block;position:absolute;top:12px;left:16px;padding:5px 10px;border-radius:999px;background:#fff6da;border:1px solid #d8bf7a;color:#6f5321;font:800 .8125rem/1 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.11em;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.wide.notebook::after{content:"";position:absolute;left:48px;top:0;bottom:0;width:2px;background:rgba(200,74,74,.45)}
.wide.notebook h4{margin:18px 0 8px;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:1.22rem;line-height:1.2;letter-spacing:.01em;text-transform:none;color:#2a3e66;font-weight:700}
.wide.notebook p,.wide.notebook li,.wide.notebook td,.wide.notebook th{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:1.02rem;line-height:1.65;color:#2e2a25}
.wide.notebook p strong,.wide.notebook li strong,.wide.notebook td strong,.wide.notebook th strong{font-family:inherit}
.wide.notebook ul,.wide.notebook ol{margin:8px 0 6px 22px}
.wide.notebook table{background:rgba(255,255,255,.65);border-radius:12px;overflow:hidden}
.wide.notebook th,.wide.notebook td{border-color:#cfd8ec}
@media(max-width:760px){.wide.notebook{padding:18px 14px 16px 60px}.wide.notebook::after{left:38px}.wide.notebook h4{font-size:1.08rem}.wide.notebook p,.wide.notebook li,.wide.notebook td,.wide.notebook th{font-size:.96rem;line-height:1.58}}
@media print{.wide.notebook{box-shadow:none;background:linear-gradient(to right,rgba(205,68,68,.24) 0,rgba(205,68,68,.24) 2px,transparent 2px) 54px 0/2px 100% no-repeat,repeating-linear-gradient(to bottom,#fffefb 0 30px,#d6e3ff 30px 31px)}}details.build summary{cursor:pointer;padding:13px 19px;background:#f5efe5;font-weight:800;list-style:none}details.build summary::-webkit-details-marker{display:none}details.build summary::before{content:"＋ "}details.build[open] summary::before{content:"− "}.editors{padding:17px;display:grid;grid-template-columns:1fr 1fr;gap:13px;background:#fbfaf6}.editors label{display:flex;flex-direction:column;gap:6px;color:#625d56;font-size:.8125rem;font-weight:800}.editors .span2{grid-column:1/-1}textarea{min-height:115px;width:100%;resize:vertical;border:1px solid #d8cfc3;border-radius:12px;padding:10px 11px;font:inherit;line-height:1.45;background:white;color:var(--ink)}textarea:focus,input:focus{outline:3px solid rgba(116,54,66,.12);border-color:#9b6b73}.status{font-size:.8125rem;color:var(--muted)}.hidden{display:none!important}footer{padding:0 18px 44px;color:var(--muted);font-size:.88rem}#importFile{display:none}@media(max-width:760px){.search{order:3;min-width:100%;max-width:none}.plan-grid{grid-template-columns:1fr}.plan-grid section,.plan-grid section:nth-child(even),.plan-grid .wide{grid-column:1/-1;border-right:0}.editors{grid-template-columns:1fr}.editors .span2{grid-column:auto}}@media print{body{background:white}.toolbar,.notice,.discipline-title a,details.build summary{display:none!important}main{max-width:none;padding:0}.series{break-before:page;margin-top:0}.series:first-of-type{break-before:auto}.week-card{box-shadow:none;break-inside:avoid}textarea{min-height:80px;border:1px solid #bbb}}

.overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 32px}
.overview-card{display:flex;flex-direction:column;gap:4px;background:var(--paper);border:1px solid var(--line);
border-radius:18px;padding:16px 17px;text-decoration:none;box-shadow:var(--shadow)}
.overview-card:hover{border-color:#9b8d7e;transform:translateY(-1px)}
.overview-card small{color:var(--muted)}
.overview-card strong{font-family:Georgia,serif;font-size:1.12rem}
.overview-card span{color:var(--muted);font-size:.86rem}

@media(max-width:560px){.overview-grid{grid-template-columns:1fr}}

.registro-visual{margin:18px 0 4px;padding:14px;background:#fbfaf7;border:1px solid var(--line);border-radius:16px}
.registro-visual h4{margin:0 0 10px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.registro-visual img{display:block;width:min(100%,760px);height:auto;margin:auto;border-radius:12px;border:1px solid #d7d0c4;box-shadow:0 5px 15px rgba(0,0,0,.06)}
@media print{.registro-visual img{max-height:230mm;object-fit:contain;box-shadow:none}}


.study-track{margin:14px 0 22px;padding:14px 16px;background:#fbfaf7;border:1px solid var(--line);border-radius:18px}
.study-track h3{margin:0 0 10px;font-family:Georgia,serif}
.track-list{display:grid;gap:8px}
.track-item{display:grid;grid-template-columns:34px minmax(180px,1fr) minmax(220px,1.3fr) 34px;gap:10px;align-items:center;
border-left:3px solid #a99b8c;background:#fff;border-radius:10px;padding:8px 10px}
.track-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eee;border:1px solid #bbb;font-weight:800}
.track-theme{font-weight:800}
.track-resource{font-size:.88rem;color:var(--muted)}
.track-check{width:20px;height:20px;border:2px solid #aaa;border-radius:4px}
.concepts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.concept-chip{background:#f0ede7;border:1px solid #d8d0c5;border-radius:999px;padding:4px 8px;font-size:.82rem}
@media(max-width:760px){.track-item{grid-template-columns:32px 1fr 28px}.track-resource{grid-column:2/4}}
@media print{.study-track{break-inside:avoid}.track-check{border-color:#666}}

.track-resource .mode{display:inline-block;font-weight:800;font-size:.8125rem;letter-spacing:.04em;
padding:3px 7px;border-radius:999px;margin-right:6px;border:1px solid #cfc6b9;background:#f4f0e9;color:#4a4038}
.track-concepts{font-size:.8125rem;color:#6a6259;margin-top:4px}
.study-legend{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}
.study-legend span{font-size:.8125rem;border:1px solid #d6cec2;border-radius:999px;padding:4px 8px;background:#fff}
.week-study-note{background:#f8f5ef;border:1px solid #ddd4c8;border-radius:12px;padding:10px 12px;margin-top:8px}
.week-study-note strong{font-size:.8125rem;text-transform:uppercase;letter-spacing:.05em}
@media print{.study-legend{display:none}}

.caderno-visual-em{margin:16px 0 6px;padding:14px;background:#fbfaf7;border:1px solid var(--line);border-radius:16px}
.caderno-visual-em h4{margin:0 0 10px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.caderno-visual-em img{display:block;width:min(100%,760px);height:auto;margin:auto;border-radius:12px;border:1px solid #d7d0c4;box-shadow:0 5px 15px rgba(0,0,0,.06)}
@media print{.caderno-visual-em img{max-height:230mm;object-fit:contain;box-shadow:none}}

.revisao-academica{margin:12px 0 18px;padding:11px 13px;border-left:4px solid #75685d;background:#f7f3ec;border-radius:8px;font-size:.88rem}
.revisao-academica strong{font-family:Georgia,serif}
.epi{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 8px}
.epi span{font-size:.8125rem;font-weight:800;letter-spacing:.05em;border:1px solid #c8c0b5;background:#fff;border-radius:999px;padding:3px 7px}
@media print{.revisao-academica{break-inside:avoid}}

.caderno-final{
  margin:16px 0 8px;padding:16px 18px;background:#fffefb;border:1px solid #cfc6ba;
  border-radius:18px;box-shadow:0 5px 14px rgba(0,0,0,.04)
}
.caderno-final h4{margin:0 0 5px;font-family:Georgia,serif;font-size:1.1rem}
.caderno-final .meta{font-size:.8125rem;color:#6b625a;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.caderno-final .badges{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 11px}
.caderno-final .badges span{font-size:.8125rem;font-weight:800;border:1px solid #c9c0b5;border-radius:999px;padding:3px 7px;background:#f7f4ee}
.caderno-final .flow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:8px 0}
.caderno-final .node{border:1px solid #bdb3a7;border-radius:11px;padding:7px 9px;background:#f5f1eb;font-weight:700}
.caderno-final .arrow{font-weight:900;color:#746b62}
.caderno-final table{margin:8px 0 4px;font-size:.88rem}
.caderno-final th,.caderno-final td{padding:7px 8px}
.caderno-final .sintese{margin-top:10px;padding-top:9px;border-top:1px dashed #cfc6ba}
.caderno-final .nota{font-size:.8125rem;color:#655e57;margin-top:8px}
.sem-caderno{font-size:.84rem;color:#6a625b;background:#f8f5ef;border:1px dashed #d2c9bd;border-radius:12px;padding:9px 11px}
@media print{.caderno-final{break-inside:avoid;box-shadow:none}}

.registro-visual-final{margin:14px 0 8px;padding:12px;background:#faf8f3;border:1px solid #d2cbc0;border-radius:16px}
.registro-visual-final img{display:block;width:min(100%,760px);height:auto;margin:auto;border-radius:12px;border:1px solid #ddd5ca}
@media print{.registro-visual-final img{max-height:235mm;object-fit:contain}}

.study-legend span{font-size:.8125rem}
.plan-grid section h4{letter-spacing:.01em}
.revisao-academica .epi{display:none}
.revisao-academica strong{font-family:Georgia,serif}

/* V2 TESTE SEGURO — controles técnicos; conteúdo pedagógico preservado */
#searchCount{white-space:nowrap}
#status[data-kind="ok"]{color:#2e6c5e}
#status[data-kind="warn"]{color:#8c5a2b}
#status[data-kind="error"]{color:#9b2f3f;font-weight:800}
@media(max-width:720px){
  #openAllBtn,#closeAllBtn,#clearSearchBtn{font-size:.8125rem;padding:.45rem .6rem}
}

/* V2.3 — definições dos conceitos-chave */
.concept-definitions{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}
.concept-definitions-title{
  grid-column:1/-1;
  font-size:.8125rem;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#5e6670;
  margin-top:2px;
}
.concept-definition-item{
  font-size:.8125rem;
  line-height:1.36;
  padding:8px 9px;
  background:#fbfcfd;
  border:1px solid #dce2e7;
  border-radius:10px;
}
.concept-definition-item strong{font-weight:900}
@media(max-width:720px){
  .concept-definitions{grid-template-columns:1fr}
}
@media print{
  .concept-definitions{grid-template-columns:1fr 1fr}
  .concept-definition-item{break-inside:avoid}
}

/* Caderno da professora integrado ao planejamento */
.prof-caderno{
  margin:8px 14px 0;
  border:0;
}
.prof-seal{
  display:inline-flex;
  align-items:center;
  width:auto;
  cursor:pointer;
  list-style:none;
  border:1px solid #9d8b67;
  background:#f7f0df;
  color:#5c4b2f;
  border-radius:999px;
  padding:6px 10px;
  font-size:.8125rem;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
  transition:.15s ease;
}
.prof-seal::-webkit-details-marker{display:none}
.prof-seal:hover{background:#efe3c6}
.prof-caderno[open]>.prof-seal{
  background:#e8dcc1;
  border-color:#86734f;
}
.prof-panel{
  margin-top:10px;
  padding:14px 16px 16px;
  border:1px solid #d9d2c3;
  border-left:5px solid #9d8b67;
  border-radius:12px;
  background:#fffdfa;
}
.prof-panel-head{
  padding-bottom:8px;
  margin-bottom:10px;
  border-bottom:1px solid #e5ded1;
}
.prof-context{
  font-size:.8125rem;
  text-transform:uppercase;
  letter-spacing:.07em;
  font-weight:800;
  color:#746b5d;
}
.prof-panel-head h4{
  margin:3px 0 0;
  font-family:Georgia,serif;
  font-size:1.1rem;
  color:#3e4650;
}
.prof-panel h4{
  margin:16px 0 6px;
  color:#455b66;
}
.prof-panel p{
  margin:0 0 9px;
  line-height:1.52;
}
.prof-panel .meta-box{
  display:grid;
  gap:4px;
  margin:0 0 12px;
}
.prof-panel .meta-row{
  display:grid;
  grid-template-columns:130px 1fr;
  gap:8px;
  padding:7px 9px;
  background:#f6f7f7;
  border-radius:8px;
  font-size:.84rem;
}
.prof-panel .table-wrap{
  overflow-x:auto;
  margin:9px 0 13px;
}
.prof-panel table{
  width:100%;
  border-collapse:collapse;
  font-size:.88rem;
}
.prof-panel th,.prof-panel td{
  border:1px solid #d8dde1;
  padding:8px 9px;
  vertical-align:top;
  text-align:left;
}
.prof-panel th{background:#eef2f4}
.prof-panel .lesson-steps{
  margin:.1rem 0 .1rem 1.1rem;
  padding:0;
}
.prof-panel .lesson-steps li{margin:.28rem 0}
.prof-panel .callout{
  border:1px solid #d8dde1;
  border-left:5px solid #8b9aa2;
  border-radius:10px;
  padding:10px 12px;
  margin:11px 0;
  background:#f8fafb;
}
.prof-panel .callout-title{
  font-weight:900;
  margin-bottom:4px;
}
.prof-panel .callout-body{font-size:.92rem}
.prof-panel .callout.curiosity{background:#fff8e4;border-left-color:#b08a3b}
.prof-panel .callout.parallel{background:#f4f7f8;border-left-color:#6a8995}
.prof-panel .callout.care{background:#faeeee;border-left-color:#a76565}
.prof-panel .callout.map{background:#edf6f2;border-left-color:#4f8872}
.prof-panel .callout.method{background:#edf3f7;border-left-color:#58798a}

.prof-references{
  margin:18px 0 6px;
  border:1px solid #d7d0c0;
  border-radius:12px;
  background:#fffdfa;
}
.prof-references>summary{
  cursor:pointer;
  padding:11px 13px;
  font-weight:800;
  color:#5c4b2f;
}
.prof-ref-body{
  padding:0 14px 14px;
}
.prof-ref-body p{
  font-size:.84rem;
  margin:7px 0;
  line-height:1.4;
}

@media(max-width:720px){
  .prof-caderno{margin:8px 8px 0}
  .prof-panel{padding:12px}
  .prof-panel .meta-row{grid-template-columns:1fr}
}
@media print{
  .prof-caderno:not([open]) .prof-panel{display:none}
}

/* Registros de caderno: leitura rápida em tela e projeção */
.atividade-aluno{margin-top:7px;color:#4f4b45}
.caderno-box{margin-top:7px;padding:12px 13px;background:#fffdf7;border:1px solid #dfd4ba;border-radius:12px;line-height:1.46}
.caderno-box p{margin:0 0 8px}
.caderno-box p:last-child{margin-bottom:0}
.caderno-box ul,.caderno-box ol{margin:6px 0 8px 20px;padding:0}
.caderno-box li{margin:3px 0}
.caderno-box table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.9rem}
.caderno-box th,.caderno-box td{border:1px solid #d8cfbb;padding:7px 8px;vertical-align:top;text-align:left}
.caderno-box th{background:#f4ecd9}
.caderno-box .setas{font-weight:800;letter-spacing:.01em;padding:8px 10px;background:#f7f1e3;border-radius:9px;margin:8px 0}
.caderno-box .sintese{padding:8px 10px;border-left:4px solid #a58955;background:#fbf7ee}
@media(max-width:760px){.caderno-box table{font-size:.84rem}}

/* Navegação rápida: somente turma/disciplina ficam expostas; serviços ficam recolhidos. */
.hero{padding:20px 20px 16px}.hero h1{font-size:clamp(1.55rem,4vw,2.45rem);margin:.15rem 0 .35rem}.hero p{margin:.2rem 0;font-size:.92rem}.hero .prof-global-note{display:none}.hero>div:nth-child(2){display:none!important}
.toolbar{box-shadow:0 5px 18px rgba(45,38,30,.07)}.toolbar .nav-shell{padding:7px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.nav-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.nav-label{font-size:.8125rem;text-transform:uppercase;letter-spacing:.09em;font-weight:850;color:var(--muted);margin-right:1px}.nav-choice{padding:6px 10px;font-size:.82rem}.nav-choice.is-active{background:#252b2e;color:white;border-color:#252b2e}.disciplina-choice[data-discipline="historia"].is-active{background:var(--hist);border-color:var(--hist)}.disciplina-choice[data-discipline="filosofia"].is-active{background:var(--fil);border-color:var(--fil)}.disciplina-choice[data-discipline="sociologia"].is-active{background:var(--soc);border-color:var(--soc)}

/* Versão objetiva: registro pronto para projeção + atalhos de semana */
.week-card{scroll-margin-top:96px}
.study-track .track-list{gap:8px}
.study-track a.week-shortcut{display:grid;color:inherit;text-decoration:none;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.study-track a.week-shortcut:hover{transform:translateY(-1px);border-color:#9b8d7e;box-shadow:0 5px 14px rgba(45,38,30,.08)}
.track-go{align-self:center;justify-self:end;white-space:nowrap;font-size:.8125rem;font-weight:850;text-transform:uppercase;letter-spacing:.06em;padding:5px 8px;border:1px solid #d8cfc3;border-radius:999px;background:#fff;color:#5e625f}
.registro-pronto{position:relative;z-index:1}
.registro-titulo{margin:16px 0 12px;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:1.35rem;font-weight:800;color:#21385f;line-height:1.25}
.registro-flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0 15px}
.registro-node{display:inline-flex;align-items:center;min-height:42px;padding:7px 10px;border:1px solid #b9c7df;border-radius:12px;background:rgba(255,255,255,.82);font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-weight:700;color:#2e3d55}
.registro-arrow{font:900 1.25rem/1 Georgia,serif;color:#8b5d4e}
.registro-conceitos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}
.registro-conceito{padding:10px 11px;border:1px solid #ccd6e6;border-radius:12px;background:rgba(255,255,255,.75)}
.registro-conceito strong{display:block;margin-bottom:3px;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:1rem;color:#253e66}
.registro-conceito span{display:block;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:.93rem;line-height:1.45;color:#302d28}
.registro-tabela{width:100%;border-collapse:collapse;background:rgba(255,255,255,.72);margin:8px 0}
.registro-tabela th,.registro-tabela td{padding:9px 10px;border:1px solid #cbd5e5;text-align:left;vertical-align:top;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
.registro-tabela th{background:rgba(237,242,251,.9);color:#263c60}
@media(max-width:760px){.registro-conceitos{grid-template-columns:1fr}.track-go{display:none}.registro-titulo{font-size:1.15rem}}
@media print{.study-track a.week-shortcut{box-shadow:none}.track-go{display:none}}

/* Livro e perguntas no próprio registro de caderno */
.book-activity{margin-top:16px;padding:10px 12px;border-top:1px solid #ddd7cc;border-bottom:1px solid #ddd7cc;background:rgba(255,255,255,.72);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif!important;font-size:.96rem!important;line-height:1.45!important;color:#4d453d!important}
.book-activity strong{color:#6b4f25}
.notebook-questions{margin-top:16px;padding-top:12px;border-top:1px solid #d9d3c8}
.notebook-questions-title{margin-bottom:7px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:.8125rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#6f6254}
.notebook-questions ol{margin:0 0 0 21px;padding:0}
.notebook-questions li{margin:7px 0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif!important;font-size:1rem!important;line-height:1.5!important;color:#2b2b2b!important}
@media(max-width:760px){.notebook-questions li{font-size:.95rem!important}.book-activity{font-size:.9rem!important}}

/* ===== Revisão de 30/09/2026 ===== */
:root{--accent:#8c5a2b;--focus:#743642}
.historia{--accent:var(--hist)}.filosofia{--accent:var(--fil)}.sociologia{--accent:var(--soc)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
/* lide, objetivos e abertura */
.lide-box{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px 24px;padding:16px 19px 14px;border-bottom:1px solid var(--line);border-left:5px solid var(--accent)}
.lide{margin:0;font-family:Georgia,serif;font-size:1.14rem;line-height:1.6;max-width:64ch}
.rot{display:block;margin-bottom:4px;font-size:.8125rem;font-weight:800;letter-spacing:.02em;color:var(--muted)}
.lide-obj ul{margin:0;padding-left:1.1rem}
.lide-obj li{margin:3px 0;font-size:.97rem}
.gancho{grid-column:1/-1;padding:11px 15px;border-radius:12px;background:#faf5ea;border:1px solid #e6dcc6}
.gancho-noticia{background:#eef5f1;border-color:#cfe1d8}
.gancho-fato{background:#f1f0f8;border-color:#d9d6ee}
.gq{margin:0 0 5px;font-size:1.04rem;font-weight:750}
.gm{margin:0;font-size:.96rem;color:#353c41}
.gm a.src{font-weight:700;text-underline-offset:3px}
/* verificar e variar */
.aval-d{margin:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fffdfa}
.aval-d>summary{cursor:pointer;list-style:none;padding:10px 14px;font-weight:800}
.aval-d>summary::-webkit-details-marker{display:none}
.aval-d>summary::before{content:"＋ "}
.aval-d[open]>summary::before{content:"− "}
.aval-body{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;padding:2px 16px 14px}
.aval-body h5{margin:0 0 4px;font-size:.92rem}
.aval-body p{margin:0 0 6px;font-size:.95rem}
.aval-body ul{margin:4px 0 0;padding-left:1.1rem;font-size:.95rem}
.aval-wide{grid-column:1/-1;padding-top:8px;border-top:1px dashed var(--line)}
.para-lembrar{margin-top:14px;padding:8px 12px;background:rgba(255,246,218,.75);border-left:4px solid #d8bf7a;border-radius:6px}
/* avaliação do bimestre */
.disc-aval{margin:30px 0 8px;padding:20px;border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:18px;background:var(--paper);box-shadow:var(--shadow)}
.disc-aval h3{margin:0 0 6px;font-family:Georgia,serif;font-size:1.35rem}
.disc-aval p{margin:0 0 10px}
.disc-aval .table-wrap{overflow-x:auto;margin:12px 0 16px}
.rubrica{width:100%;min-width:680px;border-collapse:collapse;font-size:.92rem}
.rubrica th,.rubrica td{border:1px solid #d8dde1;padding:9px 10px;text-align:left;vertical-align:top}
.rubrica thead th{background:#f1ece2}
.rubrica tbody th{width:19%;background:#f8f5ef}
.disc-aval .editors{padding:12px 0 0;background:transparent;grid-template-columns:1fr 1fr 1fr}
@media(max-width:900px){.disc-aval .editors{grid-template-columns:1fr}}
/* guia e modos */
.guia{margin:0 0 8px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.guia>summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:800}
.guia>summary::-webkit-details-marker{display:none}
.guia>summary::before{content:"＋ "}
.guia[open]>summary::before{content:"− "}
.guia-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px;padding:2px 18px 18px}
.guia-grid h3{margin:0 0 6px;font-size:1rem;font-family:Georgia,serif}
.guia-grid ul,.guia-grid dl{margin:0;padding-left:1.1rem;font-size:.93rem}
.guia-grid dl{padding-left:0}
.guia-grid dt{font-weight:800;margin-top:6px}
.guia-grid dd{margin:0}
.guia-grid table{width:100%;border-collapse:collapse;font-size:.9rem}
.guia-grid td,.guia-grid th{border:1px solid #d8dde1;padding:6px 8px;text-align:left;vertical-align:top}
.guia-wide{grid-column:1/-1}
.guia-grid .tag{font-weight:800}
.guia-grid label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:.9rem}
.refs-novas{margin-top:16px;padding-top:10px;border-top:1px dashed #cfc6ba}
.refs-novas h5{margin:0 0 4px;font-size:.95rem}
.refs-novas .aviso{padding:8px 10px;background:#fff7dc;border:1px solid #e9d79a;border-radius:8px}
.nav-modes{display:flex;gap:6px}
.nav-modes button[aria-pressed="true"]{background:#252b2e;color:#fff;border-color:#252b2e}
body.easy{font-size:1.125rem;line-height:1.8;letter-spacing:.012em}
body.easy .wide.notebook h4,body.easy .wide.notebook p,body.easy .wide.notebook li,body.easy .wide.notebook td,body.easy .wide.notebook th,
body.easy .registro-titulo,body.easy .registro-node,body.easy .registro-conceito strong,body.easy .registro-conceito span,
body.easy .registro-tabela th,body.easy .registro-tabela td{font-family:Verdana,Tahoma,system-ui,sans-serif}
body.easy .registro-conceitos{grid-template-columns:1fr}
body.easy .plan-grid{grid-template-columns:1fr}
body.easy .plan-grid section,body.easy .plan-grid section:nth-child(even){border-right:0}
body.easy .lide-box,body.easy .aval-body{grid-template-columns:1fr}
body.easy .concept-definition-item,body.easy .gm,body.easy .lide-obj li{font-size:1.02rem}
body.easy p,body.easy li{max-width:70ch}
body.mode-aula .prof-caderno,body.mode-aula details.build,body.mode-aula details.aval-d,body.mode-aula .revisao-academica,
body.mode-aula .disc-aval,body.mode-aula .guia,body.mode-aula details.prof-references,body.mode-aula .meta-curric{display:none!important}
@media(max-width:760px){
  .lide-box,.aval-body,.guia-grid{grid-template-columns:1fr}
  .lide{font-size:1.06rem}
  .nav-modes{flex-wrap:wrap}
}
@media print{
  .guia,.nav-modes{display:none!important}
  .lide-box,.gancho,.disc-aval,.aval-body{break-inside:avoid}
  .lide-box{grid-template-columns:1fr 1fr}
}

 é um registro temático; não é contagem de questões independentes.\u003c/p>\u003c/details>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/987_PAS3_001_01.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s3-historia-semana-1","title":"DITADURA E REDEMOCRATIZAÇÃO","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-scroll\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M7 4h13v15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1zm0 0v14a2 2 0 0 1-4 0M10 8h7M10 12h7M10 16h4\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-megaphone\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M3 10h5l11-6v16L8 14H3zM7 14l2 7h4l-3-6M21 9l2-1M21 14l2 1\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Ditadura e redemocratização\u003c/div>\u003cdiv class=\"registro-flow\">\u003cspan class=\"registro-node\">Ditadura\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Abertura política\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Mobilização social\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Diretas Já\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Redemocratização\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>ditadura\u003c/strong> — \u003cspan>Regime político marcado pela concentração de poder e pela restrição de liberdades, participação e garantias democráticas.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>redemocratização\u003c/strong> — \u003cspan>Processo de reconstrução de instituições e práticas democráticas após um período autoritário.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>movimentos sociais\u003c/strong> — \u003cspan>Ações coletivas organizadas que buscam defender interesses, identidades, direitos ou mudanças sociais.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Diretas Já\u003c/strong> — \u003cspan>Movimento de mobilização popular de 1983–1984 em defesa de eleições diretas para a Presidência da República.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-people\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"8\" cy=\"7\" r=\"3\">\u003c/circle>\u003ccircle cx=\"17\" cy=\"8\" r=\"2.5\">\u003c/circle>\u003cpath d=\"M2 21v-3a6 6 0 0 1 12 0v3H2zm12-8a5 5 0 0 1 8 4v4h-5\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> A redemocratização foi um processo de abertura controlada, mobilização social e negociação, e a memória dele é construída por arte, testemunho e documento.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Quais processos marcaram a transição da ditadura para a democracia no Brasil?\u003c/li>\u003cli>Como mobilização social e negociação institucional participaram da redemocratização?\u003c/li>\u003cli>Por que a redemocratização deve ser entendida como processo e não como um único acontecimento?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Ditadura e transição\u003c/dt>\u003cdd>Ditadura envolve concentração e restrição de participação e garantias; transição designa mudança de configuração institucional. Seus ritmos e efeitos podem ser diferentes.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Continuidade institucional\u003c/dt>\u003cdd>Persistência de atores, práticas ou estruturas durante mudanças. Sua presença não prova que nada mudou; exige indicar a dimensão analisada.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Fonte testemunhal\u003c/dt>\u003cdd>Relato de alguém sobre uma experiência situada. Tem valor histórico e precisa de contextualização, comparação e análise de sua produção.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">A transição apagou as instituições e práticas da ditadura?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Ditadura e redemocratização\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">O golpe de 1964 instalou no Brasil uma ditadura civil-militar que durou até 1985. O Ato Institucional nº 5 (AI-5), de dezembro de 1968, ampliou a censura, a repressão e o uso da tortura e suspendeu garantias e direitos políticos. Na segunda metade dos anos 1970, o governo iniciou uma abertura política 'lenta, gradual e segura', mas controlada pelos militares. Ao mesmo tempo, a sociedade se mobilizou: movimentos estudantis, sindicatos, imprensa alternativa, Igreja, mulheres e familiares de mortos e desaparecidos pediram anistia e eleições. A Anistia de 1979 e a campanha das Diretas Já (1983–1984) marcaram a transição; o governo civil de 1985 foi um marco, seguido por disputas constituintes e transformações institucionais. A memória desse período é construída por arte, testemunhos e documentos.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>O que foi o AI-5 e que efeitos teve, segundo o texto?\u003c/li>\u003cli>Em que sentido a abertura política foi 'controlada'?\u003c/li>\u003cli>Que grupos pressionaram pela redemocratização?\u003c/li>\u003cli>Diferencie obra artística, testemunho e documento como fontes para estudar a ditadura, com um exemplo de cada.\u003c/li>\u003cli>Use 'abertura política' e 'mobilização social' para explicar a transição para a democracia.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: o que um testemunho permite saber que um documento oficial não mostra, e o contrário?\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Câmara dos Deputados — 35 anos da Constituição Federal","u":"https://infograficos.camara.leg.br/35-anos-da-constituicao-federal/","n":"Fonte institucional: processo constituinte e participação popular."},{"t":"OpenStax — Introduction to Sociology 3e, 2.2 Research Methods","u":"https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods","n":"Manual universitário: desenho de pesquisa e limites da evidência."},{"t":"Memorial da Resistência — Coleta Regular de Testemunhos com recursos de acessibilidade","u":"https://memorialdaresistenciasp.org.br/percursos/acessibilidade-coleta-regular/","n":"Vídeos de depoimentos sobre resistência e ditadura, com legendas e Libras. São testemunhos situados, mediados por seleção e edição."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Crise do regime, movimentos sociais e Diretas Já. Abertura com Ainda Estou Aqui.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Ler, pensar e responder\u003c/h4>\u003cp>Uso de trechos de Ainda Estou Aqui como sensibilização. Depois, p. 384-385, relacionando mobilização social, Diretas Já e transição política.\u003c/p>\u003cp class=\"atividade-aluno\">Identifica sujeitos sociais envolvidos na redemocratização e diferencia abertura institucional de participação popular.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS602; EM13CHS605\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS605C / GO-EMCH605D\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">ditadura\u003c/span>\u003cspan class=\"concept-chip\">redemocratização\u003c/span>\u003cspan class=\"concept-chip\">movimentos sociais\u003c/span>\u003cspan class=\"concept-chip\">Diretas Já\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-scroll\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M7 4h13v15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1zm0 0v14a2 2 0 0 1-4 0M10 8h7M10 12h7M10 16h4\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-megaphone\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M3 10h5l11-6v16L8 14H3zM7 14l2 7h4l-3-6M21 9l2-1M21 14l2 1\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Ditadura e redemocratização\u003c/div>\u003cdiv class=\"registro-flow\">\u003cspan class=\"registro-node\">Ditadura\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Abertura política\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Mobilização social\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Diretas Já\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Redemocratização\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>ditadura\u003c/strong> — \u003cspan>Regime político marcado pela concentração de poder e pela restrição de liberdades, participação e garantias democráticas.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>redemocratização\u003c/strong> — \u003cspan>Processo de reconstrução de instituições e práticas democráticas após um período autoritário.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>movimentos sociais\u003c/strong> — \u003cspan>Ações coletivas organizadas que buscam defender interesses, identidades, direitos ou mudanças sociais.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Diretas Já\u003c/strong> — \u003cspan>Movimento de mobilização popular de 1983–1984 em defesa de eleições diretas para a Presidência da República.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-people\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"8\" cy=\"7\" r=\"3\">\u003c/circle>\u003ccircle cx=\"17\" cy=\"8\" r=\"2.5\">\u003c/circle>\u003cpath d=\"M2 21v-3a6 6 0 0 1 12 0v3H2zm12-8a5 5 0 0 1 8 4v4h-5\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> A redemocratização foi um processo de abertura controlada, mobilização social e negociação, e a memória dele é construída por arte, testemunho e documento.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Quais processos marcaram a transição da ditadura para a democracia no Brasil?\u003c/li>\u003cli>Como mobilização social e negociação institucional participaram da redemocratização?\u003c/li>\u003cli>Por que a redemocratização deve ser entendida como processo e não como um único acontecimento?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s3-historia-semana-1-glossary-title\">\u003ch4 id=\"s3-historia-semana-1-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Ditadura e transição\u003c/dt>\u003cdd>\u003cp>Ditadura envolve concentração e restrição de participação e garantias; transição designa mudança de configuração institucional. Seus ritmos e efeitos podem ser diferentes.\u003c/p>\u003c/dd>\u003cdt>Continuidade institucional\u003c/dt>\u003cdd>\u003cp>Persistência de atores, práticas ou estruturas durante mudanças. Sua presença não prova que nada mudou; exige indicar a dimensão analisada.\u003c/p>\u003c/dd>\u003cdt>Fonte testemunhal\u003c/dt>\u003cdd>\u003cp>Relato de alguém sobre uma experiência situada. Tem valor histórico e precisa de contextualização, comparação e análise de sua produção.\u003c/p>\u003c/dd>\u003cdt>ditadura\u003c/dt>\u003cdd>\u003cp>Regime político marcado pela concentração de poder e pela restrição de liberdades, participação e garantias democráticas.\u003c/p>\u003c/dd>\u003cdt>redemocratização\u003c/dt>\u003cdd>\u003cp>Processo de reconstrução de instituições e práticas democráticas após um período autoritário.\u003c/p>\u003c/dd>\u003cdt>movimentos sociais\u003c/dt>\u003cdd>\u003cp>Ações coletivas organizadas que buscam defender interesses, identidades, direitos ou mudanças sociais.\u003c/p>\u003c/dd>\u003cdt>Diretas Já\u003c/dt>\u003cdd>\u003cp>Movimento de mobilização popular de 1983–1984 em defesa de eleições diretas para a Presidência da República.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">3ª série · História · Semana 1\u003c/div>\u003ch4>DITADURA E REDEMOCRATIZAÇÃO\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>A redemocratização brasileira precisa ser estudada como processo de disputa entre abertura conduzida pelo regime, pressões sociais e reorganização institucional. Crise econômica, oposição política, novo sindicalismo, movimentos por anistia, associações comunitárias, movimento negro, feminismos e outras mobilizações ampliaram o espaço público nos anos 1970 e 1980.\u003c/p>\u003cp>A campanha Diretas Já tornou visível a pressão por eleições presidenciais diretas, mas a Emenda Dante de Oliveira não alcançou o quórum constitucional em 1984. A eleição de 1985 foi indireta. Esse encadeamento ajuda a evitar a narrativa de transição inevitável e linear.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s3-historia-semana-1-study-heading\">\u003ch4 id=\"s3-historia-semana-1-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Articule cronologia, ação coletiva e transformação institucional. O depoimento ilumina experiências; documentos administrativos e outras fontes podem corroborar ou tensionar sua interpretação.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Não reduza a transição a uma marcha inevitável rumo ao presente. Explicite alternativas e disputas conhecidas nas fontes.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Um arquivo fictício reúne um depoimento, uma notícia e uma norma produzidos sobre o mesmo evento.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>Pergunte quem produziu cada fonte, quando, para quem e com que alcance. Divergência não autoriza descartar automaticamente uma delas.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://infograficos.camara.leg.br/35-anos-da-constituicao-federal/\" target=\"_blank\" rel=\"noopener\">Câmara dos Deputados — 35 anos da Constituição Federal\u003c/a>\u003cp>Fonte institucional: processo constituinte e participação popular.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods\" target=\"_blank\" rel=\"noopener\">OpenStax — Introduction to Sociology 3e, 2.2 Research Methods\u003c/a>\u003cp>Manual universitário: desenho de pesquisa e limites da evidência.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">A palavra 'abertura' foi usada pelo próprio regime, mas diferentes atores disputavam seu ritmo e alcance; o vocabulário político também é parte da história.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Use o filme 'Ainda Estou Aqui' como porta de entrada para memória, família e repressão, distinguindo obra artística, testemunho e documentação histórica.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>A transição apagou as instituições e práticas da ditadura?\u003c/h5>\u003cp>A transição combinou mudanças de regime com continuidades; a permanência precisa ser demonstrada em práticas e instituições identificadas.\u003c/p>\u003cp>Limite da resposta: Não reduza a transição a uma marcha inevitável rumo ao presente. Explicite alternativas e disputas conhecidas nas fontes.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Ditadura e transição\u003c/dt>\u003cdd>Ditadura envolve concentração e restrição de participação e garantias; transição designa mudança de configuração institucional. Seus ritmos e efeitos podem ser diferentes.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Continuidade institucional\u003c/dt>\u003cdd>Persistência de atores, práticas ou estruturas durante mudanças. Sua presença não prova que nada mudou; exige indicar a dimensão analisada.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Fonte testemunhal\u003c/dt>\u003cdd>Relato de alguém sobre uma experiência situada. Tem valor histórico e precisa de contextualização, comparação e análise de sua produção.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">A transição apagou as instituições e práticas da ditadura?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Quem produziu a fonte, quando e para qual público? O que sua posição permite observar?\u003c/li>\u003cli>Como imagem, palavras, seleção e silêncios constroem a narrativa?\u003c/li>\u003cli>Que afirmação pode ser sustentada? Qual informação exige outra fonte independente?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Transição democrática e memória da ditadura\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-037\">\u003ch5>Vestibular USP · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Anistia de 1979 e impasses da abertura política\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: FUVEST · 1ª fase, questão 33 · V\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Reconstruir a transição democrática, distinguindo repressão, anistia e permanências institucionais.\u003c/p>\u003c/details>\u003ca href=\"https://www.fuvest.br/wp-content/uploads/fuvest_2017_1fase_prova_V.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-014\">\u003ch5>Enem — aplicação regular · 2016\u003c/h5>\u003cp class=\"ux-exam-theme\">Nova República: continuidades e rupturas na transição democrática\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 4 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Reconstruir a transição democrática, distinguindo repressão, anistia e permanências institucionais.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/dcb0d85d-5da4-48ee-b49a-e34db65c9c8b/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-034\">\u003ch5>Enem — aplicação regular · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Vladimir Herzog e mecanismos de repressão da ditadura\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 56 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Reconstruir a transição democrática, distinguindo repressão, anistia e permanências institucionais.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/6f6e6a08-9f0b-4365-9f52-a24c5e4ab2e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-055\">\u003ch5>PAS/UnB — 3ª etapa · 2024\u003c/h5>\u003cp class=\"ux-exam-theme\">AI-5, ditadura e censura das manifestações culturais\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Cebraspe · Itens 105 e 107 · PAS 3, parte geral, edital 2024\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Reconstruir a transição democrática, distinguindo repressão, anistia e permanências institucionais.\u003c/p>\u003cp>O conjunto é um registro temático; não é contagem de questões independentes.\u003c/p>\u003c/details>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/987_PAS3_001_01.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Confronte memória de participantes e fontes institucionais sobre ditadura e transição. Diferencie fim de um governo, mudança de regime e permanências autoritárias.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://infograficos.camara.leg.br/35-anos-da-constituicao-federal/\" target=\"_blank\" rel=\"noopener\">Câmara dos Deputados — 35 anos da Constituição Federal\u003c/a>\u003cp>Leitura prioritária para a explicação: Ditadura e transição; Continuidade institucional; Fonte testemunhal.\u003c/p>\u003cp>Fonte institucional: processo constituinte e participação popular.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://openstax.org/books/introduction-sociology-3e/pages/2-2-research-methods\" target=\"_blank\" rel=\"noopener\">OpenStax — Introduction to Sociology 3e, 2.2 Research Methods\u003c/a>\u003cp>Leitura complementar: Ditadura e transição; Continuidade institucional; Fonte testemunhal.\u003c/p>\u003cp>Manual universitário: desenho de pesquisa e limites da evidência.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://memorialdaresistenciasp.org.br/percursos/acessibilidade-coleta-regular/\" target=\"_blank\" rel=\"noopener\">Memorial da Resistência — Coleta Regular de Testemunhos com recursos de acessibilidade\u003c/a>\u003cp>Compare testemunho, contexto e documento institucional sobre ditadura. Diferencie experiência pessoal, edição do vídeo e explicação histórica.\u003c/p>\u003cp>Vídeos de depoimentos sobre resistência e ditadura, com legendas e Libras. São testemunhos situados, mediados por seleção e edição.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Retomar autoritarismo, abertura e reorganização social.\u003c/li>\u003cli>Diretas Já e limites institucionais.\u003c/li>\u003cli>1985-1988: transição civil e Constituinte.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não transformar redemocratização em simples concessão estatal nem em vitória de um único movimento.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Crise do regime + oposição institucional + movimentos sociais + abertura controlada -&gt; transição disputada -&gt; Constituinte.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: ato de 1968 que ampliou censura, repressão e tortura e suspendeu garantias e direitos políticos. Q2: o ritmo e os limites eram definidos pelo governo militar. Q3: movimentos estudantis, sindicatos, imprensa alternativa, Igreja, mulheres, familiares de mortos e desaparecidos. Q4: obra artística (por exemplo, um filme) expressa e interpreta; testemunho é relato de quem viveu; documento é registro produzido na época (decreto, relatório). Q5: o governo controlou o ritmo da abertura, enquanto a sociedade pressionou por anistia e eleições. Q6: cada fonte tem alcance e limites; critério: distinguir tipo de fonte.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Constituição de 1988 e participação popular\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-026\">\u003ch5>Enem — aplicação regular · 2019\u003c/h5>\u003cp class=\"ux-exam-theme\">SUS, Constituição de 1988 e características das políticas públicas\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 88 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Relacionar o texto constitucional à participação social, aos direitos e à limitação do poder estatal.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/ef59158b-11f9-4bf7-a9fc-64d801cd06e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-056\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Participação indígena na Constituição de 1988 e após a redemocratização\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · História discursiva, questão 3, itens A/B · Humanas, 2º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Relacionar o texto constitucional à participação social, aos direitos e à limitação do poder estatal.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003c/details>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-031\">\u003ch5>Enem — aplicação regular · 2022\u003c/h5>\u003cp class=\"ux-exam-theme\">Estado de direito e limites ao exercício do poder\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 88 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Relacionar o texto constitucional à participação social, aos direitos e à limitação do poder estatal.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/7d656252-c499-42dc-93c9-ea825cce7a0e/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-006\">\u003ch5>Enem — aplicação regular · 2021\u003c/h5>\u003cp class=\"ux-exam-theme\">Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>O registro civil relaciona-se ao exercício da cidadania e ajuda a comparar direitos e acesso. A proposta não cobra o processo histórico da Constituinte.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/0ec029ac-140b-424a-9c62-f96095c25d3c/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s3-historia-semana-2","title":"CONSTITUIÇÃO DE 1988","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-scroll\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M7 4h13v15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1zm0 0v14a2 2 0 0 1-4 0M10 8h7M10 12h7M10 16h4\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-scale\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M12 3v18M5 21h14M6 7h12M12 3c1 2 3 3 5 4M12 3c-1 2-3 3-5 4M6 8l-4 7h8L6 8zm12 0-4 7h8l-4-7z\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Constituição de 1988\u003c/div>\u003ctable class=\"registro-tabela\">\u003ctbody>\u003ctr>\u003cth>Ideia\u003c/th>\u003cth>Em poucas palavras\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Constituição de 1988\u003c/td>\u003ctd>Constituição brasileira promulgada em 1988, que reorganizou instituições democráticas e ampliou o reconhecimento de direitos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cidadania\u003c/td>\u003ctd>Condição de participação na vida social e política associada ao exercício de direitos e deveres.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>democracia\u003c/td>\u003ctd>Forma de organização política baseada em participação, direitos, pluralismo, representação e regras de disputa pelo poder.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Direitos Humanos\u003c/td>\u003ctd>Direitos atribuídos a todas as pessoas com base em dignidade, liberdade, igualdade e proteção contra abusos.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-book\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M12 6c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1zm0 0v15\">\u003c/path>\u003cpath d=\"M4 8h5m-5 3h5m6-3h5m-5 3h5\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> A Constituição de 1988 reorganizou as instituições democráticas e ampliou direitos civis, políticos e sociais, mas sua efetivação depende de participação e de políticas públicas.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Quais direitos foram ampliados ou reorganizados pela Constituição de 1988?\u003c/li>\u003cli>Como a Constituição relaciona cidadania, participação e deveres do Estado?\u003c/li>\u003cli>Por que a existência de direitos constitucionais não elimina automaticamente desigualdades sociais?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Constituinte e Constituição\u003c/dt>\u003cdd>Constituinte é processo e órgão de elaboração; Constituição é o texto resultante, submetido a interpretação e mudanças sob regras próprias.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Participação e representação\u003c/dt>\u003cdd>Participação envolve intervenção de pessoas e grupos; representação envolve atuação em nome de outros sob formas institucionais. Podem complementar-se e entrar em tensão.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Compromisso constitucional\u003c/dt>\u003cdd>Resultado de negociação entre projetos, não prova de ausência de conflito.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">A Constituição expressa a vontade de um único grupo?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Constituição de 1988 e cidadania\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">A Constituição de 1988, promulgada em 5 de outubro, foi elaborada por uma Assembleia Nacional Constituinte eleita em 1986, com participação de movimentos sociais, entidades e cidadãos. Chamada de 'Constituição Cidadã', consolidou regras democráticas, eleições e liberdades; ampliou direitos civis (como a liberdade de expressão), políticos (como o voto facultativo aos 16 anos e obrigatório para a maioria dos adultos) e sociais (como saúde, educação e trabalho); definiu o racismo como crime inafiançável e imprescritível; e reconheceu direitos de povos indígenas e quilombolas. Também criou instrumentos de participação, como plebiscito, referendo e iniciativa popular de leis. Mas direitos escritos dependem de políticas públicas e de quem os exige.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Como a Constituição foi elaborada e por que é chamada de 'Cidadã'?\u003c/li>\u003cli>Cite um direito civil, um político e um social garantidos por ela, segundo o texto.\u003c/li>\u003cli>Que instrumentos de participação ela criou?\u003c/li>\u003cli>Consulte o texto da Constituição (o link está na aula), copie dois incisos do artigo 5º e explique com suas palavras o que cada um protege.\u003c/li>\u003cli>Use 'direitos civis' e 'efetivação' para explicar por que um direito escrito pode não ser exercido.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: 38 anos depois, o que a Constituição já garantiu e o que ainda depende de participação social?\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Constituição da República Federativa do Brasil de 1988 (texto compilado, Planalto)","u":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","n":""},{"t":"Câmara dos Deputados — 35 anos da Constituição Federal","u":"https://infograficos.camara.leg.br/35-anos-da-constituicao-federal/","n":"Fonte institucional: processo constituinte e participação popular."},{"t":"TV Câmara — Anna Maria Rattes: A conquista dos direitos da mulheres (20/08/2008)","u":"https://www.camara.leg.br/tv/191357-anna-maria-rattes-a-conquista-dos-direitos-da-mulheres/","n":"Vídeo institucional do Diário da Constituinte: registro e depoimento retrospectivo. Considere a data do depoimento e o papel da entrevistada."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Cidadania, democracia e Direitos Humanos.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Leitura guiada\u003c/h4>\u003cp>Uso das p. 386-389. A Constituição de 1988 é trabalhada como marco jurídico-institucional da redemocratização e da ampliação de direitos e garantias.\u003c/p>\u003cp class=\"atividade-aluno\">Classifica exemplos em direitos civis, políticos e sociais e identifica grupos que participaram das lutas pela ampliação de direitos.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS605; EM13CHS601\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCH605D — central\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">Constituição de 1988\u003c/span>\u003cspan class=\"concept-chip\">cidadania\u003c/span>\u003cspan class=\"concept-chip\">democracia\u003c/span>\u003cspan class=\"concept-chip\">Direitos Humanos\u003c/span>\u003c/div>\u003cdiv class=\"concept-definitions\">\u003cdiv class=\"concept-definitions-title\">Vocabulário da aula\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>Constituição de 1988 — \u003c/strong>Constituição brasileira promulgada em 1988, que reorganizou instituições democráticas e ampliou o reconhecimento de direitos.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>cidadania — \u003c/strong>Condição de participação na vida social e política associada ao exercício de direitos e deveres.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>democracia — \u003c/strong>Forma de organização política baseada em participação, direitos, pluralismo, representação e regras de disputa pelo poder.\u003c/div>\u003cdiv class=\"concept-definition-item\">\u003cstrong>Direitos Humanos — \u003c/strong>Direitos atribuídos a todas as pessoas com base em dignidade, liberdade, igualdade e proteção contra abusos.\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-scroll\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M7 4h13v15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1zm0 0v14a2 2 0 0 1-4 0M10 8h7M10 12h7M10 16h4\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-scale\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M12 3v18M5 21h14M6 7h12M12 3c1 2 3 3 5 4M12 3c-1 2-3 3-5 4M6 8l-4 7h8L6 8zm12 0-4 7h8l-4-7z\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Constituição de 1988\u003c/div>\u003ctable class=\"registro-tabela\">\u003ctbody>\u003ctr>\u003cth>Ideia\u003c/th>\u003cth>Em poucas palavras\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Constituição de 1988\u003c/td>\u003ctd>Constituição brasileira promulgada em 1988, que reorganizou instituições democráticas e ampliou o reconhecimento de direitos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cidadania\u003c/td>\u003ctd>Condição de participação na vida social e política associada ao exercício de direitos e deveres.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>democracia\u003c/td>\u003ctd>Forma de organização política baseada em participação, direitos, pluralismo, representação e regras de disputa pelo poder.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Direitos Humanos\u003c/td>\u003ctd>Direitos atribuídos a todas as pessoas com base em dignidade, liberdade, igualdade e proteção contra abusos.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-book\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M12 6c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1zm0 0v15\">\u003c/path>\u003cpath d=\"M4 8h5m-5 3h5m6-3h5m-5 3h5\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> A Constituição de 1988 reorganizou as instituições democráticas e ampliou direitos civis, políticos e sociais, mas sua efetivação depende de participação e de políticas públicas.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Quais direitos foram ampliados ou reorganizados pela Constituição de 1988?\u003c/li>\u003cli>Como a Constituição relaciona cidadania, participação e deveres do Estado?\u003c/li>\u003cli>Por que a existência de direitos constitucionais não elimina automaticamente desigualdades sociais?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s3-historia-semana-2-glossary-title\">\u003ch4 id=\"s3-historia-semana-2-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Constituinte e Constituição\u003c/dt>\u003cdd>\u003cp>Constituinte é processo e órgão de elaboração; Constituição é o texto resultante, submetido a interpretação e mudanças sob regras próprias.\u003c/p>\u003c/dd>\u003cdt>Participação e representação\u003c/dt>\u003cdd>\u003cp>Participação envolve intervenção de pessoas e grupos; representação envolve atuação em nome de outros sob formas institucionais. Podem complementar-se e entrar em tensão.\u003c/p>\u003c/dd>\u003cdt>Compromisso constitucional\u003c/dt>\u003cdd>\u003cp>Resultado de negociação entre projetos, não prova de ausência de conflito.\u003c/p>\u003c/dd>\u003cdt>Constituição de 1988\u003c/dt>\u003cdd>\u003cp>Constituição brasileira promulgada em 1988, que reorganizou instituições democráticas e ampliou o reconhecimento de direitos.\u003c/p>\u003c/dd>\u003cdt>cidadania\u003c/dt>\u003cdd>\u003cp>Condição de participação na vida social e política associada ao exercício de direitos e deveres.\u003c/p>\u003c/dd>\u003cdt>democracia\u003c/dt>\u003cdd>\u003cp>Forma de organização política baseada em participação, direitos, pluralismo, representação e regras de disputa pelo poder.\u003c/p>\u003c/dd>\u003cdt>Direitos Humanos\u003c/dt>\u003cdd>\u003cp>Direitos atribuídos a todas as pessoas com base em dignidade, liberdade, igualdade e proteção contra abusos.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">3ª série · História · Semana 2\u003c/div>\u003ch4>CONSTITUIÇÃO DE 1988\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>A Constituição de 1988 reorganizou instituições democráticas e ampliou o reconhecimento de direitos civis, políticos, sociais e coletivos. Sua elaboração teve intensa participação social, registrada em audiências, cartas, emendas populares e presença de movimentos organizados.\u003c/p>\u003cp>O texto constitucional deve ser lido em duas dimensões: norma e processo histórico. Direitos indígenas, igualdade entre homens e mulheres, direitos sociais, proteção contra discriminação e instrumentos de participação foram objeto de disputas concretas. Reconhecimento jurídico, porém, não equivale a efetivação automática.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s3-historia-semana-2-study-heading\">\u003ch4 id=\"s3-historia-semana-2-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Leia o processo junto ao texto: propostas, emendas, organizações e decisões. A Câmara documenta formas de participação; identifique o que uma fonte mostra e quais vozes deixa de registrar.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Um dispositivo não explica sozinho sua implementação. Para discussão jurídica concreta, consulte redação vigente e interpretação pertinente.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Uma assembleia fictícia aprova um texto após negociar demandas parcialmente divergentes.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>Compare proposta inicial, alteração e resultado; o texto
