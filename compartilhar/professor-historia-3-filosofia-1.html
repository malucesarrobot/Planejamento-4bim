003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Analisar como o capitalismo globalizado modifica relações de trabalho; distinguir organização econômica de suas justificações ideológicas.\u003c/p>\u003c/details>\u003ca href=\"https://www.fuvest.br/wp-content/uploads/fuvest2023_primeira_fase_prova_V.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-057\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Ricardo Antunes: proletariado de serviços e uberização do trabalho\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · História discursiva, questão 4, itens A/B · Humanas, 2º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Analisar como o capitalismo globalizado modifica relações de trabalho; distinguir organização econômica de suas justificações ideológicas.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003c/details>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-058\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Karl Marx: capitalismo, classes, mercadorias e relação com a natureza\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · Sociologia discursiva, questão 2 · Humanas, 1º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Analisar como o capitalismo globalizado modifica relações de trabalho; distinguir organização econômica de suas justificações ideológicas.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003c/details>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-1.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-008\">\u003ch5>Enem — aplicação regular · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para o enfrentamento da invisibilidade do trabalho de cuidado realizado pela mulher no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>O trabalho de cuidado permite discutir divisão e reconhecimento do trabalho. A proposta não exige neoliberalismo como causa nem fornece um diagnóstico causal pronto.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/6f6e6a08-9f0b-4365-9f52-a24c5e4ab2e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s3-historia-semana-5","title":"NEOLIBERALISMO E GLOBALIZAÇÃO","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-earth\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M2 12h20M12 2c-6 6-6 14 0 20M12 2c6 6 6 14 0 20M4 7h16M4 17h16\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-coins\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cellipse cx=\"8\" cy=\"7\" rx=\"6\" ry=\"3\">\u003c/ellipse>\u003cpath d=\"M2 7v5c0 2 3 3 6 3s6-1 6-3V7M2 12v5c0 2 3 3 6 3s6-1 6-3v-5M14 9c4 0 8 1 8 3v5c0 2-3 3-7 3\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Neoliberalismo e globalização\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>neoliberalismo\u003c/strong> — \u003cspan>Corrente de pensamento e conjunto variável de políticas que enfatizam mercados, concorrência e redução ou redefinição de funções econômicas do Estado.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>globalização\u003c/strong> — \u003cspan>Intensificação de fluxos econômicos, tecnológicos, culturais e políticos em escala mundial.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>mundo do trabalho\u003c/strong> — \u003cspan>Conjunto de relações, instituições, tecnologias e experiências ligadas às atividades de trabalho.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>desigualdades\u003c/strong> — \u003cspan>Diferenças sociais que se tornam hierárquicas quando produzem acesso desigual a recursos, direitos e oportunidades.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-trend\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M3 19V5m0 14h18M6 15l5-5 4 3 6-7m-4 0h4v4\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> Neoliberalismo e globalização reorganizaram mercados, Estados e trabalho, com efeitos desiguais entre países e grupos sociais.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 382\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que caracteriza políticas associadas ao neoliberalismo?\u003c/li>\u003cli>Como globalização econômica alterou relações entre Estados, empresas e trabalhadores?\u003c/li>\u003cli>Que efeitos distintos essas transformações podem produzir entre grupos sociais e países?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Neoliberalismo\u003c/dt>\u003cdd>Termo disputado para doutrinas e projetos que atribuem papel central a mercados e formas de competição. Seu uso histórico exige identificar políticas, instituições e variantes.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Globalização\u003c/dt>\u003cdd>Intensificação e transformação de conexões transnacionais em diferentes dimensões. Não é sinônimo de uma única política econômica.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Desregulação e re-regulação\u003c/dt>\u003cdd>Remover certas regras pode coexistir com criar outras. Menor intervenção em uma área não significa ausência total de ação estatal.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Globalização e neoliberalismo são sinônimos?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Neoliberalismo e globalização\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">A partir dos anos 1970 e 1980, a crise do Estado de bem-estar e o governo de líderes como Margaret Thatcher, no Reino Unido, e Ronald Reagan, nos Estados Unidos, difundiram o neoliberalismo: ideias de reduzir o papel do Estado na economia, privatizar empresas, abrir o comércio e diminuir a regulação. A globalização é o processo de intensificação das conexões econômicas, tecnológicas e culturais entre países, impulsionado por transportes, telecomunicações, finanças e empresas multinacionais. As cadeias produtivas passaram a se espalhar por vários países, o que transformou o mundo do trabalho, com terceirização e precarização em muitos casos. Os efeitos foram desiguais: alguns países, empresas e grupos ganharam muito; outros ficaram com salários baixos e menos proteção.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>O que é neoliberalismo, segundo o texto?\u003c/li>\u003cli>O que é globalização e o que a impulsionou?\u003c/li>\u003cli>Que efeitos sobre o trabalho o texto cita?\u003c/li>\u003cli>Escolha um objeto do seu dia (celular, tênis ou camiseta) e trace uma cadeia possível: matérias-primas, montagem e venda, indicando quem ganha mais e quem ganha menos (pode ser uma hipótese pesquisada).\u003c/li>\u003cli>Use 'mercado' e 'desigualdade internacional' para explicar por que os efeitos da globalização são desiguais.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: neoliberalismo e globalização são a mesma coisa? Distinga os dois.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Stanford Encyclopedia of Philosophy — Neoliberalism","u":"https://plato.stanford.edu/entries/neoliberalism/index.html","n":"Referência conceitual: termo disputado e diversidade de formulações."},{"t":"Stanford Encyclopedia of Philosophy — Globalization","u":"https://plato.stanford.edu/entries/globalization/","n":"Referência conceitual: conexões transnacionais e divergências explicativas."},{"t":"Jorge Furtado — Ilha das Flores (1989), Casa de Cinema de Porto Alegre","u":"https://arquivo.casacinepoa.com.br/site_antigo/port/filmes/ilhadasf.htm","n":"Filme e roteiro: página da produtora com ficha e textos. Acesso ao filme pode depender de plataforma; a página não garante exibição integral gratuita."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Transformações econômicas, sociais e do mundo do trabalho.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Ler, pensar e responder\u003c/h4>\u003cp>Retomada do capítulo Mundo globalizado, especialmente p. 362-363, fechando com p. 382, atividade 1. O foco é compreender conceitos e impactos econômicos, sociais e internacionais.\u003c/p>\u003cp class=\"atividade-aluno\">Resolve a atividade e compara globalização, neoliberalismo e desigualdade internacional.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS201; EM13CHS401; EM13CHS402\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCH605D — articulação com a habilidade central da 3ª série\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">neoliberalismo\u003c/span>\u003cspan class=\"concept-chip\">globalização\u003c/span>\u003cspan class=\"concept-chip\">mundo do trabalho\u003c/span>\u003cspan class=\"concept-chip\">desigualdades\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-earth\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M2 12h20M12 2c-6 6-6 14 0 20M12 2c6 6 6 14 0 20M4 7h16M4 17h16\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-coins\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cellipse cx=\"8\" cy=\"7\" rx=\"6\" ry=\"3\">\u003c/ellipse>\u003cpath d=\"M2 7v5c0 2 3 3 6 3s6-1 6-3V7M2 12v5c0 2 3 3 6 3s6-1 6-3v-5M14 9c4 0 8 1 8 3v5c0 2-3 3-7 3\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Neoliberalismo e globalização\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>neoliberalismo\u003c/strong> — \u003cspan>Corrente de pensamento e conjunto variável de políticas que enfatizam mercados, concorrência e redução ou redefinição de funções econômicas do Estado.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>globalização\u003c/strong> — \u003cspan>Intensificação de fluxos econômicos, tecnológicos, culturais e políticos em escala mundial.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>mundo do trabalho\u003c/strong> — \u003cspan>Conjunto de relações, instituições, tecnologias e experiências ligadas às atividades de trabalho.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>desigualdades\u003c/strong> — \u003cspan>Diferenças sociais que se tornam hierárquicas quando produzem acesso desigual a recursos, direitos e oportunidades.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-trend\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003cpath d=\"M3 19V5m0 14h18M6 15l5-5 4 3 6-7m-4 0h4v4\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> Neoliberalismo e globalização reorganizaram mercados, Estados e trabalho, com efeitos desiguais entre países e grupos sociais.\u003c/p>\u003c/div>\u003cdiv class=\"book-activity\">p. 382\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que caracteriza políticas associadas ao neoliberalismo?\u003c/li>\u003cli>Como globalização econômica alterou relações entre Estados, empresas e trabalhadores?\u003c/li>\u003cli>Que efeitos distintos essas transformações podem produzir entre grupos sociais e países?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s3-historia-semana-5-glossary-title\">\u003ch4 id=\"s3-historia-semana-5-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Neoliberalismo\u003c/dt>\u003cdd>\u003cp>Termo disputado para doutrinas e projetos que atribuem papel central a mercados e formas de competição. Seu uso histórico exige identificar políticas, instituições e variantes.\u003c/p>\u003c/dd>\u003cdt>Globalização\u003c/dt>\u003cdd>\u003cp>Intensificação e transformação de conexões transnacionais em diferentes dimensões. Não é sinônimo de uma única política econômica.\u003c/p>\u003c/dd>\u003cdt>Desregulação e re-regulação\u003c/dt>\u003cdd>\u003cp>Remover certas regras pode coexistir com criar outras. Menor intervenção em uma área não significa ausência total de ação estatal.\u003c/p>\u003c/dd>\u003cdt>mundo do trabalho\u003c/dt>\u003cdd>\u003cp>Conjunto de relações, instituições, tecnologias e experiências ligadas às atividades de trabalho.\u003c/p>\u003c/dd>\u003cdt>desigualdades\u003c/dt>\u003cdd>\u003cp>Diferenças sociais que se tornam hierárquicas quando produzem acesso desigual a recursos, direitos e oportunidades.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">3ª série · História · Semana 5\u003c/div>\u003ch4>NEOLIBERALISMO E GLOBALIZAÇÃO\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Neoliberalismo é termo disputado que costuma designar ideias e políticas favoráveis à liberalização de mercados, privatizações, disciplina fiscal e redefinição da intervenção estatal. Ele não deve ser usado como rótulo para qualquer política de mercado nem como explicação total do período.\u003c/p>\u003cp>Globalização descreve intensificação de fluxos de capital, mercadorias, informação, tecnologia e produção em escala transnacional. Cadeias globais de valor e mudanças tecnológicas alteraram o mundo do trabalho, mas efeitos variam por país, setor e grupo social. Na América Latina, reformas dos anos 1980-1990 dialogaram com crise da dívida e organismos internacionais.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s3-historia-semana-5-study-heading\">\u003ch4 id=\"s3-historia-semana-5-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Separe escala de circulação, projeto político e mudança regulatória. Compare propostas e implementação. Examine efeitos sobre trabalho com indicadores e recorte temporal, evitando que o rótulo explique sozinho qualquer resultado.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Não trate todas as formas de integração internacional como neoliberais, nem suponha que uma mesma reforma tenha efeitos iguais em todos os contextos.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Um país fictício amplia trocas externas e, ao mesmo tempo, reforça uma proteção social.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>O exemplo separa conexão internacional e escolha regulatória; não demonstra o sucesso de uma política real.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/neoliberalism/index.html\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Neoliberalism\u003c/a>\u003cp>Referência conceitual: termo disputado e diversidade de formulações.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/globalization/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Globalization\u003c/a>\u003cp>Referência conceitual: conexões transnacionais e divergências explicativas.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Um produto simples pode envolver projeto num país, minerais de outro, montagem em outro e venda global; a etiqueta raramente mostra toda a cadeia.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Reconstrua a cadeia de um objeto cotidiano para discutir globalização sem depender de marcas específicas.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Globalização e neoliberalismo são sinônimos?\u003c/h5>\u003cp>Globalização se refere a conexões e fluxos; neoliberalismo, a orientações de organização econômica e política. Podem se articular sem serem idênticos.\u003c/p>\u003cp>Limite da resposta: Não trate todas as formas de integração internacional como neoliberais, nem suponha que uma mesma reforma tenha efeitos iguais em todos os contextos.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Neoliberalismo\u003c/dt>\u003cdd>Termo disputado para doutrinas e projetos que atribuem papel central a mercados e formas de competição. Seu uso histórico exige identificar políticas, instituições e variantes.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Globalização\u003c/dt>\u003cdd>Intensificação e transformação de conexões transnacionais em diferentes dimensões. Não é sinônimo de uma única política econômica.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Desregulação e re-regulação\u003c/dt>\u003cdd>Remover certas regras pode coexistir com criar outras. Menor intervenção em uma área não significa ausência total de ação estatal.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Globalização e neoliberalismo são sinônimos?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Quem produziu a fonte, quando e para qual público? O que sua posição permite observar?\u003c/li>\u003cli>Como imagem, palavras, seleção e silêncios constroem a narrativa?\u003c/li>\u003cli>Que afirmação pode ser sustentada? Qual informação exige outra fonte independente?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Globalização e neoliberalismo\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-040\">\u003ch5>Vestibular USP · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Relações de trabalho e uso ideológico do termo colaborador\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: FUVEST · 1ª fase, questão 5 · V\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Analisar como o capitalismo globalizado modifica relações de trabalho; distinguir organização econômica de suas justificações ideológicas.\u003c/p>\u003c/details>\u003ca href=\"https://www.fuvest.br/wp-content/uploads/fuvest2023_primeira_fase_prova_V.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-057\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Ricardo Antunes: proletariado de serviços e uberização do trabalho\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · História discursiva, questão 4, itens A/B · Humanas, 2º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Analisar como o capitalismo globalizado modifica relações de trabalho; distinguir organização econômica de suas justificações ideológicas.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003c/details>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-2.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-058\">\u003ch5>PISM/UFJF — módulo III · 2025\u003c/h5>\u003cp class=\"ux-exam-theme\">Karl Marx: capitalismo, classes, mercadorias e relação com a natureza\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: COPESE/UFJF · Sociologia discursiva, questão 2 · Humanas, 1º dia\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Analisar como o capitalismo globalizado modifica relações de trabalho; distinguir organização econômica de suas justificações ideológicas.\u003c/p>\u003cp>Edição 2025, aplicada em 14 e 15 de dezembro de 2024.\u003c/p>\u003c/details>\u003ca href=\"https://www2.ufjf.br/copese/wp-content/uploads/sites/42/2024/12/Pism-3-Humanas-Dia-1.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-008\">\u003ch5>Enem — aplicação regular · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para o enfrentamento da invisibilidade do trabalho de cuidado realizado pela mulher no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>O trabalho de cuidado permite discutir divisão e reconhecimento do trabalho. A proposta não exige neoliberalismo como causa nem fornece um diagnóstico causal pronto.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/6f6e6a08-9f0b-4365-9f52-a24c5e4ab2e7/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Diferencie globalização, neoliberalismo e formas de organização do trabalho. Use a representação cinematográfica como pergunta para pesquisa, não como prova estatística.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/neoliberalism/index.html\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Neoliberalism\u003c/a>\u003cp>Leitura prioritária para a explicação: Neoliberalismo; Globalização; Desregulação e re-regulação.\u003c/p>\u003cp>Referência conceitual: termo disputado e diversidade de formulações.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/globalization/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Globalization\u003c/a>\u003cp>Leitura complementar: Neoliberalismo; Globalização; Desregulação e re-regulação.\u003c/p>\u003cp>Referência conceitual: conexões transnacionais e divergências explicativas.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://arquivo.casacinepoa.com.br/site_antigo/port/filmes/ilhadasf.htm\" target=\"_blank\" rel=\"noopener\">Jorge Furtado — Ilha das Flores (1989), Casa de Cinema de Porto Alegre\u003c/a>\u003cp>Use a circulação de mercadorias e a hierarquia de acesso como problematização. O filme não define neoliberalismo nem mede por si a globalização.\u003c/p>\u003cp>Filme e roteiro: página da produtora com ficha e textos. Acesso ao filme pode depender de plataforma; a página não garante exibição integral gratuita.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Definir globalização por fluxos e cadeias.\u003c/li>\u003cli>Apresentar neoliberalismo como conjunto variável de ideias e políticas.\u003c/li>\u003cli>Analisar efeitos sobre trabalho e proteção social, comparando países.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não tratar neoliberalismo como palavra-curinga moralmente autoexplicativa.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Globalização -&gt; fluxos/cadeias/tecnologia. Neoliberalismo -&gt; reformas específicas. Efeitos -&gt; trabalho, Estado social, desigualdade; variam por contexto.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: ideias de reduzir o papel do Estado, privatizar, abrir o comércio e reduzir a regulação. Q2: intensificação das conexões econômicas, tecnológicas e culturais entre países; impulsionada por transportes, telecomunicações, finanças e multinacionais. Q3: terceirização e precarização em muitos casos. Q4: cadeia coerente com hipótese ou pesquisa. Q5: ganhos e perdas dependem da posição de países, empresas e grupos no mercado. Q6: neoliberalismo é um conjunto de ideias e políticas; globalização é um processo de conexão; um pode favorecer o outro.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"},{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Geopolítica, multipolaridade e cooperação Sul-Sul\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-052\">\u003ch5>PAS/UnB — 3ª etapa · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Brasil, BRICS e liderança no Sul Global\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Cebraspe · Item 68 · PAS 3, parte geral, edital 2023\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Comparar a posição brasileira no Sul Global com relações de poder na ordem internacional; situar cada afirmação no ano da prova.\u003c/p>\u003cp>O conjunto é um registro temático; não é contagem de questões independentes.\u003c/p>\u003c/details>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/884_PAS3_001_01.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-021\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Poder dos Estados Unidos na ordem pós-soviética\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 82 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Comparar a posição brasileira no Sul Global com relações de poder na ordem internacional; situar cada afirmação no ano da prova.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s3-historia-semana-6","title":"BRASIL E SUL GLOBAL NA NOVA ORDEM MUNDIAL","quadro":"\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-globe\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M3 9l5-2 2-4 4 2-1 4 4 2 3-1m-9 2 3 4-2 5M5 17l4-1\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-handshake\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M2 8 7 5l5 4 4-4 6 4-5 10-5-3-4 3L2 8zm5-3 3-2 5 2m-3 4 4 3m-6 2 5 3\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Brasil e Sul Global na nova ordem mundial\u003c/div>\u003cdiv class=\"registro-flow\">\u003cspan class=\"registro-node\">BRICS\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Sul Global\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">multipolaridade\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">cooperação Sul-Sul\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>BRICS\u003c/strong> — \u003cspan>Fórum de cooperação entre grandes economias emergentes, cuja composição pode se ampliar ao longo do tempo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Sul Global\u003c/strong> — \u003cspan>Categoria política e econômica heterogênea usada para discutir países e sociedades marcados por experiências de colonialismo, dependência ou posição periférica no sistema mundial.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>multipolaridade\u003c/strong> — \u003cspan>Distribuição do poder internacional entre vários centros ou polos relevantes.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>cooperação Sul-Sul\u003c/strong> — \u003cspan>Cooperação entre países do Sul Global em áreas como desenvolvimento, ciência, comércio, tecnologia e diplomacia.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-earth\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M2 12h20M12 2c-6 6-6 14 0 20M12 2c6 6 6 14 0 20M4 7h16M4 17h16\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> O BRICS é um fórum de cooperação entre economias emergentes; o Sul Global é uma categoria heterogênea, e dependência, multipolaridade e cooperação Sul-Sul são conceitos distintos.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que significa situar o Brasil no chamado Sul Global?\u003c/li>\u003cli>Como relações econômicas e políticas internacionais reproduzem assimetrias entre países?\u003c/li>\u003cli>Que estratégias de cooperação entre países do Sul Global podem ampliar autonomia e capacidade de negociação?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Sul Global\u003c/dt>\u003cdd>Categoria político-histórica relacionada a desigualdades e posições na ordem internacional. Não é a lista de países do hemisfério sul nem uma identidade homogênea.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Multipolaridade\u003c/dt>\u003cdd>Distribuição de capacidades e influência entre vários polos. Não implica automaticamente igualdade, paz ou justiça.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Cooperação Sul-Sul\u003c/dt>\u003cdd>Relações de cooperação entre países assim situados. Não elimina assimetrias de recursos e interesses.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Os BRICS têm um projeto único e eliminam as desigualdades globais?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Brasil, BRICS e Sul Global na nova ordem mundial\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">O BRICS é um fórum de cooperação entre economias emergentes. Começou em 2009 com Brasil, Rússia, Índia e China, e a África do Sul foi incorporada entre 2010 e 2011. Nos últimos anos, outros países passaram a integrar o grupo, e a lista de membros deve ser conferida em fontes oficiais, porque muda. Em 2026, a Índia preside o BRICS. O grupo discute comércio, finanças, desenvolvimento e a reforma de organismos internacionais. O Sul Global é uma expressão que designa países com experiências de colonialismo, dependência econômica ou posição periférica, mas é uma categoria heterogênea, pois seus países têm interesses diferentes. Multipolaridade é a distribuição do poder entre vários centros, e cooperação Sul-Sul é a cooperação entre países em desenvolvimento.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>O que é o BRICS e que temas o grupo discute?\u003c/li>\u003cli>Quais foram os países que iniciaram o grupo?\u003c/li>\u003cli>O que significa 'Sul Global' e por que a categoria é heterogênea?\u003c/li>\u003cli>Em um mapa-múndi, destaque Brasil, Rússia, Índia, China e África do Sul e indique uma diferença de interesse entre dois deles.\u003c/li>\u003cli>Use 'multipolaridade' e 'cooperação Sul-Sul' para explicar por que o BRICS interessa ao Brasil.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas: o BRICS representa todo o Sul Global? Justifique.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"Brasil de Fato: Índia assume a presidência do BRICS (05/01/2026)","u":"https://www.brasildefato.com.br/2026/01/05/india-assume-oficialmente-presidencia-do-brics-com-agenda-voltada-ao-sul-global/","n":""},{"t":"Planalto: Brasil anuncia a Indonésia como membro pleno do BRICS (06/01/2025, em inglês)","u":"https://www.gov.br/planalto/en/latest-news/2025/01/brazil-announces-indonesia-as-full-member-of-brics","n":""},{"t":"Itamaraty: Indonésia como novo membro do BRICS (06/01/2025, em inglês)","u":"https://www.gov.br/mre/en/contact-us/press-area/press-releases/indonesia-as-a-new-member-of-brics","n":""},{"t":"Presidência brasileira do BRICS — Sobre o BRICS","u":"https://brics.br/pt-br/sobre-o-brics","n":"Fonte oficial: composição e modalidades de participação; conferir na data da aula."},{"t":"Stanford Encyclopedia of Philosophy — Globalization","u":"https://plato.stanford.edu/entries/globalization/","n":"Referência conceitual: conexões transnacionais e divergências explicativas."},{"t":"UNESCO — História Geral da África, coleção e recursos audiovisuais","u":"https://www.unesco.org/pt/general-history-africa","n":"Coleção acadêmica com volumes e link para série audiovisual da BBC. Verifique idioma e legendas de cada vídeo; a indicação da coleção não afirma que todos estejam em português."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\n\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>BRICS, multipolaridade, relações Sul-Sul, dependência e desigualdades internacionais.\u003c/p>\u003c/section>\n\u003csection class=\"wide\">\u003ch4>Ler imagens e mapas\u003c/h4>\u003cp>Aula de atualização e síntese internacional. O BRICS entra como estudo de caso para compreender cooperação Sul-Sul, multipolaridade e a posição do Brasil nas transformações da ordem mundial.\u003c/p>\u003cp class=\"atividade-aluno\">Localiza os membros em mapa, identifica objetivos de cooperação e discute Sul Global, multipolaridade e assimetrias do sistema internacional.\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS201; EM13CHS204; EM13CHS604\u003c/p>\u003c/section>\n\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">Articulação contemporânea\u003c/p>\u003c/section>\n\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">BRICS\u003c/span>\u003cspan class=\"concept-chip\">Sul Global\u003c/span>\u003cspan class=\"concept-chip\">multipolaridade\u003c/span>\u003cspan class=\"concept-chip\">cooperação Sul-Sul\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv aria-hidden=\"true\" class=\"letter-doodles\">\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-globe\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M3 9l5-2 2-4 4 2-1 4 4 2 3-1m-9 2 3 4-2 5M5 17l4-1\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan class=\"letter-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-handshake\" fill=\"none\" focusable=\"false\" height=\"43\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"43\">\u003cpath d=\"M2 8 7 5l5 4 4-4 6 4-5 10-5-3-4 3L2 8zm5-3 3-2 5 2m-3 4 4 3m-6 2 5 3\">\u003c/path>\u003c/svg>\u003c/span>\u003c/div>\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Brasil e Sul Global na nova ordem mundial\u003c/div>\u003cdiv class=\"registro-flow\">\u003cspan class=\"registro-node\">BRICS\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">Sul Global\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">multipolaridade\u003c/span>\u003cspan class=\"registro-arrow\">→\u003c/span>\u003cspan class=\"registro-node\">cooperação Sul-Sul\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>BRICS\u003c/strong> — \u003cspan>Fórum de cooperação entre grandes economias emergentes, cuja composição pode se ampliar ao longo do tempo.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Sul Global\u003c/strong> — \u003cspan>Categoria política e econômica heterogênea usada para discutir países e sociedades marcados por experiências de colonialismo, dependência ou posição periférica no sistema mundial.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>multipolaridade\u003c/strong> — \u003cspan>Distribuição do poder internacional entre vários centros ou polos relevantes.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>cooperação Sul-Sul\u003c/strong> — \u003cspan>Cooperação entre países do Sul Global em áreas como desenvolvimento, ciência, comércio, tecnologia e diplomacia.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">\u003cspan aria-hidden=\"true\" class=\"letter-closing-doodle\">\u003csvg aria-hidden=\"true\" class=\"doodle-svg doodle-earth\" fill=\"none\" focusable=\"false\" height=\"23\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\" viewBox=\"0 0 24 24\" width=\"23\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003cpath d=\"M2 12h20M12 2c-6 6-6 14 0 20M12 2c6 6 6 14 0 20M4 7h16M4 17h16\">\u003c/path>\u003c/svg>\u003c/span>\u003cstrong>Para compreender o processo:\u003c/strong> O BRICS é um fórum de cooperação entre economias emergentes; o Sul Global é uma categoria heterogênea, e dependência, multipolaridade e cooperação Sul-Sul são conceitos distintos.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>O que significa situar o Brasil no chamado Sul Global?\u003c/li>\u003cli>Como relações econômicas e políticas internacionais reproduzem assimetrias entre países?\u003c/li>\u003cli>Que estratégias de cooperação entre países do Sul Global podem ampliar autonomia e capacidade de negociação?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s3-historia-semana-6-glossary-title\">\u003ch4 id=\"s3-historia-semana-6-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Sul Global\u003c/dt>\u003cdd>\u003cp>Categoria político-histórica relacionada a desigualdades e posições na ordem internacional. Não é a lista de países do hemisfério sul nem uma identidade homogênea.\u003c/p>\u003c/dd>\u003cdt>Multipolaridade\u003c/dt>\u003cdd>\u003cp>Distribuição de capacidades e influência entre vários polos. Não implica automaticamente igualdade, paz ou justiça.\u003c/p>\u003c/dd>\u003cdt>Cooperação Sul-Sul\u003c/dt>\u003cdd>\u003cp>Relações de cooperação entre países assim situados. Não elimina assimetrias de recursos e interesses.\u003c/p>\u003c/dd>\u003cdt>BRICS e modalidades de participação\u003c/dt>\u003cdd>\u003cp>Arranjo de cooperação com composição e modalidades que mudam. Membro e país parceiro não são categorias equivalentes; confira a fonte oficial na data da aula.\u003c/p>\u003c/dd>\u003cdt>BRICS\u003c/dt>\u003cdd>\u003cp>Fórum de cooperação entre grandes economias emergentes, cuja composição pode se ampliar ao longo do tempo.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">3ª série · História · Semana 6\u003c/div>\u003ch4>BRASIL E SUL GLOBAL NA NOVA ORDEM MUNDIAL\u003c/h4>\u003c/div>\n\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>Sul Global é categoria política e analítica heterogênea; não é simples sinônimo de hemisfério sul, pobreza ou bloco político unificado. Ela remete a experiências de colonialismo, posição periférica ou semiperiférica na economia mundial e reivindicações de maior voz na governança internacional.\u003c/p>\u003cp>O BRICS é um fórum de articulação e cooperação entre economias emergentes. Em 2026, fontes oficiais brasileiras registram onze membros: África do Sul, Arábia Saudita, Brasil, China, Egito, Emirados Árabes Unidos, Etiópia, Índia, Indonésia, Irã e Rússia. A composição ampliada reforça a necessidade de falar em heterogeneidade: interesses econômicos, regimes políticos e prioridades internacionais não são idênticos.\u003c/p>\u003cp>Teorias da dependência latino-americanas, associadas a autores como Celso Furtado, Fernando Henrique Cardoso e Enzo Faletto, ajudam a pensar relações entre desenvolvimento interno e estrutura internacional. Elas também são diversas entre si e não devem ser condensadas numa fórmula única.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s3-historia-semana-6-study-heading\">\u003ch4 id=\"s3-historia-semana-6-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>Compare objetivos declarados, instrumentos e interesses nacionais. A composição não prova unidade de regime, prioridade ou resultado. Uma análise de dependência precisa identificar relação econômica e mecanismo, não apenas a posição no mapa.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>Evite congelar uma lista de integrantes ou inferir aliança militar a partir de cooperação. Esta preparação remete à página oficial em vez de acrescentar uma contagem que envelheça.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Dois países fictícios cooperam num projeto e disputam condições de financiamento.\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>Cooperação e assimetria podem coexistir; investigue contratos e efeitos para avaliar a relação.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://brics.br/pt-br/sobre-o-brics\" target=\"_blank\" rel=\"noopener\">Presidência brasileira do BRICS — Sobre o BRICS\u003c/a>\u003cp>Fonte oficial: composição e modalidades de participação; conferir na data da aula.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/globalization/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Globalization\u003c/a>\u003cp>Referência conceitual: conexões transnacionais e divergências explicativas.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-study-original\">\u003csummary>Observações e aplicações do material original\u003c/summary>\u003caside class=\"callout curiosity\">\n\u003cdiv class=\"callout-title\">Observação original — conferir documentação\u003c/div>\n\u003cdiv class=\"callout-body\">Em 2026, a presidência do BRICS está com a Índia; documentos oficiais brasileiros registram onze países membros e cooperação em várias áreas além de comércio.\u003c/div>\n\u003c/aside>\u003caside class=\"callout parallel\">\n\u003cdiv class=\"callout-title\">Proposta didática do material original\u003c/div>\n\u003cdiv class=\"callout-body\">Compare BRICS, ONU e outros fóruns apenas em função e composição, evitando transformá-los em 'times' geopolíticos.\u003c/div>\n\u003c/aside>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Os BRICS têm um projeto único e eliminam as desigualdades globais?\u003c/h5>\u003cp>Cooperação internacional convive com interesses distintos e desigualdades entre participantes. Multipolaridade não implica igualdade.\u003c/p>\u003cp>Limite da resposta: Evite congelar uma lista de integrantes ou inferir aliança militar a partir de cooperação. Esta preparação remete à página oficial em vez de acrescentar uma contagem que envelheça.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Sul Global\u003c/dt>\u003cdd>Categoria político-histórica relacionada a desigualdades e posições na ordem internacional. Não é a lista de países do hemisfério sul nem uma identidade homogênea.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Multipolaridade\u003c/dt>\u003cdd>Distribuição de capacidades e influência entre vários polos. Não implica automaticamente igualdade, paz ou justiça.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Cooperação Sul-Sul\u003c/dt>\u003cdd>Relações de cooperação entre países assim situados. Não elimina assimetrias de recursos e interesses.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Os BRICS têm um projeto único e eliminam as desigualdades globais?\u003c/p>\u003c/section>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Leitura e confronto de fontes\u003c/summary>\u003col>\u003cli>Quem produziu a fonte, quando e para qual público? O que sua posição permite observar?\u003c/li>\u003cli>Como imagem, palavras, seleção e silêncios constroem a narrativa?\u003c/li>\u003cli>Que afirmação pode ser sustentada? Qual informação exige outra fonte independente?\u003c/li>\u003c/ol>\u003cp>Para confrontar uma fonte estatal e uma fonte de movimento social: registre autoria, data, gênero e finalidade de cada uma; formule a mesma pergunta para ambas; separe fatos observados, interpretações e reivindicações; compare convergências e divergências; indique o que precisa de corroboração. Nenhuma posição torna a fonte automaticamente verdadeira ou falsa.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Tempo e aplicação opcional\u003c/summary>\u003cp>Possibilidade para 45 minutos: 5 min para uma pergunta; 20 min de explicação e leitura de fonte; 10 min de conversa; 10 min de registro. Ajuste livremente: atividade, debate e explicação podem substituir-se conforme a turma; esta divisão não é uma sequência obrigatória.\u003c/p>\u003cp>Na síntese, avalie: precisão dos conceitos, evidências, relação entre razões e conclusão, melhor objeção e resposta fundamentada. A nota considera a qualidade do argumento, não a concordância com a posição da professora.\u003c/p>\u003c/details>\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Geopolítica, multipolaridade e cooperação Sul-Sul\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Questões objetivas e discursivas\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-052\">\u003ch5>PAS/UnB — 3ª etapa · 2023\u003c/h5>\u003cp class=\"ux-exam-theme\">Brasil, BRICS e liderança no Sul Global\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Cebraspe · Item 68 · PAS 3, parte geral, edital 2023\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Comparar a posição brasileira no Sul Global com relações de poder na ordem internacional; situar cada afirmação no ano da prova.\u003c/p>\u003cp>O conjunto é um registro temático; não é contagem de questões independentes.\u003c/p>\u003c/details>\u003ca href=\"https://cdn.cebraspe.org.br/pas/arquivos/884_PAS3_001_01.pdf\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-021\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Poder dos Estados Unidos na ordem pós-soviética\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Questão 82 · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Conteúdo diretamente relacionado\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Comparar a posição brasileira no Sul Global com relações de poder na ordem internacional; situar cada afirmação no ano da prova.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>\u003csection class=\"ux-bibliography\">\u003ch4>Bibliografia e repertório da semana\u003c/h4>\u003cp>Distinga Sul Global, multipolaridade e cooperação Sul-Sul. Verifique a data de cada informação sobre o BRICS e não trate seus integrantes como um bloco sem divergências.\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://brics.br/pt-br/sobre-o-brics\" target=\"_blank\" rel=\"noopener\">Presidência brasileira do BRICS — Sobre o BRICS\u003c/a>\u003cp>Leitura prioritária para a explicação: Sul Global; Multipolaridade; Cooperação Sul-Sul.\u003c/p>\u003cp>Fonte oficial: composição e modalidades de participação; conferir na data da aula.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://plato.stanford.edu/entries/globalization/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy — Globalization\u003c/a>\u003cp>Leitura complementar: Sul Global; Multipolaridade; Cooperação Sul-Sul.\u003c/p>\u003cp>Referência conceitual: conexões transnacionais e divergências explicativas.\u003c/p>\u003cp class=\"ux-editorial-note\">Texto em inglês; leitura de apoio para a professora.\u003c/p>\u003c/li>\u003cli>\u003ca href=\"https://www.unesco.org/pt/general-history-africa\" target=\"_blank\" rel=\"noopener\">UNESCO — História Geral da África, coleção e recursos audiovisuais\u003c/a>\u003cp>Use a coleção para ampliar a perspectiva africana sobre relações globais. Para composição do BRICS, consulte a fonte específica e sua data.\u003c/p>\u003cp>Coleção acadêmica com volumes e link para série audiovisual da BBC. Verifique idioma e legendas de cada vídeo; a indicação da coleção não afirma que todos estejam em português.\u003c/p>\u003c/li>\u003c/ul>\u003cp class=\"ux-editorial-note\">As indicações são opcionais. Os links identificam texto, catálogo ou acervo; não prometem filme completo gratuito. Antes de levar um trecho à turma, confira contexto, linguagem, duração e adequação.\u003c/p>\u003c/section>\u003c/section>\u003ch4>Roteiro da aula\u003c/h4>\u003cdiv class=\"table-wrap\">\u003ctable class=\"route-table\">\u003ctbody>\u003ctr>\u003cth>Aula\u003c/th>\u003cth>Percurso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Aula da semana\u003c/td>\u003ctd>\u003col class=\"lesson-steps\">\u003cli>Definir Sul Global e questionar o que a categoria inclui/exclui.\u003c/li>\u003cli>Apresentar BRICS, expansão e áreas de cooperação com dados oficiais atualizados.\u003c/li>\u003cli>Comparar multipolaridade, cooperação Sul-Sul e dependência como conceitos diferentes.\u003c/li>\u003c/ol>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout care\">\n\u003cdiv class=\"callout-title\">Cuidado conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Não tratar Sul Global ou BRICS como bloco ideologicamente homogêneo.\u003c/div>\n\u003c/aside>\u003caside class=\"callout map\">\n\u003cdiv class=\"callout-title\">Ajuste sugerido no mapa conceitual\u003c/div>\n\u003cdiv class=\"callout-body\">Sul Global = categoria heterogênea. BRICS = fórum. Multipolaridade = distribuição de poder. Dependência = lente sobre estrutura econômica. Cooperação Sul-Sul = prática de colaboração.\u003c/div>\n\u003c/aside>\n\u003c/div>\u003cdetails>\u003csummary>Respostas e orientações da atividade\u003c/summary>\u003cdiv class=\"share-teacher-answers\">\u003ch5>Roteiro sugerido (90 min)\u003c/h5>\n\u003cul>\u003cli>\u003cb>0–25 min:\u003c/b> projete o texto-base e a turma copia no caderno.\u003c/li>\u003cli>\u003cb>25–80 min:\u003c/b> questões 1 a 3 (compreensão), 4 e 5 (análise e conceitos) e 6 (parágrafo).\u003c/li>\u003cli>\u003cb>80–90 min:\u003c/b> revisão pela lista do aluno; confira por amostra ou recolha.\u003c/li>\u003c/ul>\n\u003cp>Se o tempo apertar, priorize as questões 1, 3, 5 e 6. O parágrafo (questão 6) pode ser avaliado pelos critérios de \"Verificação da aprendizagem\" desta semana.\u003c/p>\n\u003ch5>Resposta esperada\u003c/h5>\u003cp>Q1: fórum de cooperação entre economias emergentes; comércio, finanças, desenvolvimento, reforma de organismos internacionais. Q2: Brasil, Rússia, Índia e China (2009). Q3: países com experiências de colonialismo, dependência ou periferia; interesses diferentes. Q4: mapa com os cinco países e uma diferença de interesse. Q5: ampliar parcerias e voz em um mundo com vários centros de poder. Q6: não; é um grupo específico de países e o Sul Global é heterogêneo. Lembrete da professora: confira a lista atual de membros no Planalto ou no Itamaraty antes da aula.\u003c/p>\u003c/div>\u003c/details>\u003c/section>"}]},{"label":"1ª série · Filosofia","classes":["1ªA","1ªB"],"lessons":[{"exames":"\u003csection class=\"ux-exam-connections\">\u003ch4>Questões já cobradas · 2016–2025\u003c/h4>\u003cp class=\"ux-exam-theme\">Direitos civis, políticos e sociais\u003c/p>\u003cp class=\"ux-editorial-note\">O ano indica a edição; consulte o caderno e a questão informados.\u003c/p>\u003ch4>Temas de redação já cobrados\u003c/h4>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-006\">\u003ch5>Enem — aplicação regular · 2021\u003c/h5>\u003cp class=\"ux-exam-theme\">Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/0ec029ac-140b-424a-9c62-f96095c25d3c/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003carticle class=\"ux-exam-item\" data-exam-ref=\"pesquisa-002\">\u003ch5>Enem — aplicação regular · 2017\u003c/h5>\u003cp class=\"ux-exam-theme\">Desafios para a formação educacional de surdos no Brasil\u003c/p>\u003cp class=\"ux-editorial-note\">Banca: Inep · Proposta de redação · Amarelo, 1º dia, caderno 2\u003c/p>\u003cp class=\"ux-exam-relation\">Aproximação com esta aula\u003c/p>\u003cdetails class=\"ux-exam-context\">\u003csummary>Relação com a aula\u003c/summary>\u003cp>Tema real de redação que permite mobilizar direitos, dignidade ou reconhecimento na análise de uma barreira à participação. É uma aproximação temática; não significa que a proposta cobre Kant ou Honneth nominalmente.\u003c/p>\u003c/details>\u003ca href=\"https://riep.inep.gov.br/bitstreams/68354e24-fce6-4f84-8e71-82a90d9d3229/download\" target=\"_blank\" rel=\"noopener\">Abrir prova ou publicação oficial ↗\u003c/a>\u003c/article>\u003c/section>","id":"s1-filosofia-semana-1","title":"Direitos civis, políticos e sociais","quadro":"\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Direitos civis, políticos e sociais\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Direitos civis\u003c/strong>\u003cspan>Protegem liberdades e garantias da pessoa, como expressão, crença, integridade e igualdade perante a lei.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Direitos políticos\u003c/strong>\u003cspan>Relacionam-se à participação nas decisões públicas, como votar, ser representado e participar da vida política.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Direitos sociais\u003c/strong>\u003cspan>Relacionam-se a condições de vida e de participação, como educação, saúde, trabalho e proteção social.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Interdependência\u003c/strong>\u003cspan>Relação pela qual a realização de um direito pode depender da garantia de outros; a classificação não cria uma hierarquia de valor.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Quadro: dimensão do direito → exemplo → condição de acesso → relação com outro direito.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Diferencie direitos civis, políticos e sociais e dê um exemplo de cada.\u003c/li>\u003cli>Por que o texto afirma que uma situação pode envolver mais de uma dimensão?\u003c/li>\u003cli>Em um caso fictício, uma estudante não encontra transporte acessível para chegar à escola. Que direitos e condições de participação estão relacionados?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>","esquema":"\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Direitos civis\u003c/dt>\u003cdd>Protegem liberdades e garantias da pessoa, como expressão, crença, integridade e igualdade perante a lei.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Direitos políticos\u003c/dt>\u003cdd>Relacionam-se à participação nas decisões públicas, como votar, ser representado e participar da vida política.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Direitos sociais\u003c/dt>\u003cdd>Relacionam-se a condições de vida e de participação, como educação, saúde, trabalho e proteção social.\u003c/dd>\u003c/div>\u003c/dl>\u003cp class=\"ux-board-question\">Ter liberdade de expressão basta para que todas as pessoas possam participar da sociedade?\u003c/p>\u003c/section>","atividade":"\u003cdiv class=\"atv-aluno\">\n\u003cdiv class=\"atv-cab\">\u003ch3 class=\"atv-titulo\">Direitos civis, políticos e sociais\u003c/h3>\n\u003cp class=\"atv-nome\">Nome: ______________________________ Turma: ______ Data: ____/____\u003c/p>\u003c/div>\n\u003csection class=\"atv-p\">\u003ch4>1 · Copie no caderno\u003c/h4>\u003cp class=\"atv-texto\">Direitos humanos protegem a pessoa e sua participação na sociedade. Os direitos civis abrangem liberdades e garantias, como expressão, crença, integridade e igualdade. Os direitos políticos dizem respeito à participação nas decisões públicas. Os direitos sociais incluem condições como educação, saúde, trabalho e proteção social. Essas dimensões se relacionam: ter liberdade para expressar uma opinião não resolve, sozinho, a falta de acesso à educação ou aos espaços de decisão. Uma situação pode envolver mais de uma dimensão. Por isso, classificar um direito é o começo da análise, e não uma forma de colocar direitos em ordem de importância.\u003c/p>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>2 · Responda no caderno, em frases completas\u003c/h4>\u003col class=\"atv-q\">\u003cli>Diferencie direitos civis, políticos e sociais e dê um exemplo de cada.\u003c/li>\u003cli>Por que o texto afirma que uma situação pode envolver mais de uma dimensão?\u003c/li>\u003cli>Em um caso fictício, uma estudante não encontra transporte acessível para chegar à escola. Que direitos e condições de participação estão relacionados?\u003c/li>\u003cli>Faça o organizador sugerido: Quadro: dimensão do direito → exemplo → condição de acesso → relação com outro direito.\u003c/li>\u003cli>Escolha dois conceitos e use cada um em uma frase que explique o caso da aula.\u003c/li>\u003cli>Escreva um parágrafo de 6 a 8 linhas respondendo à questão-problema. Use conceitos e uma razão; considere uma objeção.\u003c/li>\u003c/ol>\u003c/section>\n\u003csection class=\"atv-p\">\u003ch4>3 · Revise antes de entregar\u003c/h4>\u003cul class=\"atv-check\">\u003cli>Respondi a todas as questões, incluindo quadros, esquemas ou classificações.\u003c/li>\u003cli>Usei os termos pedidos nas questões.\u003c/li>\u003cli>Meu parágrafo tem de 6 a 8 linhas e uma ideia central clara.\u003c/li>\u003c/ul>\u003c/section>\n\u003c/div>","fontes":[{"t":"ONU/UNICEF — Declaração Universal dos Direitos Humanos","u":"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos","n":"Texto em português; selecione artigos conforme o objetivo da semana."}],"preparacao":"\u003csection>\u003cdiv class=\"plan-grid\">\u003csection>\u003ch4>Conteúdo\u003c/h4>\u003cp>Direitos civis, políticos e sociais; Direitos civis; Direitos políticos; Direitos sociais; Interdependência.\u003c/p>\u003c/section>\u003csection class=\"wide\">\u003ch4>Leitura e atividade\u003c/h4>\u003cp>Quadro: dimensão do direito → exemplo → condição de acesso → relação com outro direito.\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>BNCC\u003c/h4>\u003cp class=\"code\">EM13CHS605\u003c/p>\u003c/section>\u003csection class=\"meta-curric\">\u003ch4>Matriz SEDUC-GO\u003c/h4>\u003cp class=\"code\">GO-EMCHS606A — direitos civis, políticos e sociais; dignidade em Kant; reconhecimento em Axel Honneth. Matriz 2026, 4º bimestre: recorte fornecido pela professora.\u003c/p>\u003c/section>\u003csection>\u003ch4>Conceitos-chave\u003c/h4>\u003cdiv class=\"concepts\">\u003cspan class=\"concept-chip\">Direitos civis\u003c/span>\u003cspan class=\"concept-chip\">Direitos políticos\u003c/span>\u003cspan class=\"concept-chip\">Direitos sociais\u003c/span>\u003cspan class=\"concept-chip\">Interdependência\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"wide notebook\">\u003cdiv class=\"registro-pronto\">\u003cdiv class=\"registro-titulo\">Direitos civis, políticos e sociais\u003c/div>\u003cdiv class=\"registro-conceitos\">\u003cdiv class=\"registro-conceito\">\u003cstrong>Direitos civis\u003c/strong>\u003cspan>Protegem liberdades e garantias da pessoa, como expressão, crença, integridade e igualdade perante a lei.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Direitos políticos\u003c/strong>\u003cspan>Relacionam-se à participação nas decisões públicas, como votar, ser representado e participar da vida política.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Direitos sociais\u003c/strong>\u003cspan>Relacionam-se a condições de vida e de participação, como educação, saúde, trabalho e proteção social.\u003c/span>\u003c/div>\u003cdiv class=\"registro-conceito\">\u003cstrong>Interdependência\u003c/strong>\u003cspan>Relação pela qual a realização de um direito pode depender da garantia de outros; a classificação não cria uma hierarquia de valor.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"para-lembrar\">Quadro: dimensão do direito → exemplo → condição de acesso → relação com outro direito.\u003c/p>\u003c/div>\u003cdiv class=\"notebook-questions\">\u003cdiv class=\"notebook-questions-title\">Perguntas\u003c/div>\u003cul>\u003cli>Diferencie direitos civis, políticos e sociais e dê um exemplo de cada.\u003c/li>\u003cli>Por que o texto afirma que uma situação pode envolver mais de uma dimensão?\u003c/li>\u003cli>Em um caso fictício, uma estudante não encontra transporte acessível para chegar à escola. Que direitos e condições de participação estão relacionados?\u003c/li>\u003c/ul>\u003c/div>\u003c/section>\u003c/div>\u003csection class=\"ux-glossary\" aria-labelledby=\"s1-filosofia-semana-1-glossary-title\">\u003ch4 id=\"s1-filosofia-semana-1-glossary-title\">Glossário da aula\u003c/h4>\u003cp class=\"ux-glossary-intro\">Definições, critérios e distinções para preparar a explicação. Sentidos específicos de autores estão identificados; exemplos e limites são desenvolvidos na fundamentação abaixo.\u003c/p>\u003cdl>\u003cdt>Direitos civis\u003c/dt>\u003cdd>\u003cp>Protegem liberdades e garantias da pessoa, como expressão, crença, integridade e igualdade perante a lei.\u003c/p>\u003c/dd>\u003cdt>Direitos políticos\u003c/dt>\u003cdd>\u003cp>Relacionam-se à participação nas decisões públicas, como votar, ser representado e participar da vida política.\u003c/p>\u003c/dd>\u003cdt>Direitos sociais\u003c/dt>\u003cdd>\u003cp>Relacionam-se a condições de vida e de participação, como educação, saúde, trabalho e proteção social.\u003c/p>\u003c/dd>\u003cdt>Interdependência\u003c/dt>\u003cdd>\u003cp>Relação pela qual a realização de um direito pode depender da garantia de outros; a classificação não cria uma hierarquia de valor.\u003c/p>\u003c/dd>\u003c/dl>\u003c/section>\u003cdiv class=\"prof-panel\">\u003cdiv class=\"prof-panel-head\">\u003cdiv class=\"prof-context\">1ª série · Filosofia · Semana 1\u003c/div>\u003ch4>Direitos civis, políticos e sociais\u003c/h4>\u003c/div>\u003ch4>Fundamentação acadêmica\u003c/h4>\u003cp>A classificação em direitos civis, políticos e sociais é uma ferramenta de análise. Ela não divide as pessoas em grupos de titulares nem torna os direitos sociais menos importantes. Um mesmo problema pode envolver várias dimensões: a falta de acesso à educação pode limitar trabalho, informação e participação pública.\u003c/p>\u003cp>Use a DUDH para confrontar a classificação com exemplos de direitos. Diferencie a existência de uma garantia, as condições para exercê-la e sua possível violação. A aula trabalha o núcleo da habilidade GO-EMCHS606A; argumentação entra como ferramenta para justificar a análise dos casos.\u003c/p>\u003ch4>Roteiro de aplicação\u003c/h4>\u003cp>Comece pela questão-problema, explique os conceitos, leia a fonte indicada e analise um caso fictício. Feche com um registro e uma justificativa. Adapte o tempo e os recursos à turma.\u003c/p>\u003csection class=\"ux-study\" data-reviewed=\"2026-10-04\" aria-labelledby=\"s1-filosofia-semana-1-study-heading\">\u003ch4 id=\"s1-filosofia-semana-1-study-heading\">Aprofundamento para a explicação\u003c/h4>\u003cp>A classificação em direitos civis, políticos e sociais é uma ferramenta de análise. Ela não divide as pessoas em grupos de titulares nem torna os direitos sociais menos importantes. Um mesmo problema pode envolver várias dimensões: a falta de acesso à educação pode limitar trabalho, informação e participação pública.\u003c/p>\u003cp>Use a DUDH para confrontar a classificação com exemplos de direitos. Diferencie a existência de uma garantia, as condições para exercê-la e sua possível violação. A aula trabalha o núcleo da habilidade GO-EMCHS606A; argumentação entra como ferramenta para justificar a análise dos casos.\u003c/p>\u003caside class=\"ux-study-limit\">\u003ch5>Alcance e limites\u003c/h5>\u003cp>A classificação é analítica e admite sobreposições. Não transforme um caso didático em diagnóstico jurídico nem apresente direitos sociais como favores ou recompensas por mérito.\u003c/p>\u003c/aside>\u003caside class=\"ux-study-example\">\u003ch5>Exemplo didático — situação fictícia\u003c/h5>\u003cp>Em um caso fictício, uma estudante não encontra transporte acessível para chegar à escola. Que direitos e condições de participação estão relacionados?\u003c/p>\u003ch5>Como analisar\u003c/h5>\u003cp>O caso é uma situação fictícia de aplicação dos conceitos, não um relato documentado. Civis: liberdades e garantias; políticos: participação pública; sociais: condições de vida e participação. Aceitar exemplos pertinentes, justificados. Direitos são interdependentes: barreiras à educação também podem limitar acesso à informação, trabalho e participação. Educação e acesso em condições de igualdade; a análise pode incluir autonomia e participação. O caso não basta para determinar responsabilidade jurídica.\u003c/p>\u003c/aside>\u003csection class=\"ux-study-sources\">\u003ch5>Fontes para este aprofundamento\u003c/h5>\u003cul>\u003cli>\u003ca href=\"https://www.unicef.org/brazil/declaracao-universal-dos-direitos-humanos\" target=\"_blank\" rel=\"noopener\">ONU/UNICEF — Declaração Universal dos Direitos Humanos\u003c/a>\u003cp>Texto em português; selecione artigos conforme o objetivo da semana.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Perguntas difíceis\u003c/summary>\u003ch5>Ter liberdade de expressão basta para que todas as pessoas possam participar da sociedade?\u003c/h5>\u003cp>A classificação em direitos civis, políticos e sociais é uma ferramenta de análise. Ela não divide as pessoas em grupos de titulares nem torna os direitos sociais menos importantes. Um mesmo problema pode envolver várias dimensões: a falta de acesso à educação pode limitar trabalho, informação e participação pública. Use a DUDH para confrontar a classificação com exemplos de direitos. Diferencie a existência de uma garantia, as condições para exercê-la e sua possível violação. A aula trabalha o núcleo da habilidade GO-EMCHS606A; argumentação entra como ferramenta para justificar a análise dos casos.\u003c/p>\u003cp>Limite da resposta: A classificação é analítica e admite sobreposições. Não transforme um caso didático em diagnóstico jurídico nem apresente direitos sociais como favores ou recompensas por mérito.\u003c/p>\u003c/details>\u003cdetails class=\"ux-teacher-guide\">\u003csummary>Modelo de registro no quadro\u003c/summary>\u003cp>Separe os conceitos em blocos. Leia as diferenças antes de relacioná-los; setas só devem indicar uma relação explicitamente justificada. O esquema também está disponível na projeção.\u003c/p>\u003csection class=\"ux-board-model\">\u003ch3>Esquema sugerido para o quadro\u003c/h3>\u003cp class=\"ux-board-caption\">Esquema de conceitos · leia cada bloco e compare os sentidos.\u003c/p>\u003cdl>\u003cdiv class=\"ux-board-concept\">\u003cdt>Direitos civis\u003c/dt>\u003cdd>Protegem liberdades e garantias da pessoa, como expressão, crença, integridade e igualdade perante a lei.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Direitos políticos\u003c/dt>\u003cdd>Relacionam-se à participação nas decisões públicas, como votar, ser representado e participar da vida política.\u003c/dd>\u003c/div>\u003cdiv class=\"ux-board-concept\">\u003cdt>Direitos sociais\u003c/dt>\u003cdd>Relacionam-se a condições de vida e de participação, como educação, saúde, trabalho e proteção social.\u003c/dd>\u003c/div>\u003c/dl
